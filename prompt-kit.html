<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'">
<title>プロンプト集 for Gemini</title>
<style>
:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --panel-2: #fbfaf7;
  --ink: #1f2328;
  --sub: #4f555c;
  --faint: #60656c;
  --line: #e1ddd3;
  --line-strong: #c9c3b6;
  --accent: #0f6b66;
  --accent-dark: #0b5753;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ef;
  --warn: #8a4400;
  --warn-soft: #fff3e0;
  --star: #8a5d00;
  --code: #f3f1ec;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.8 "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
  display: flex; flex-direction: column;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h2, h3, h4 { line-height: 1.45; }
/* フォーカスは濃い輪郭＋白の縁取りで、どの背景でも 3:1 以上にする */
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 2px #fff; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ヘッダー */
.top {
  display: flex; align-items: center; gap: 16px 24px;
  padding: 0 24px; height: 64px; flex: none;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { margin: 0; font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand button { border: 0; background: none; padding: 0; font-weight: 700; }
.brand small { font-weight: 400; color: var(--sub); margin-left: 8px; font-size: 14px; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tabs button {
  border: 0; background: none; padding: 0 16px; height: 100%; white-space: nowrap;
  color: var(--sub); border-bottom: 3px solid transparent; font-weight: 600;
}
.tabs button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.top-search { flex: 1; max-width: 440px; margin-left: auto; position: relative; }
.top-search input {
  width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel-2);
}
.top-search input::placeholder { color: #5f6368; }
.top-search input:focus { background: #fff; border-color: var(--accent); }
.top-actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 10px;
  padding: 8px 16px; font-weight: 600; font-size: 15px; white-space: nowrap; line-height: 1.4;
}
.btn:hover { border-color: var(--sub); background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-dark); }
.btn.big { min-height: 56px; font-size: 17px; width: 100%; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.btn.danger { color: #a12a2a; }
.btn.danger.armed { background: #a12a2a; color: #fff; border-color: #a12a2a; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 4px 0; text-decoration: underline; min-height: 0; }

/* レイアウト */
main { flex: 1; min-height: 0; }
.tab { height: 100%; }
.tab[hidden] { display: none; }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.split.wide { grid-template-columns: minmax(0, 1fr); }
.split.wide > .side { display: none; }
.side {
  border-right: 1px solid var(--line); background: var(--panel-2);
  overflow-y: auto; padding: 16px 12px 40px;
}
.content { overflow-y: auto; padding: 32px 40px 96px; height: 100%; min-width: 0; }
.content-inner { max-width: 880px; margin: 0 auto; }
.content-inner.wide { max-width: 1160px; }

/* 共通の部品 */
.crumb { font-size: 14px; color: var(--sub); margin: 0 0 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.crumb button { border: 0; background: none; padding: 0 2px; min-height: 44px; display: inline-flex; align-items: center; color: var(--accent); text-decoration: underline; font-size: 15px; }
.page-title { margin: 0 0 4px; font-size: 26px; }
.lead { color: var(--sub); margin: 0 0 24px; }
.badge {
  display: inline-block; font-size: 13px; font-weight: 600; padding: 0 10px; border-radius: 999px;
  line-height: 1.8; background: #eeebe4; color: var(--sub); white-space: nowrap;
}
.badge.gem { background: #ece8f7; color: #4b3a8a; }
.badge.md { background: #e6eef8; color: #24477a; }
.badge.att { background: var(--accent-soft); color: #0b4f4b; }
.badge.req { background: #fde8e8; color: #8f2424; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { font-size: 14px; color: var(--sub); }
.empty { color: var(--sub); font-size: 15px; padding: 8px 0; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px;
}
.card h3 { margin: 0 0 12px; font-size: 18px; }
.num {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; flex: none;
}

/* ホーム（ダッシュボード） */
.dash-sec { margin-bottom: 40px; }
.sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
.sec-head h3 { margin: 0; font-size: 20px; flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.tile {
  display: flex; flex-direction: column; gap: 8px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; min-height: 150px;
}
.tile:hover { border-color: var(--accent); }
.tile-head { display: flex; align-items: baseline; gap: 8px; }
.tile-head strong { font-size: 17px; flex: 1; }
.tile-head .count { font-size: 14px; color: var(--faint); }
.tile-list { display: block; font-size: 14px; color: var(--sub); line-height: 1.7; }
.tile-list span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-list span::before { content: "・"; }
.tile-more { font-size: 13px; color: var(--accent); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.pcard {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px 20px;
}
.pcard:hover { border-color: var(--accent); }
.pcard-cat { font-size: 13px; color: var(--faint); }
.pcard-title { font-weight: 700; font-size: 16px; line-height: 1.5; }
.pcard-title .fav { color: var(--star); margin-left: 6px; }
.pcard-sum { font-size: 14px; color: var(--sub); line-height: 1.7; }
.pcard .badges { margin-top: 2px; }

/* サイドの一覧（詳細のとき） */
.side-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.side-title { font-weight: 700; font-size: 14px; color: var(--sub); padding: 8px 10px 4px; display: flex; justify-content: space-between; }
.item {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  padding: 8px 12px; border-radius: 10px; line-height: 1.5; min-height: 44px;
}
.item:hover { background: #f0ede6; }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.item[aria-current="true"] .t { color: #0b4f4b; }
.item .t { display: block; font-weight: 600; font-size: 15px; }
.item .fav { color: var(--star); margin-left: 4px; }

/* 詳細 */
.title-row { display: flex; align-items: flex-start; gap: 12px; margin: 4px 0 4px; }
.title-row h2 { margin: 0; font-size: 26px; flex: 1; }
.title-row h2:focus { outline: none; box-shadow: none; }
.star {
  min-height: 44px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 10px;
  padding: 6px 12px; font-size: 15px; color: var(--sub); white-space: nowrap;
}
.star[aria-pressed="true"] { color: var(--star); border-color: #e0c27a; background: #fff9e8; }
.chain-banner {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  background: var(--accent-soft); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 24px; font-size: 15px;
}
.chain-banner p { margin: 0; flex: 1; min-width: 240px; }
.send-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.send-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.send-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.send-list .lbl { font-weight: 600; }
.md-note { margin: 16px 0 0; font-size: 14px; background: #e6eef8; color: #24477a; border-radius: 8px; padding: 8px 12px; }
.my-note { margin: 12px 0 0; font-size: 14px; color: var(--warn); }
.how { margin: 12px 0 0; padding-left: 20px; font-size: 15px; color: var(--ink); line-height: 1.8; }
.send-action .check { margin-top: 8px; }
.kbd-hint { display: block; margin-top: 8px; font-size: 13px; color: var(--faint); text-align: center; }
.warn {
  background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px;
  font-size: 14px; margin-top: 12px;
}
.dtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; margin: 0 -24px 20px; padding: 0 24px; }
.dtabs button {
  border: 0; background: none; padding: 10px 14px; min-height: 48px; white-space: nowrap;
  color: var(--sub); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.dtabs button:focus-visible, .tabs button:focus-visible { outline-offset: -3px; box-shadow: inset 0 0 0 4px #fff; }
.dtabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.dtabs button:hover { color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px; }
.preview {
  white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 480px; overflow: auto;
  background: var(--code); border-radius: 8px; padding: 16px; font-size: 14px; line-height: 1.75;
  font-family: "BIZ UDGothic", "Yu Gothic UI", "Meiryo", monospace;
}
.chars { font-size: 14px; color: var(--sub); }
details.more > summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
details.more[open] > summary { margin-bottom: 8px; }
.fu { border-top: 1px solid var(--line); padding: 12px 0; }
.fu:first-of-type { border-top: 0; }
.fu-head { display: flex; align-items: center; gap: 12px; }
.fu-head strong { flex: 1; font-size: 15px; }
.fu p { margin: 4px 0 0; font-size: 14px; color: var(--sub); white-space: pre-wrap; }
.fu-label { font-size: 14px; font-weight: 700; color: var(--sub); margin: 8px 0 0; }
.tips { margin: 0; white-space: pre-wrap; }
.gem-steps { margin: 0 0 12px; padding-left: 22px; font-size: 15px; }
.md-save > summary { cursor: pointer; font-weight: 700; font-size: 17px; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 40px; }
.md-save > summary::-webkit-details-marker { display: none; }
.md-save > summary::before { content: "▸"; color: var(--sub); transition: transform .15s; }
.md-save[open] > summary::before { transform: rotate(90deg); }
.md-save[open] > summary { margin-bottom: 12px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.field input, .field textarea, .dialog-body input, .dialog-body textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff;
}
.field textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.next-list { display: flex; flex-direction: column; gap: 8px; }
.next {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 56px;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 10px 16px;
}
.next:hover { border-color: var(--accent); }
.next .via { font-size: 13px; color: var(--sub); display: block; }
.next .arrow { color: var(--accent); font-weight: 700; }

/* 流れ（gemini-kit の使い方と同じ形: 入れるもの → 使う場所 → 出るもの → 次に持っていく先） */
.fl-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.fl-nav button {
  min-height: 44px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px;
  padding: 6px 16px; font-size: 14px; font-weight: 600; color: var(--ink);
}
.fl-nav button:hover { border-color: var(--accent); }
.fl-nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.fl-step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 24px; margin-bottom: 16px; scroll-margin-top: 16px; }
.fl-step:focus { outline: none; }
.fl-step:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.fl-step-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.fl-step-h h3 { margin: 0; font-size: 19px; flex: 1; min-width: 200px; }
.fl-no { font-size: 14px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 12px; white-space: nowrap; }
.fl-frames { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); align-items: stretch; gap: 8px; margin: 16px 0; }
.fl-frame { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); min-width: 0; }
.fl-frame ul { margin: 0; padding-left: 1.2em; font-size: 14px; line-height: 1.7; }
.fl-frame-h { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--sub); }
.fl-frame-sub { margin: 6px 0 0; font-size: 13px; color: var(--sub); }
.fl-frame--where { text-align: center; background: var(--panel); }
.fl-frame--out { border-color: #9cc9c4; background: var(--accent-soft); }
.fl-arrow { align-self: center; font-size: 20px; color: var(--sub); }
.fl-where { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 6px; border: 1.5px solid; white-space: nowrap; }
.fl-where--gem { color: #24477a; border-color: #24477a; background: #e6eef8; }
.fl-where--canvas { color: #4b3a8a; border-color: #4b3a8a; background: #ece8f7; border-style: double; border-width: 3px; padding: 0 9px; }
.fl-where--nlm { color: #5a3b00; border-color: #a58000; background: #fff6e0; border-style: dashed; }
.fl-where--kit { color: #0b4f4b; border-color: #0f6b66; background: var(--accent-soft); border-style: dotted; }
.fl-how { margin: 0 0 12px; padding-left: 1.4em; font-size: 15px; line-height: 1.8; }
.fl-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.fl-intro { margin: 0 0 16px; color: var(--sub); }
.chain-links { display: flex; flex-wrap: wrap; gap: 8px; }
.chain-links button {
  min-height: 44px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px;
  padding: 6px 16px; font-size: 14px; font-weight: 600;
}
.chain-links button:hover { border-color: var(--accent); }
details.basic > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700; font-size: 20px; }
details.basic > summary::-webkit-details-marker { display: none; }
details.basic > summary::before { content: "▸"; color: var(--sub); font-size: 16px; transition: transform .15s; }
details.basic[open] > summary::before { transform: rotate(90deg); }
details.basic[open] > summary { margin-bottom: 12px; }

/* 自分の情報 */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, 92vw); max-height: 90vh; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog[open] { display: flex; }
dialog form { display: flex; flex-direction: column; min-height: 0; width: 100%; }
dialog::backdrop { background: rgba(20, 24, 28, .4); }
.dialog-head { padding: 20px 24px 0; flex: none; }
.dialog-head h2 { margin: 0; font-size: 20px; }
.dialog-body { overflow-y: auto; min-height: 0; flex: 1; padding: 12px 24px; }
.dialog-body textarea { min-height: 80px; }
.dialog-foot { flex: none; display: flex; gap: 12px; padding: 12px 24px 20px; align-items: center; border-top: 1px solid var(--line); }
.dialog-foot .grow { flex: 1; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: #1f2328; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 15px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) {
  .send-grid { grid-template-columns: minmax(0, 1fr); }
  .send-action { order: -1; }
}
@media (max-width: 860px) {
  .top { flex-wrap: wrap; height: auto; gap: 8px; padding: 8px 12px 0; }
  .brand { flex: 1; min-width: 0; font-size: 16px; }
  .brand small { display: none; }
  .top-actions { gap: 6px; }
  .top-actions .btn { min-height: 40px; padding: 6px 10px; font-size: 14px; }
  .top-search { order: 3; flex-basis: 100%; max-width: none; margin: 0; }
  .tabs { order: 4; width: 100%; height: 48px; }
  .tabs button { flex: 1; padding: 0 6px; }
  .split, .split.wide { grid-template-columns: minmax(0, 1fr); height: auto; }
  .split > .side { display: none; }
  .tab { height: auto; }
  main { overflow-y: auto; }
  .content { padding: 20px 16px 72px; height: auto; overflow: visible; }
  .fl-nav { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px 20px; padding: 2px 16px 8px; }
  .fl-nav button { flex: none; }
  .fl-frames { grid-template-columns: minmax(0, 1fr); }
  .fl-arrow { transform: rotate(90deg); justify-self: center; }
  .fl-step { padding: 16px; }
  .tiles, .cards { grid-template-columns: minmax(0, 1fr); }
  .tile { min-height: 0; }
  .page-title, .title-row h2 { font-size: 22px; }
  .card { padding: 20px 16px; }
  .dtabs { margin: 0 -16px 16px; padding: 0 16px; }
  input, textarea { font-size: 16px; }
  .dialog-foot { flex-direction: column; align-items: stretch; }
  .dialog-foot .grow { display: none; }
  #settings-save { order: 1; }
  #settings-cancel { order: 2; }
  #clear-storage { order: 3; margin-top: 10px; }
  .kbd-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand"><button type="button" id="brand-home">プロンプト集</button><small>for Gemini・71件</small></h1>
  <nav class="tabs" aria-label="画面の切り替え">
    <button type="button" id="tab-btn-prompts" data-tab="prompts" aria-current="page">ホーム</button>
    <button type="button" id="tab-btn-flows" data-tab="flows">使い方</button>
  </nav>
  <div class="top-search">
    <input id="search" type="search" placeholder="検索（例: 議事録）" aria-label="プロンプトを検索（/ キーで移動、Esc で消す）">
  </div>
  <div class="top-actions">
    <button class="btn" id="save-html" type="button" title="このページを prompt-kit.html として保存します">HTML を保存</button>
    <button class="btn" id="open-settings" type="button">自分の情報</button>
  </div>
</header>

<main>
  <section class="tab split wide" id="tab-prompts" aria-label="ホーム">
    <aside class="side" id="side" aria-label="同じカテゴリのプロンプト"></aside>
    <div class="content" id="main-scroll"><div class="content-inner wide" id="detail"></div></div>
  </section>

  <section class="tab" id="tab-flows" aria-label="使い方" hidden>
    <div class="content" id="flows-scroll"><div class="content-inner wide" id="flows"></div></div>
  </section>
</main>

<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" id="settings-form">
    <div class="dialog-head">
      <h2 id="settings-title">自分の情報</h2>
      <p class="hint">ここに入れた内容は、プロンプトの「書き手の情報」や文体の指定に自動で入ります。このブラウザにだけ保存されます。空欄の項目は使いません。</p>
    </div>
    <div class="dialog-body" id="settings-fields"></div>

<script type="application/json" id="data">{"categories":[{"id":"meeting","label":"会議・議事録"},{"id":"reading","label":"資料の読解"},{"id":"notebooklm","label":"NotebookLM・質問箱"},{"id":"ppt","label":"PowerPoint・スライド"},{"id":"html","label":"HTML・UI"},{"id":"writing","label":"文書・メール"},{"id":"thinking","label":"思考支援"},{"id":"planning","label":"段取り"},{"id":"numbers","label":"表・数値"},{"id":"design","label":"システム設計・データ"},{"id":"manual","label":"手順書・引き継ぎ"},{"id":"image","label":"画像（読み取り・生成）"},{"id":"research","label":"調査"},{"id":"notice","label":"告知・案内"},{"id":"training","label":"研修・勉強会"},{"id":"translate","label":"翻訳・英文"},{"id":"meta","label":"プロンプトを良くする"}],"prompts":[{"id":"meeting-prep","title":"会議の準備","category":"meeting","summary":"議題と資料から、決めたいこと・論点・想定反論・事前確認を1枚にする","recommendGem":false,"mdName":"会議の準備","order":1,"vars":[{"key":"topic","label":"会議の議題・目的","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 来期の販促予算の配分を決める"},{"key":"materials","label":"事前資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"position","label":"自分の立場・言いたいこと","multiline":true,"optional":true,"attachable":false,"placeholder":""},{"key":"attendees","label":"参加者と関心ごと","multiline":true,"optional":true,"attachable":false,"placeholder":"例: 部長（費用対効果を重視）、営業課長（現場の負担を気にする）"}],"prompt":"# 役割\nあなたは会議の段取りに強い参謀です。私が会議で迷わず発言し、時間内に結論を出せるように準備を手伝ってください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 会議の議題・目的\n{{topic}}\n\n## 事前資料\n\"\"\"\n{{materials}}\n\"\"\"\n\n## 自分の立場・言いたいこと\n{{position}}\n\n## 参加者と関心ごと\n{{attendees}}\n\n# 手順\n1. 議題と資料から、この会議で「決めるべきこと」を特定する\n2. 決めるために答えを出す必要がある論点を洗い出す\n3. 論点ごとに選択肢と、私の立場から推す案とその根拠を整理する\n4. 参加者の関心ごとから、出そうな反論と答え方を考える\n5. 会議の前に確かめておくべきことを挙げる\n\n# 出力形式\n## 1. この会議のゴール\n「〇〇を決める」の形で1〜2行。\n\n## 2. 論点\n| No | 論点 | 選択肢 | 推す案 | 根拠 | 資料の該当箇所 |\n|---|---|---|---|---|---|\n\n## 3. 想定される反論と答え方\n| 反論 | 言いそうな人 | 答え方（30秒で言える長さ） | 用意する根拠 |\n|---|---|---|---|\n\n## 4. 会議の前に確かめること\n- 誰に・何を・いつまでに\n\n## 5. 冒頭の切り出し\n会議の最初に私が言う一言（30秒、150字程度）。\n\n# 守ること\n- 資料に無いことは推測で埋めず「不明」と書く\n- 根拠には資料の該当箇所（見出しやページ、短い引用）を示す\n- 一般論ではなく、この資料と議題に即して書く\n\n# 最後に確認\n出力の前に、ゴールが「決める」形で書かれているか、論点がゴールに必要なものだけか、反論ごとに答え方があるかを確かめ、足りなければ直してから出す。","tips":"自分の立場を書くと、推す案と反論の答え方が具体的になります。\n参加者の関心ごとは一言でも効きます（「部長はコスト重視」など）。","example":"## 1. この会議のゴール\n来期の販促予算 1,200 万円を、Web 広告と展示会にどう配分するかを決める。\n\n## 2. 論点\n| No | 論点 | 選択肢 | 推す案 | 根拠 | 資料の該当箇所 |\n|---|---|---|---|---|---|\n| 1 | 展示会を続けるか | 継続 / 縮小 / 中止 | 縮小（2回→1回） | 1回あたりの商談数が前年比 -40% | p.4「展示会実績」 |\n\n## 3. 想定される反論と答え方\n| 反論 | 言いそうな人 | 答え方 | 用意する根拠 |\n|---|---|---|---|\n| 展示会をやめると既存顧客との接点が減る | 営業課長 | 残す1回を既存顧客の多い東京会場にし、接点は維持します | 来場者の既存顧客比率（不明・要確認） |","gem":"","followups":[{"title":"反論をもっと厳しく","text":"いちばん強い反対意見を言う人になりきって、反論を3つ追加してください。答え方が苦しくなるものを優先してください。"},{"title":"資料が足りないと言われた","text":"この会議までに追加で用意すべきデータを、作る手間が小さい順に並べてください。"}]},{"id":"agenda","title":"アジェンダ作成","category":"meeting","summary":"目的と話したいことから、時間配分つきの議題案を作る","recommendGem":false,"mdName":"アジェンダ","order":2,"vars":[{"key":"purpose","label":"会議の目的","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 新システム導入の可否を決める"},{"key":"duration","label":"会議の時間","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 60分"},{"key":"topics","label":"話したいこと","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"attendees","label":"参加者","multiline":true,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは会議の進行役です。時間内にゴールへ着くアジェンダを作ってください。\n\n# 入力\n## 会議の目的\n{{purpose}}\n\n## 会議の時間\n{{duration}}\n\n## 話したいこと\n\"\"\"\n{{topics}}\n\"\"\"\n\n## 参加者\n{{attendees}}\n\n# 手順\n1. 目的から、会議の終わりに出ていてほしい成果物（決定・合意・役割分担など）を決める\n2. 話したいことを「共有」「議論」「決定」に分ける\n3. 決定が要る議題を前半に置き、共有だけのものは事前の資料配布やチャットで済ませられないか検討する\n4. 合計が会議の時間に収まるよう配分する。最後に5分以上の「決定事項と ToDo の確認」を入れる\n\n# 出力形式\n## 会議のゴール\n1行。\n\n## アジェンダ\n| 時間 | 議題 | 種類（共有・議論・決定） | 進め方 | 担当 | 事前準備 |\n|---|---|---|---|---|---|\n\n## 会議の前に配るもの\n- 資料と、読んでおいてほしい点\n\n## 会議から外した方がよい議題\n- 理由と代わりの手段（なければ「なし」）\n\n# 守ること\n- 時間の合計を会議の時間と一致させる\n- 担当が分からない議題は「不明」と書く\n- 入力に無い議題を勝手に足さない（足した方がよいものは「外した方がよい議題」の後に提案として書く）\n\n# 最後に確認\n時間の合計、決定の議題が前半にあるか、最後の確認の時間があるかを確かめてから出す。","tips":"話したいことは思いつくまま箇条書きで構いません。\n出力のアジェンダはそのまま招集メールに貼れます。","example":"## 会議のゴール\n新システムを来期に導入するかどうかを決め、決まった場合の担当を割り当てる。\n\n## アジェンダ\n| 時間 | 議題 | 種類 | 進め方 | 担当 | 事前準備 |\n|---|---|---|---|---|---|\n| 0:00-0:05 | 目的と進め方の確認 | 共有 | 司会が説明 | 司会 | なし |\n| 0:05-0:30 | 導入の可否 | 決定 | 比較表を見て賛否を一人ずつ | 情シス 田中 | 比較表を前日配布 |\n| 0:55-1:00 | 決定事項と ToDo の確認 | 決定 | 画面に議事録を映して読み上げ | 書記 | なし |","gem":"","followups":[{"title":"時間が足りない","text":"会議の時間を半分にするとしたら、何を削り、何を事前共有に回すかを示して、アジェンダを作り直してください。"}]},{"id":"transcript-clean","title":"文字起こしの整形","category":"meeting","summary":"誤変換・言いよどみを直し、話者を整理する。要約はしない","recommendGem":true,"mdName":"文字起こし","order":3,"vars":[{"key":"transcript","label":"文字起こし","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"speakers","label":"話者の対応","multiline":true,"optional":true,"attachable":false,"placeholder":"例: 話者1=田中（営業）、話者2=佐藤（企画）"},{"key":"glossary","label":"用語・固有名詞","multiline":true,"optional":true,"attachable":false,"placeholder":"例: ぶんせきや（社名）、KPI、〇〇プロジェクト"}],"prompt":"# 役割\nあなたは会議の文字起こしを校正する編集者です。内容を変えずに、読める文章に整えてください。\n\n# 目的\n自動文字起こしの誤変換・言いよどみ・細切れの行を整え、後で議事録を作る素材にする。**要約はしない。**\n\n# 入力\n## 文字起こし\n\"\"\"\n{{transcript}}\n\"\"\"\n\n## 話者の対応\n{{speakers}}\n\n## 用語・固有名詞\n{{glossary}}\n\n# 手順\n1. 話者の対応があれば、話者名を置き換える\n2. 「えー」「あのー」「なんか」などの言いよどみと、同じ語の言い直しを取り除く\n3. 同じ話者の細切れの発言を1つの段落にまとめる\n4. 明らかな誤変換を直す。用語・固有名詞の一覧があれば、それに合わせる\n5. 直す自信がない語は直さず、`[?元の語]` と印を付ける\n\n# 出力形式\n**話者名**（時刻があれば時刻）: 発言\n\nの形で、発言順に全文を出す。最後に次の表を付ける。\n\n## 判断が必要な箇所\n| 箇所（話者と発言の冒頭） | 元の語 | 候補 | 理由 |\n|---|---|---|---|\n\n# 守ること\n- 発言を削らない・要約しない・順番を変えない\n- 意味が変わる修正をしない。迷ったら直さず印を付ける\n- 話者が分からない発言は **不明** とする\n- 出力が長くて一度に出し切れないときは、区切りのよい所で止めて「続きは『続き』と送ってください」と書く\n\n# 最後に確認\n元の発言が抜けていないか、要約していないかを確かめてから出す。","tips":"長い文字起こしはファイルで添付する方が確実です。\n用語の一覧を入れると、社名や製品名の誤変換が大きく減ります。\nこの出力を「文字起こし → 議事録」の素材に使うと、議事録の精度が上がります。","example":"**田中**（10:02）: 展示会の件ですが、去年は商談につながったのが12件で、一昨年の半分くらいでした。\n\n**佐藤**（10:03）: その12件のうち、受注まで行ったのは何件ですか。\n\n**田中**（10:03）: 3件です。[?ぶんせき屋]さん経由の紹介が1件あります。\n\n## 判断が必要な箇所\n| 箇所 | 元の語 | 候補 | 理由 |\n|---|---|---|---|\n| 田中 10:03「3件です」 | ぶんせき屋 | ぶんせきや（社名） | 用語一覧に近い表記がある |","gem":"","followups":[{"title":"要約されてしまった","text":"要約せずに、元の発言をすべて残した形でやり直してください。削ったのは言いよどみと言い直しだけにしてください。"},{"title":"話者が混ざっている","text":"発言の内容（役職・担当の話題）から話者を推定し直してください。推定した箇所には（推定）と付けてください。"}]},{"id":"minutes","title":"文字起こし → 議事録","category":"meeting","summary":"決定事項・ToDo（担当・期限）・保留を表で出す","recommendGem":true,"mdName":"議事録","order":4,"vars":[{"key":"meeting","label":"会議名","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 第3回 販促企画会議"},{"key":"date","label":"日時","multiline":false,"optional":true,"attachable":false,"placeholder":""},{"key":"members","label":"参加者","multiline":false,"optional":true,"attachable":false,"placeholder":""},{"key":"transcript","label":"文字起こし","multiline":true,"optional":false,"attachable":true,"placeholder":""}],"prompt":"# 役割\nあなたは正確さを最優先する議事録係です。会議に出ていない人が読んでも、何が決まり、誰が何をするかが分かる議事録を作ってください。\n\n# 入力\n## 会議名\n{{meeting}}\n\n## 日時\n{{date}}\n\n## 参加者\n{{members}}\n\n## 文字起こし\n\"\"\"\n{{transcript}}\n\"\"\"\n\n# 手順\n1. 文字起こしを最後まで読み、議題ごとに発言をまとめる\n2. 「決定」と「提案・意見」を分ける。決定は、合意したことが発言から確認できるものだけにする\n3. 「〜します」「〜までにやります」などの発言から ToDo を拾い、担当と期限を付ける\n4. 結論が出なかった論点を保留として拾い、次に誰が何をすれば決まるかを書く\n5. 文字起こしだけでは判断できない箇所を、確認が必要な点として挙げる\n\n# 出力形式\n# 議事録: {会議名}\n- 日時: \n- 参加者: \n\n## 要点（3行）\n\n## 決定事項\n| No | 決定内容 | 根拠となった発言（話者） |\n|---|---|---|\n\n## ToDo\n| No | 内容 | 担当 | 期限 |\n|---|---|---|---|\n\n## 保留・未決事項\n| 論点 | 決まっていないこと | 次に誰が何をするか |\n|---|---|---|\n\n## 議論の要旨\n議題ごとに見出しを立て、主な意見を「話者: 要旨」の箇条書きで。\n\n## 確認が必要な点\n- 聞き取れない・矛盾する・担当が曖昧な箇所\n\n# 守ること\n- 文字起こしに無いことは推測で埋めず「不明」と書く（担当・期限は特に）\n- 提案を決定として書かない\n- 数字・日付・固有名詞は発言のまま書く\n- 敬語や言いよどみは整えてよいが、意味は変えない\n\n# 最後に確認\n出力の前に、決定事項それぞれに根拠の発言があるか、ToDo の担当と期限が埋まっているか（不明なら「不明」）を確かめ、足りなければ直してから出す。","tips":"文字起こしが崩れているときは、先に「文字起こしの整形」をかけると精度が上がります。\n参加者を書いておくと、話者の取り違えが減ります。\nGem に登録しておくと、毎回ファイルを添付するだけで済みます。","example":"# 議事録: 第3回 販促企画会議\n- 日時: 2026年11月10日 10:00-11:00\n- 参加者: 田中、佐藤、鈴木\n\n## 要点（3行）\n- 来期の展示会は2回から1回に減らす\n- 浮いた予算は Web 広告に回す方向。配分は次回決める\n- 鈴木さんが Web 広告の見積もりを11/20までに取る\n\n## 決定事項\n| No | 決定内容 | 根拠となった発言（話者） |\n|---|---|---|\n| 1 | 来期の展示会は東京の1回のみとする | 「じゃあ東京だけにしましょう」（田中）→ 全員同意 |\n\n## ToDo\n| No | 内容 | 担当 | 期限 |\n|---|---|---|---|\n| 1 | Web 広告3社の見積もり取得 | 鈴木 | 11/20 |\n| 2 | 展示会の出展申込 | 不明 | 不明 |\n\n## 保留・未決事項\n| 論点 | 決まっていないこと | 次に誰が何をするか |\n|---|---|---|\n| Web 広告の予算 | 金額と配分 | 鈴木さんの見積もりを見て次回決定 |","gem":"","followups":[{"title":"決定と提案が混ざっている","text":"決定事項の表を見直し、合意が発言で確認できないものは「保留・未決事項」へ移してください。移した理由も添えてください。"},{"title":"ToDo が少ない","text":"「確認します」「調べておきます」「送ります」などの発言も ToDo として拾い直してください。"},{"title":"議事録が長い","text":"「議論の要旨」を議題ごとに3行以内に縮めてください。決定事項・ToDo・保留はそのまま残してください。"}]},{"id":"followup-mail","title":"議事録 → フォローアップメール","category":"meeting","summary":"議事録から送付メールと、担当者ごとの ToDo 一覧を作る","recommendGem":false,"mdName":"","order":5,"vars":[{"key":"minutes","label":"議事録","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"recipients","label":"宛先","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 参加者全員（社内）/ 先方の担当者（社外）"},{"key":"note","label":"一緒に伝えたいこと","multiline":true,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは仕事の早い事務局です。会議の後にすぐ送れるフォローアップメールを作ってください。\n\n# 前提\n書き手:\n{{my.profile}}\n文体: {{my.tone}}\n\n# 入力\n## 宛先\n{{recipients}}\n\n## 議事録\n\"\"\"\n{{minutes}}\n\"\"\"\n\n## 一緒に伝えたいこと\n{{note}}\n\n# 手順\n1. 宛先が社内か社外かで敬語の度合いを決める\n2. 議事録から決定事項・ToDo・次回予定を抜き出す\n3. 読み手が自分の宿題をすぐ見つけられる順に並べる\n\n# 出力形式\n## メール\n件名: 【共有】{会議名} の決定事項と ToDo（{日付}）\n\n本文:\n- お礼（1行）\n- 決定事項（箇条書き）\n- ToDo（「担当: 内容（期限）」の箇条書き）\n- 次回予定\n- 締め（1行）\n- 署名（書き手の情報から）\n\n## 担当者ごとの ToDo\n担当者ごとに見出しを立て、その人の ToDo だけを並べる（チャットで個別に送る用）。\n\n# 守ること\n- 議事録に無いことを書かない。担当や期限が「不明」のものは「（担当未定）」と書き、確認をお願いする一文を添える\n- 本文は 400 字程度に収める\n- 社外宛てのときは社内の事情（人事・予算の内訳など）を書かない\n\n# 最後に確認\nすべての ToDo が漏れなく載っているか、担当未定のものに確認のお願いがあるかを確かめてから出す。","tips":"「文字起こし → 議事録」の出力をそのまま貼れます。\n右上の「自分の情報」を入れておくと署名が入ります。","example":"件名: 【共有】第3回 販促企画会議の決定事項と ToDo（11/10）\n\n皆さま\n\n本日はありがとうございました。決定事項と ToDo を共有します。\n\n■ 決定事項\n・来期の展示会は東京の1回のみとする\n\n■ ToDo\n・鈴木さん: Web 広告3社の見積もり取得（11/20まで）\n・（担当未定）展示会の出展申込 → 担当をご相談させてください\n\n■ 次回\n11/24（月）10:00〜","gem":"","followups":[{"title":"もっと短く","text":"チャットで送れるよう、200字以内の版も作ってください。"}]},{"id":"minutes-trend","title":"複数回の議事録 → 論点の変化","category":"meeting","summary":"何回分もの議事録から、論点の移り変わりと持ち越された未決事項を追う","recommendGem":false,"mdName":"論点の変遷","order":6,"vars":[{"key":"minutes_set","label":"複数回の議事録","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"focus","label":"追いたいテーマ","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 予算、システム移行"}],"prompt":"# 役割\nあなたはプロジェクトの記録係です。複数回の会議を通して、何が決まり、何が決まらずに残っているかを追跡してください。\n\n# 入力\n## 複数回の議事録（古い順に並べる。各回の先頭に日付）\n\"\"\"\n{{minutes_set}}\n\"\"\"\n\n## 追いたいテーマ\n{{focus}}\n\n# 手順\n1. 各回の日付を確かめ、古い順に並べる\n2. 回をまたいで出てくる論点をまとめる（言い方が違っても同じ論点ならまとめる）\n3. 論点ごとに各回の状態（提起・議論・決定・保留・撤回）を追う\n4. 何回も持ち越されている論点と、方針が途中で変わった論点を特定する\n\n# 出力形式\n## 論点の変遷\n| 論点 | 第1回（日付） | 第2回（日付） | … | 現状 |\n|---|---|---|---|---|\n（各セルは「提起: 〜」「保留: 〜」のように状態と一言）\n\n## 決まったこと（時系列）\n- 日付: 決定内容\n\n## 持ち越されている未決事項\n| 論点 | 持ち越し回数 | 決まらない理由（議事録から読み取れる範囲） | 次に必要なこと |\n|---|---|---|---|\n\n## 方針が変わった点\n| 論点 | 変わる前 | 変わった後 | 変わった回 | 理由 |\n|---|---|---|---|---|\n\n## 次回に決めるべきこと（優先順）\n\n# 守ること\n- 議事録に無いことは推測で埋めず「不明」と書く\n- 理由は議事録に書かれている範囲で書く。書かれていなければ「記載なし」\n- 追いたいテーマの指定があれば、それ以外は「その他の論点」に短くまとめる\n\n# 最後に確認\n各論点の状態がすべての回について埋まっているか（出てこない回は「—」）を確かめてから出す。","tips":"議事録はファイル名に日付を入れて、まとめて添付すると楽です。\n四半期ごとの振り返りや、引き継ぎの前に使うと効果的です。","example":"## 論点の変遷\n| 論点 | 第1回（9/8） | 第2回（10/6） | 第3回（11/10） | 現状 |\n|---|---|---|---|---|\n| 展示会の回数 | 提起: 効果が落ちている | 議論: 縮小案 | 決定: 東京1回 | 決定済み |\n| Web 広告の予算 | — | 提起: 増額したい | 保留: 見積もり待ち | 未決（2回持ち越し） |","gem":"","followups":[{"title":"論点のまとめ方が粗い","text":"まとめた論点を分け直してください。1つの論点に別々の決定が入っているものは分けてください。"}]},{"id":"meeting-retro","title":"会議の振り返り","category":"meeting","summary":"決まらなかった理由と、次回の進め方を出す","recommendGem":false,"mdName":"会議の振り返り","order":7,"vars":[{"key":"minutes","label":"議事録または文字起こし","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"goal","label":"この会議で決めたかったこと","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは会議運営の改善を手伝うファシリテーターです。誰かを責めるのではなく、次の会議で決まるようにするための振り返りをしてください。\n\n# 入力\n## この会議で決めたかったこと\n{{goal}}\n\n## 議事録または文字起こし\n\"\"\"\n{{minutes}}\n\"\"\"\n\n# 手順\n1. 決めたかったことと、実際に決まったことを比べる\n2. 決まらなかったことごとに理由を分類する（情報不足 / 決める人がいない / 論点が曖昧 / 時間切れ / 意見の対立 / その他）\n3. 理由ごとに、次回までにできる手を考える\n\n# 出力形式\n## 1. 決まったこと・決まらなかったこと\n| 決めたかったこと | 結果（決定・保留・話題に出ず） |\n|---|---|\n\n## 2. 決まらなかった理由\n| 論点 | 理由の分類 | 根拠となるやりとり | 次回までにやること | 担当（分かれば） |\n|---|---|---|---|---|\n\n## 3. 次回の進め方\n- 事前に配るもの\n- 呼ぶべき人\n- 議題の立て方（問いの形にする。例:「A と B のどちらにするか」）\n- 時間配分\n\n## 4. 会議そのものの改善点（3つまで）\n\n# 守ること\n- 議事録に無いことは推測で埋めず「不明」と書く\n- 特定の人を批判する書き方をしない。仕組み・準備・進め方の問題として書く\n\n# 最後に確認\n決まらなかった論点すべてに「次回までにやること」が書かれているかを確かめてから出す。","tips":"「決めたかったこと」を書くと、話題にすら出なかった論点も見つけられます。\n出力の「次回の進め方」は「アジェンダ作成」の素材にそのまま使えます。","example":"## 2. 決まらなかった理由\n| 論点 | 理由の分類 | 根拠となるやりとり | 次回までにやること | 担当 |\n|---|---|---|---|---|\n| Web 広告の予算 | 情報不足 | 「見積もりがないと何とも」（田中） | 3社の見積もりを比較表にして前日に配る | 鈴木 |","gem":"","followups":[{"title":"改善点が一般論","text":"この会議のやりとりに即した改善点に書き直してください。どの発言からそう判断したかを添えてください。"}]},{"id":"doc-known-unknown","title":"資料 → わかっていること・確認すべきこと","category":"reading","summary":"事実・推測・不明点・確認先・前提とリスクを分けて表にする","recommendGem":true,"mdName":"わかっていること・確認すべきこと","order":1,"vars":[{"key":"doc","label":"資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"purpose","label":"資料を読む目的・自分の立場","multiline":false,"optional":false,"attachable":false,"placeholder":"例: ベンダーの提案を受けて、発注するか判断する"},{"key":"context","label":"補足（背景・気になっている点）","multiline":true,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは慎重で抜け目のない調査担当です。資料から「確かに言えること」と「まだ分からないこと」を厳密に分けてください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 資料を読む目的・自分の立場\n{{purpose}}\n\n## 補足\n{{context}}\n\n## 資料\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 資料を最後まで読み、目的に関わる記述を拾う\n2. 書かれている事実と、書かれていないが読み取れる推測を分ける\n3. 目的に照らして、判断に必要なのに資料に無い情報を洗い出す\n4. それぞれ誰に聞けば分かるかを考え、確認すべきことに優先度を付ける\n5. 資料が置いている前提と、それが崩れたときのリスクを挙げる\n\n# 出力形式\n## 1. 要旨（3行）\n\n## 2. わかっていること（資料に書かれている事実）\n| No | 事実 | 資料の該当箇所（見出し・ページ・短い引用） |\n|---|---|---|\n\n## 3. 資料から推測できること\n| No | 推測 | 確度（高・中・低） | 推測の根拠 |\n|---|---|---|---|\n\n## 4. わかっていないこと\n目的の判断に必要なのに資料に無い情報。\n\n## 5. 確認すべきこと\n| 優先度 | 確認すること | なぜ必要か | 誰に聞くか | 聞き方（そのまま使える一文） |\n|---|---|---|---|---|\n\n## 6. 前提とリスク\n| 資料が置いている前提 | 崩れたときに起きること | 影響（大・中・小） |\n|---|---|---|\n\n# 守ること\n- 事実と推測を混ぜない。資料に明記されていないものは必ず「推測」側に置く\n- 該当箇所を示せない事実は書かない\n- 確認すべきことは、目的の判断に効く順に並べる（優先度 A を3つまでに絞る）\n\n# 最後に確認\n「わかっていること」の各行に該当箇所があるか、推測が事実の表に紛れていないかを確かめてから出す。","tips":"目的を具体的に書くほど、「確認すべきこと」が鋭くなります。\n提案書・仕様書・見積書・調査レポートなど、判断の前に読む資料なら何でも使えます。\n続けて「相手先への質問リスト」を使うと、そのまま送れる質問文になります。","example":"## 2. わかっていること\n| No | 事実 | 資料の該当箇所 |\n|---|---|---|\n| 1 | 初期費用は 480 万円（税別） | p.12「費用」 |\n| 2 | 導入期間は契約から3か月 | p.9「スケジュール」 |\n\n## 3. 資料から推測できること\n| No | 推測 | 確度 | 推測の根拠 |\n|---|---|---|---|\n| 1 | 保守費用は別途かかる | 中 | p.12 に「初期費用」の記載しかない |\n\n## 5. 確認すべきこと\n| 優先度 | 確認すること | なぜ必要か | 誰に聞くか | 聞き方 |\n|---|---|---|---|---|\n| A | 年間の保守費用 | 5年総額で比較するため | ベンダーの営業担当 | 「初期費用のほかに、年間の保守費用はおいくらでしょうか」 |","gem":"","followups":[{"title":"推測が事実に混ざっている","text":"「わかっていること」の表を見直し、資料に文字通り書かれていないものはすべて「推測」の表へ移してください。"},{"title":"確認事項が多すぎる","text":"判断を変える可能性があるものだけに絞り、5件以内にしてください。外したものは最後に一覧で残してください。"}]},{"id":"question-list","title":"相手先への質問リスト","category":"reading","summary":"資料をもとに、答えやすく優先度のついた質問と送付文を作る","recommendGem":false,"mdName":"質問リスト","order":2,"vars":[{"key":"doc","label":"資料（または確認すべきことの一覧）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"counterpart","label":"質問する相手","multiline":false,"optional":false,"attachable":false,"placeholder":"例: ベンダーの営業担当 / 社内の経理部"},{"key":"purpose","label":"何を判断するための質問か","multiline":false,"optional":false,"attachable":false,"placeholder":""},{"key":"limit","label":"質問数の上限","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 10"}],"prompt":"# 役割\nあなたは要点を外さない聞き手です。相手が短時間で答えられ、こちらの判断が確実に進む質問を作ってください。\n\n# 前提\n書き手:\n{{my.profile}}\n文体: {{my.tone}}\n\n# 入力\n## 質問する相手\n{{counterpart}}\n\n## 何を判断するための質問か\n{{purpose}}\n\n## 質問数の上限\n{{limit}}（指定なしなら10問まで）\n\n## 資料\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 判断に必要なのに資料から分からないことを洗い出す\n2. 答えによってこちらの行動が変わる質問だけを残す\n3. 選択肢や Yes/No で答えられる形に言い換える。数字を聞くときは単位と期間を指定する\n4. 優先度順に並べる\n\n# 出力形式\n## 質問リスト\n| 優先 | 質問 | 背景（なぜ聞くか） | 答えによって変わること |\n|---|---|---|---|\n\n## 送付文\n相手にそのまま送れるメール（またはチャット）の文面。質問は番号付きで、優先度 A のものを先に。\n\n# 守ること\n- 資料に答えが書いてあることは聞かない\n- 1つの質問で1つのことだけを聞く\n- 相手を疑うような言い方をしない\n\n# 最後に確認\n資料に答えが載っている質問が紛れていないか、1問1論点になっているかを確かめてから出す。","tips":"「資料 → わかっていること・確認すべきこと」の出力を貼ると、より絞り込まれた質問になります。\n社外向けには、右上の「自分の情報」に会社名を入れておくと送付文の名乗りが入ります。","example":"## 質問リスト\n| 優先 | 質問 | 背景 | 答えによって変わること |\n|---|---|---|---|\n| A | 年間の保守費用は初期費用とは別に発生しますか。発生する場合、金額はおいくらですか | 5年総額で比較するため | 他社との比較結果 |\n| B | 導入期間の3か月に、こちら側の作業（データ準備など）は含まれていますか | 社内の体制を決めるため | 担当者の割り当て |","gem":"","followups":[{"title":"質問が回りくどい","text":"各質問を40字以内に縮めてください。背景は送付文の冒頭に1回だけ書けば十分です。"}]},{"id":"tiered-summary","title":"段階要約（1行・3行・A4 1枚）","category":"reading","summary":"長い資料を、読む時間に合わせて3段階で要約する","recommendGem":false,"mdName":"要約","order":3,"vars":[{"key":"doc","label":"資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"reader","label":"読む人","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 忙しい部長、新しく入ったメンバー"}],"prompt":"# 役割\nあなたは要約の名人です。読み手が使える時間に合わせて、同じ資料を3段階で要約してください。\n\n# 入力\n## 読む人\n{{reader}}\n\n## 資料\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 資料の結論（いちばん言いたいこと）を特定する\n2. 結論を支える根拠の中から、重要なものを3つ選ぶ\n3. 段階ごとに書く。短い要約は長い要約の縮約になるよう、内容を一致させる\n\n# 出力形式\n## 1行（40字以内）\n\n## 3行\n1. 結論\n2. 最も重要な根拠\n3. 読み手への影響・次の行動\n\n## A4 1枚（800字程度）\n見出しを3〜5個立てる。数字はそのまま残す。\n\n## キーワード\n資料を探し直すときに使う語を5つ。\n\n# 守ること\n- 資料に無いことを書かない。解釈や意見は入れない\n- 数字・固有名詞・日付は原文のまま書く\n- 資料の結論がはっきりしないときは「資料には結論の明記がない」と書いた上で、最も強く主張されていることを書く\n\n# 最後に確認\n3段階の内容が矛盾していないか、数字が原文と一致しているかを確かめてから出す。","tips":"読む人を指定すると、言葉の難しさと強調する点が変わります。\n共有チャットには「3行」、報告書の添付には「A4 1枚」が使いやすいです。","example":"## 1行\n来期は展示会を1回に減らし、浮いた予算を Web 広告に回す計画。\n\n## 3行\n1. 展示会を2回から1回（東京）に減らす\n2. 展示会1回あたりの商談数が前年比 -40% と落ちているため\n3. Web 広告の配分は11/24の会議で決める。営業部は見積もり確認に協力が必要","gem":"","followups":[{"title":"大事な数字が落ちた","text":"A4 1枚の要約に、資料にある主要な数字（金額・割合・件数・期限）を漏れなく入れ直してください。"}]},{"id":"spec-contract-check","title":"仕様書・契約書の矛盾と曖昧さのチェック","category":"reading","summary":"矛盾・曖昧・欠落・不利な条件を、原文の引用と修正案つきで洗い出す","recommendGem":false,"mdName":"書類のチェック","order":4,"vars":[{"key":"doc","label":"書類","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"doctype","label":"書類の種類","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 業務委託契約書 / 要件定義書 / 仕様書"},{"key":"position","label":"自分の立場","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 発注側 / 受注側 / 開発担当"},{"key":"concern","label":"特に気になっている点","multiline":true,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは書類の読み込みに厳しいレビュアーです。後でもめる原因になりそうな箇所を、細かく、具体的に指摘してください。\n\n# 入力\n## 書類の種類\n{{doctype}}\n\n## 自分の立場\n{{position}}\n\n## 特に気になっている点\n{{concern}}\n\n## 書類\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 書類全体を読み、条項・章の構成を把握する\n2. 次の観点で問題を探す\n   - 矛盾: 別の箇所と食い違う記述\n   - 曖昧: 「適宜」「速やかに」「等」「原則として」など、解釈が割れる表現\n   - 欠落: この種類の書類にふつうある項目（期限、責任範囲、検収、変更手続き、解約、支払条件など）が無い\n   - 不整合: 金額・日付・数量・用語の表記が合わない\n   - 不利な条件: 自分の立場から見て一方的に不利な条項\n3. 問題ごとに修正案を書く\n\n# 出力形式\n## 総評（3行）\n\n## 指摘一覧\n| No | 箇所（条・項・ページ） | 種類 | 原文の引用 | 何が問題か | 修正案 | 重要度（高・中・低） |\n|---|---|---|---|---|---|---|\n\n## 書類に無い項目\n| 項目 | 無いと何が困るか | 追加する文案 |\n|---|---|---|\n\n## 相手に確認すること\n- そのまま聞ける一文で\n\n# 守ること\n- 指摘には必ず原文を引用する。引用できない指摘はしない（「書類に無い項目」を除く）\n- 重要度「高」は、金額・責任・期限・解約に関わるものに限る\n- これは法的な助言ではない。最後に「最終判断は法務・専門家に確認する」と1行添える\n\n# 最後に確認\n指摘ごとに原文の引用と修正案があるか、重要度の高い順に並んでいるかを確かめてから出す。","tips":"PDF をそのまま添付できます。条番号が付いた書類ほど指摘の箇所が正確になります。\n立場を書かないと、どちらにとって不利かの判断ができません。","example":"## 指摘一覧\n| No | 箇所 | 種類 | 原文の引用 | 何が問題か | 修正案 | 重要度 |\n|---|---|---|---|---|---|---|\n| 1 | 第5条2項 | 曖昧 | 「乙は速やかに修正する」 | 期限が無く、遅れても責任を問えない | 「乙は通知を受けた日から10営業日以内に修正する」 | 高 |\n| 2 | 第3条と別紙1 | 不整合 | 「納期 3月31日」/「納品日 3月15日」 | 納期が2通りある | どちらかに統一し、別紙を正とする旨を書く | 高 |","gem":"","followups":[{"title":"指摘が浅い","text":"「曖昧」の観点だけで、もう一度最初から読み直して指摘を追加してください。「等」「適宜」「必要に応じて」を特に見てください。"}]},{"id":"version-diff","title":"2つの版の差分と影響","category":"reading","summary":"旧版と新版を比べ、変わった点と影響・対応の要否を表にする","recommendGem":false,"mdName":"差分","order":5,"vars":[{"key":"old_doc","label":"旧版","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"new_doc","label":"新版","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"purpose","label":"何のために比べるか","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 契約更新で条件が悪くなっていないか確かめる"}],"prompt":"# 役割\nあなたは変更点を一つも見落とさない校閲者です。2つの版を比べ、何が変わり、それが何に影響するかを示してください。\n\n# 入力\n## 何のために比べるか\n{{purpose}}\n\n## 旧版\n\"\"\"\n{{old_doc}}\n\"\"\"\n\n## 新版\n\"\"\"\n{{new_doc}}\n\"\"\"\n\n（添付で渡す場合は、ファイル名に「旧」「新」が付いている方をそれぞれ旧版・新版とする）\n\n# 手順\n1. 両方の構成（章・条・見出し）を対応づける\n2. 対応する箇所ごとに、追加・削除・修正を拾う。数字・日付・固有名詞の変更は小さくても拾う\n3. 意味が変わる変更と、表現だけの変更を分ける\n4. 意味が変わる変更ごとに影響と、対応が要るかを判断する\n\n# 出力形式\n## 重要な変更（3つまで）\n\n## 変更一覧（意味が変わるもの）\n| No | 箇所 | 種類（追加・削除・修正） | 旧 | 新 | 影響 | 対応が必要か |\n|---|---|---|---|---|---|---|\n\n## 表現だけの変更\n- 箇所: 旧 → 新（まとめて短く）\n\n# 守ること\n- 旧・新の文言は原文のまま引用する\n- 影響は資料から言える範囲で書く。言えないときは「不明（要確認）」\n- 片方にしか無い章は、まるごと追加・削除として扱う\n\n# 最後に確認\n数字・日付の変更が漏れていないか、もう一度両方を突き合わせてから出す。","tips":"2つのファイルを添付するときは、ファイル名に「旧」「新」を入れてください。\n契約更新、規程の改定、仕様書の版上げの確認に向いています。","example":"## 変更一覧\n| No | 箇所 | 種類 | 旧 | 新 | 影響 | 対応が必要か |\n|---|---|---|---|---|---|---|\n| 1 | 第7条 | 修正 | 「月額 50,000 円」 | 「月額 55,000 円」 | 年間 6 万円の増額 | 要（予算の修正） |\n| 2 | 第12条 | 追加 | — | 「自動更新とする」 | 解約を忘れると継続される | 要（解約期限の管理） |","gem":"","followups":[{"title":"細かい変更が漏れていそう","text":"数字・日付・金額・期限・人名だけに絞って、旧版と新版をもう一度突き合わせてください。"}]},{"id":"number-check","title":"数字の検算","category":"reading","summary":"資料の合計・比率・前年比を計算し直し、食い違いを見つける","recommendGem":false,"mdName":"検算","order":6,"vars":[{"key":"doc","label":"資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"focus","label":"特に確かめたい数字","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは数字に厳しい経理担当です。資料の数字を一つずつ計算し直して、食い違いを見つけてください。\n\n# 入力\n## 特に確かめたい数字\n{{focus}}\n\n## 資料\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 資料の中の、計算で確かめられる数字を拾う（合計・小計・平均・割合・前年比・単価×数量など）\n2. それぞれの計算式を書き、元になる数字を資料から引いて計算し直す。暗算せず、必ず式を書いてから計算する（コードを実行できるなら実行して確かめる）\n3. 記載値と再計算値を比べる。端数処理による差（±1 程度）は「丸めの差」とする\n4. 単位・期間・対象範囲が揃っていない比較を探す\n\n# 出力形式\n## 検算結果\n| No | 箇所 | 記載値 | 計算式 | 再計算値 | 差 | 判定（一致・丸めの差・不一致・確認不可） |\n|---|---|---|---|---|---|---|\n\n## 単位・期間・定義の不整合\n| 箇所 | 内容 | なぜ問題か |\n|---|---|---|\n\n## 定義が分からない数字\n- 何を分母にした割合か分からない、など\n\n# 守ること\n- 元の数字が資料に無く計算できないものは「確認不可」とし、足りない数字を書く\n- 判定「不一致」は計算式を示した上で書く\n- 資料の数字を書き換えない\n\n# 最後に確認\n「不一致」とした行の計算を、もう一度やり直して確かめてから出す。","tips":"表を含む資料は、Excel やスプレッドシートのまま添付すると読み取りの誤りが減ります。\n報告書を出す前の最終チェックに使うと安心です。","example":"## 検算結果\n| No | 箇所 | 記載値 | 計算式 | 再計算値 | 差 | 判定 |\n|---|---|---|---|---|---|---|\n| 1 | p.3 売上合計 | 12,480 | 4,120 + 3,980 + 4,280 | 12,380 | +100 | 不一致 |\n| 2 | p.3 前年比 | 108% | 12,380 ÷ 11,460 | 108.0% | 0 | 一致 |","gem":"","followups":[{"title":"計算が合っているか不安","text":"「不一致」とした行だけ、計算をコードで実行して確かめ直してください。コードと結果も見せてください。"}]},{"id":"audience-rewrite","title":"読み手別の書き直し","category":"reading","summary":"同じ内容を、経営層・現場・社外など読み手に合わせて書き分ける","recommendGem":false,"mdName":"読み手別の書き直し","order":7,"vars":[{"key":"doc","label":"元の文章・資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"audiences","label":"読み手","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 経営層、現場の担当者、社外の取引先"},{"key":"purpose","label":"伝える目的","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは社内広報の編集者です。同じ内容を、読み手ごとに「知りたいこと」と「分かる言葉」に合わせて書き分けてください。\n\n# 入力\n## 読み手\n{{audiences}}\n\n## 伝える目的\n{{purpose}}\n\n## 元の文章・資料\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 読み手ごとに、知りたいこと・判断すること・知らなくてよいことを考える\n2. 元の内容から、読み手ごとに残す情報と削る情報を決める\n3. 専門用語を、その読み手に通じる言葉に置き換える\n4. 読み手ごとに書き直す\n\n# 出力形式\n読み手ごとに次の見出しで出す。\n\n## {読み手}向け\n- この読み手が知りたいこと（1行）\n- 書き直した文章\n- 削った情報\n- 言い換えた用語（元の語 → 言い換え）\n\n# 守ること\n- 元の内容に無い事実を足さない\n- 社外向けには、社内の事情（人事・予算の内訳・未確定の話）を出さない\n- 数字は読み手が違っても同じ値にする\n\n# 最後に確認\n各版で事実が食い違っていないか、社外向けに社内の情報が混ざっていないかを確かめてから出す。","tips":"経営層には結論と判断材料、現場には手順と影響、社外には相手にとっての変化、が基本です。","example":"## 経営層向け\n- 知りたいこと: 費用と効果、判断が必要か\n- 書き直した文章: 展示会を1回に減らし、年間 300 万円を Web 広告に回します。商談数は前年並みを見込みます。承認は不要で、11/24 に配分を報告します。","gem":"","followups":[{"title":"違いが小さい","text":"読み手ごとの違いをはっきりさせてください。経営層向けは3行以内、現場向けは手順を中心に書き直してください。"}]},{"id":"qa-source-check","title":"NotebookLM に入れる資料の点検","category":"notebooklm","summary":"ソースに入れる前に、資料の版違い・重複・抜け・古い情報を洗い出し、入れる資料と外す資料を決める","recommendGem":false,"mdName":"","order":0,"vars":[{"key":"files","label":"入れる予定の資料の一覧（ファイル名・日付・版・中身のメモ）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"project","label":"案件名と、質問箱で答えを出したいこと","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 基幹システム更改。費用・範囲・スケジュールの質問に答えられるようにしたい"}],"prompt":"# 役割\nあなたは案件の資料管理を担当する、慎重な文書管理者です。NotebookLM が古い資料や重複した資料から答えて誤らないよう、ソースに入れる前の資料を点検してください。\n\n# 入力\n## 案件名と、質問箱で答えを出したいこと\n{{project}}\n\n## 入れる予定の資料\n\"\"\"\n{{files}}\n\"\"\"\n\n# 手順\n1. 資料を1件ずつ読み、種類（契約・見積・仕様・議事録・メールなど）、日付、版を書き出す\n2. 同じ資料の別の版を見つけ、どれが最新かを決める。決め手（日付・版番号・本文の「改訂」の記載）を書く\n3. 中身がほぼ同じ資料（重複）を見つける\n4. 答えを出したいことに対して、足りない種類の資料を挙げる（例: 見積はあるが契約条件の資料が無い）\n5. 古い情報のまま入れると誤った答えにつながる資料に印を付ける\n6. 入れる・外す・確認してから決める、に分ける\n\n# 出力形式\n## 1. 点検の結果\n| No | 資料名 | 種類 | 日付・版 | 判定（入れる・外す・確認してから） | 理由 |\n|---|---|---|---|---|---|\n\n## 2. 版違い・重複\n| 資料のまとまり | 最新と判断したもの | 決め手 | 外すもの |\n|---|---|---|---|\n\n## 3. 足りない資料\n| 足りない資料 | 無いと答えられない質問の例 | 誰が持っていそうか |\n|---|---|---|\n\n## 4. ソースの名前の付け方\nNotebookLM で見分けやすいように、資料名の頭に付ける形の案（例: 「2026-11_見積_v3_A社」）。\n\n# 守ること\n- 一覧に無い資料を作らない。日付や版が分からないものは「不明」と書く\n- 最新かどうかを決められないときは「確認してから」にし、推測で決めない\n- 中身を読めない資料（ファイル名だけ）は、その旨を書く\n\n# 最後に確認\nすべての資料に判定と理由があるか、版違いのまとまりで最新が1つずつに決まっているかを確かめてから出す。","tips":"フォルダのファイル一覧をそのまま貼るだけでも使えます。資料そのものを添付すると、版違いや重複の判定が正確になります。\n新しい資料を足すたびに、一覧ごと点検し直すと、古い版が残り続けるのを防げます。\n外した資料は消さず、別のフォルダに残しておくと、後で経緯を追えます。","example":"## 2. 版違い・重複\n| 資料のまとまり | 最新と判断したもの | 決め手 | 外すもの |\n|---|---|---|---|\n| A社の見積書 | 見積書_v3（2026-11-10） | 版番号と日付が最も新しい。v3 の表紙に「v2 から保守費を改定」 | 見積書_v2、見積書_v1 |\n\n## 3. 足りない資料\n| 足りない資料 | 無いと答えられない質問の例 | 誰が持っていそうか |\n|---|---|---|\n| 保守契約の約款 | 夜間の障害対応は含まれるか | ベンダー営業 |","gem":"","followups":[{"title":"外すものを確かめたい","text":"「外す」と判定した資料それぞれについて、入れたままにすると起きそうな誤った答えの例を1つずつ挙げてください。"}]},{"id":"qa-ask","title":"NotebookLM への質問の型","category":"notebooklm","summary":"回答を「ソースにあること・推測・ソースに無いこと」に分けて返させる。後で質問台帳に取り出しやすくなる（NotebookLM に貼る）","recommendGem":false,"mdName":"","order":1,"vars":[{"key":"question","label":"聞きたいこと","multiline":true,"optional":false,"attachable":false,"placeholder":"例: 保守契約の範囲に、夜間の障害対応は含まれるか"},{"key":"why","label":"何のために聞くか","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 見積もりの比較で、夜間対応の費用を別に積むか決めたい"}],"prompt":"# 役割\nあなたは、このノートブックのソースだけを根拠に答える調査担当です。ソースに書かれていることと、そうでないことを厳密に分けて答えてください。\n\n# 目的\n{{why}}（指定なしなら、質問に正確に答えること）\n\n# 質問\n\"\"\"\n{{question}}\n\"\"\"\n\n# 手順\n1. 質問に関わる記述を、すべてのソースから探す\n2. ソースに書かれていることを、ソース名と該当箇所つきで抜き出す\n3. 書かれていないが、ソースから推測できることを分ける\n4. ソースのどこにも無いこと、ソースどうしで食い違っていることを挙げる\n5. 答えをはっきりさせるために、誰に何を確かめればよいかを書く\n\n# 出力形式\n## 結論（2行以内）\nはっきり言えないときは「ソースからは確定できない」と書き、理由を添える。\n\n## ソースに書いてあること\n| No | 内容 | ソース名 | 該当箇所（見出し・ページ） | 原文の引用（短く） |\n|---|---|---|---|---|\n\n## ソースから推測したこと\n| No | 推測 | 確度（高・中・低） | 推測の根拠 |\n|---|---|---|---|\n\n## ソースに無いこと・食い違っていること\n- （なければ「なし」）\n\n## あいまいな言い回し\n回答の根拠にした原文のうち、「原則として」「場合がある」「別途」「など」のように解釈が分かれる言い回しと、その解釈の候補。\n\n## 確かめること\n| 確かめること | 確認先の候補 | 聞き方（そのまま使える一文） |\n|---|---|---|\n\n# 守ること\n- ソースに無いことは推測で埋めず「不明」と書く\n- 一般常識や他社の例で補わない\n- 推測を「ソースに書いてあること」の表に入れない\n\n# 最後に確認\n「ソースに書いてあること」の各行に引用があるか、推測が混ざっていないかを確かめてから出す。","tips":"NotebookLM のチャット欄に、そのまま貼ってください。毎回この型で聞くと、回答の形がそろい、「やりとり → 質問台帳」で取り出しやすくなります。\n目的を書くと、何が「あいまい」かの判断が目的に沿います。\n回答が良ければ「メモに保存」しておくと、後でまとめてコピーできます。","example":"## 結論\n夜間の障害対応は、保守契約の範囲に含まれるとはソースからは確定できない。対応時間の記載が「営業時間内」だけのため。\n\n## ソースに書いてあること\n| No | 内容 | ソース名 | 該当箇所 | 原文の引用 |\n|---|---|---|---|---|\n| 1 | 障害の受付は平日 9〜18 時 | 保守契約書案 | 第5条 | 「障害受付時間は平日9時から18時とする」 |\n\n## あいまいな言い回し\n- 「緊急時は別途協議」: 夜間も対応する余地がある / 追加費用で対応する、のどちらとも読める","gem":"","followups":[{"title":"引用が無い","text":"「ソースに書いてあること」の各行に、原文の引用を付け直してください。引用できない行は「推測」の表へ移してください。"},{"title":"別のソースも見てほしい","text":"すべてのソースをもう一度確認し、今回の回答で使っていないソースに関係する記述があれば追加してください。"}]},{"id":"qa-ledger","title":"やりとり → 質問台帳","category":"notebooklm","summary":"NotebookLM で聞いた質問と回答から、あいまいな点を取り出し、ステータス（要確認・対応中・仮置き・確定）つきの台帳にする","recommendGem":true,"mdName":"質問台帳","order":2,"vars":[{"key":"log","label":"NotebookLM の質問と回答（コピーしたもの）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"project","label":"案件名と目的","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 基幹システム更改。ベンダー2社の見積もりを比べて発注先を決める"},{"key":"owner","label":"確認先の候補","multiline":false,"optional":true,"attachable":false,"placeholder":"例: ベンダー営業の田中さん / 情シスの佐藤さん / 法務"}],"prompt":"# 役割\nあなたは案件の論点管理を担当する、慎重なプロジェクト管理者です。NotebookLM とのやりとりから、分かったことと分かっていないことを取り出し、追いかけられる台帳にしてください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 案件名と目的\n{{project}}\n\n## 確認先の候補\n{{owner}}\n\n## NotebookLM の質問と回答\n\"\"\"\n{{log}}\n\"\"\"\n\n# ステータスの決め方\n- 要確認: 回答が無い、ソースに無い、解釈が割れる。まだ誰にも聞いていない\n- 対応中: やりとりの中に「問い合わせた」「確認中」とあるもの\n- 仮置き: 根拠は足りないが、この前提で進めるとやりとりの中で決めたもの。仮置きの内容と、見直す条件を必ず書く\n- 確定: ソースの原文か、確認先の返答による裏付けがあるもの。根拠の欄が空なら確定にしない\n- 取り下げ: 不要になった、または別の質問に統合したもの。統合先の ID を書く\n迷ったら、確定ではなく要確認にする。\n\n# 手順\n1. やりとりを質問ごとに分け、Q-001 から番号を振る。同じことを聞いている質問は1件にまとめる\n2. 質問ごとに、回答の要点と根拠（ソース名・該当箇所・短い引用）を書き出す\n3. 回答の中のあいまいな点を挙げる: 根拠が無い、推測で答えている、言い回しの解釈が分かれる、ソースどうしが食い違う\n4. ステータスを上の決め方で付ける\n5. 確定以外には、次の行動と確認先を書く。確認先の候補にある人から選び、合う人がいなければ「不明」と書く\n6. 案件の目的に効く順に並べる\n\n# 出力形式\n## 1. ステータス別の件数\n| 要確認 | 対応中 | 仮置き | 確定 | 取り下げ | 合計 |\n|---|---|---|---|---|---|\n\n## 2. すぐ動くもの（要確認・仮置き）\n- Q-番号 質問（短く） — 次の行動 / 確認先\n\n## 3. 質問台帳\n| ID | 質問 | 回答の要点 | 根拠（ソース名・該当箇所・短い引用） | あいまいな点 | ステータス | 次の行動 | 確認先 | 期限 | 更新日 | メモ |\n|---|---|---|---|---|---|---|---|---|---|---|\n\n## 4. あいまいな言い回し\n| ID | 原文の言い回し | 解釈の候補 | どちらかで何が変わるか |\n|---|---|---|---|\n\n# 守ること\n- やりとりに無い内容を補わない。分からない欄は「不明」と書く\n- 根拠の欄が空のまま「確定」にしない\n- 期限はやりとりに書かれていなければ空欄にする。勝手に決めない\n- 更新日は今日の日付にする\n- 表のセルの中で改行しない。複数あるときは「／」で区切る\n\n# 最後に確認\nすべての「確定」に根拠があるか、「仮置き」に見直す条件があるか、件数の表と台帳の件数が合っているかを確かめてから出す。","tips":"NotebookLM のチャットの回答や保存したメモを、まとめてコピーして貼ってください。「NotebookLM への質問の型」で聞いた回答だと、根拠が取り出しやすくなります。\nGemini の出力の表は、表の右下の「スプレッドシートにエクスポート」でそのままシートにできます。\nできた台帳を NotebookLM のソースに戻しておくと、次の質問で、確定したことを踏まえた回答になります。\n続けて、要確認の件を「相手先への質問リスト」に貼ると、そのまま送れる質問文になります。","example":"## 1. ステータス別の件数\n| 要確認 | 対応中 | 仮置き | 確定 | 取り下げ | 合計 |\n|---|---|---|---|---|---|\n| 2 | 0 | 1 | 1 | 0 | 4 |\n\n## 3. 質問台帳\n| ID | 質問 | 回答の要点 | 根拠 | あいまいな点 | ステータス | 次の行動 | 確認先 | 期限 | 更新日 | メモ |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Q-001 | 夜間の障害対応は保守に含まれるか | 受付は平日 9〜18 時のみ | 保守契約書案 第5条「障害受付時間は平日9時から18時」 | 「緊急時は別途協議」の範囲が不明 | 要確認 | 夜間対応の有無と費用を聞く | ベンダー営業 |  | 2026-11-18 |  |\n| Q-002 | データ移行の費用は見積もりに入っているか | 移行作業費として計上 | 見積書 p.3「データ移行 120 万円」 |  | 確定 |  |  |  | 2026-11-18 |  |\n| Q-003 | 移行するデータの年数 | ソースに記載なし | 不明 | 年数で移行費が変わる | 仮置き | 直近5年分で見積もりを比べる。7年以上と分かったら見直す | 情シス |  | 2026-11-18 |  |","gem":"","followups":[{"title":"確定が多すぎる","text":"「確定」の行をすべて見直し、根拠がソースの原文か確認先の返答でないものは「要確認」に戻してください。戻した行の ID を最後に挙げてください。"},{"title":"台帳だけほしい","text":"「3. 質問台帳」の表だけを出してください。"},{"title":"仮置きを決めたい","text":"「要確認」のうち、返事を待たずに進めたいものについて、仮置きの案と見直す条件を出してください。台帳への反映はまだしないでください。"}]},{"id":"qa-ledger-update","title":"質問台帳の更新","category":"notebooklm","summary":"今の台帳に、新しいやりとり・確認先の返答・決めたことを反映する。ID を保ち、変更点を先に示す","recommendGem":true,"mdName":"質問台帳","order":3,"vars":[{"key":"ledger","label":"今の質問台帳","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"news","label":"新しく分かったこと（NotebookLM の回答・確認先の返事・会議で決めたこと）","multiline":true,"optional":false,"attachable":true,"placeholder":""}],"prompt":"# 役割\nあなたは案件の論点管理を担当する、慎重なプロジェクト管理者です。台帳を最新の状態にしてください。過去の記録を消さず、何がなぜ変わったかを追えるようにしてください。\n\n# 入力\n## 今の質問台帳\n\"\"\"\n{{ledger}}\n\"\"\"\n\n## 新しく分かったこと\n\"\"\"\n{{news}}\n\"\"\"\n\n# ステータスの決め方\n- 要確認: 回答が無い、ソースに無い、解釈が割れる。まだ誰にも聞いていない\n- 対応中: 確認先に問い合わせ済みで返事待ち、または調べている最中\n- 仮置き: 根拠は足りないが、この前提で進めると決めたもの。仮置きの内容と、見直す条件を必ず書く\n- 確定: ソースの原文か、確認先の返答による裏付けがあるもの。根拠の欄が空なら確定にしない\n- 取り下げ: 不要になった、または別の質問に統合したもの。統合先の ID を書く\n\n# 手順\n1. 新しく分かったことを1件ずつ読み、台帳のどの ID に関係するかを決める\n2. 関係する ID があれば、回答の要点・根拠・あいまいな点・ステータス・次の行動を更新する\n3. どの ID にも当たらないものは、最後の番号の続きで新しい ID を振って追加する\n4. 同じことを聞いている行があれば、古い ID を残し、新しい方を「取り下げ」にして統合先を書く\n5. 仮置きの「見直す条件」に当たる知らせがあれば、仮置きを見直す\n6. 更新した行の更新日を今日にする\n\n# 出力形式\n## 1. 変更点\n| ID | 変更した欄 | 変更前 | 変更後 | 理由（新しく分かったことの該当箇所） |\n|---|---|---|---|---|\n\n## 2. ステータス別の件数（変更前 → 変更後）\n| 要確認 | 対応中 | 仮置き | 確定 | 取り下げ | 合計 |\n|---|---|---|---|---|---|\n\n## 3. 質問台帳（更新後・全件）\n| ID | 質問 | 回答の要点 | 根拠（ソース名・該当箇所・短い引用） | あいまいな点 | ステータス | 次の行動 | 確認先 | 期限 | 更新日 | メモ |\n|---|---|---|---|---|---|---|---|---|---|---|\n\n## 4. 期限が過ぎている・近いもの\n- （なければ「なし」）\n\n# 守ること\n- 既存の ID を振り直さない。行を消さない（不要なものは「取り下げ」にする）\n- 新しく分かったことに無い内容で台帳を書き換えない。分からない欄は「不明」と書く\n- 根拠の欄が空のまま「確定」にしない\n- 変更していない行の内容を変えない\n- 表のセルの中で改行しない\n\n# 最後に確認\n変更点の表と台帳が一致しているか、行の数が減っていないか、すべての「確定」に根拠があるかを確かめてから出す。","tips":"台帳はスプレッドシートからコピーしても、前回の .md をそのまま貼っても構いません。\n確認先からのメールの返事や、会議で「この前提で進める」と決めたことも、そのまま「新しく分かったこと」に貼ってください。\n変更点の表を見て、意図しない書き換えが無いか確かめてから台帳を差し替えると安全です。","example":"## 1. 変更点\n| ID | 変更した欄 | 変更前 | 変更後 | 理由 |\n|---|---|---|---|---|\n| Q-001 | ステータス | 要確認 | 確定 | ベンダーの返信「夜間は別契約で月 3 万円」 |\n| Q-001 | 根拠 | 保守契約書案 第5条 | 保守契約書案 第5条／ベンダー返信 11/17 | 同上 |\n| Q-004 | （新規） |  | 夜間対応を別契約にするか | ベンダー返信で選択肢が出たため |","gem":"","followups":[{"title":"行が消えた","text":"変更前の台帳にあって、更新後の台帳に無い ID を挙げ、元に戻した台帳を出してください。"},{"title":"変更点だけ見たい","text":"「1. 変更点」の表だけを出してください。"}]},{"id":"qa-ledger-sheet","title":"質問台帳 → スプレッドシート","category":"notebooklm","summary":"台帳をタブ区切りで出し、ステータスのプルダウン・色分け・件数の集計・期限切れの強調の設定手順を付ける","recommendGem":false,"mdName":"","order":4,"vars":[{"key":"ledger","label":"質問台帳","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"tool","label":"使うソフト","multiline":false,"optional":true,"attachable":false,"placeholder":"Google スプレッドシート / Excel"}],"prompt":"# 役割\nあなたは表計算に詳しい業務改善の担当です。質問台帳を、表計算に詳しくない人でもステータスを管理できるシートにしてください。\n\n# 入力\n## 使うソフト\n{{tool}}（指定なしなら Google スプレッドシート）\n\n## 質問台帳\n\"\"\"\n{{ledger}}\n\"\"\"\n\n# シートの形\n- 1行目が見出し。列は A から順に: ID / 質問 / 回答の要点 / 根拠 / あいまいな点 / ステータス / 次の行動 / 確認先 / 期限 / 更新日 / メモ\n- ステータスは F 列、期限は I 列、更新日は J 列になる\n- ステータスに使う言葉は「要確認・対応中・仮置き・確定・取り下げ」の5つだけ\n\n# 手順\n1. 台帳の行を上の列の順に並べ直す。足りない列は空欄にする\n2. ステータスが5つの言葉以外になっている行は、近い方に直し、直した行を挙げる\n3. 日付は yyyy-mm-dd にそろえる\n4. 設定の手順を、メニューの名前どおりに書く\n\n# 出力形式\n## 1. 貼り付ける表（タブ区切り）\n```\n（1行目が見出し。セルの中に改行とタブを入れない）\n```\nA1 を選んで貼り付ける。\n\n## 2. ステータスのプルダウン\nF 列に、5つの言葉から選ぶ入力規則を付ける手順。\n\n## 3. ステータスの色分け\n条件付き書式の手順と、色の案（要確認・対応中・仮置き・確定・取り下げ）。色だけに頼らないよう、文字はそのまま残す。\n\n## 4. 件数の集計\n別の場所（例: M1 から下）に置く、ステータスごとの件数の COUNTIF の式と合計の式。\n\n## 5. 期限切れの強調\n期限（I 列）が今日より前で、ステータスが確定・取り下げ以外の行に色を付ける、カスタム数式の条件付き書式。\n\n## 6. 直した箇所\nステータスや日付の形を直した行（なければ「なし」）。\n\n# 守ること\n- 台帳に無い行や内容を足さない。分からない欄は空欄にする\n- 数式は、指定のソフトでそのまま動くものにする\n- 列の位置を変えたら、数式の列も合わせる\n\n# 最後に確認\n表の行数が台帳と同じか、数式の列（F・I）が見出しの位置と合っているかを確かめてから出す。","tips":"「やりとり → 質問台帳」や「質問台帳の更新」の出力を、そのまま貼ってください。\n一度シートを作ったら、次からは更新した表だけを貼り替えれば、プルダウンと色分けはそのまま使えます（貼るときは「値のみ貼り付け」）。\nGemini の表をエクスポートしてシートにした場合も、2〜5 の手順だけ使えます。","example":"## 4. 件数の集計\n| セル | 入れるもの |\n|---|---|\n| M1 | 要確認 |\n| N1 | =COUNTIF($F:$F, M1) |\n| M6 | 合計 |\n| N6 | =SUM(N1:N5) |\n\n## 5. 期限切れの強調\n範囲 A2:K、カスタム数式:\n=AND($I2\u003c>\"\", $I2\u003cTODAY(), $F2\u003c>\"確定\", $F2\u003c>\"取り下げ\")","gem":"","followups":[{"title":"Excel で使いたい","text":"同じ設定を Excel の手順（データの入力規則・条件付き書式）で書き直してください。"},{"title":"担当者ごとに見たい","text":"確認先（H 列）ごとに、ステータス別の件数を出す表の式を追加してください。"}]},{"id":"qa-ledger-html","title":"質問台帳 → 見やすい HTML","category":"notebooklm","summary":"台帳を、件数カード・ステータスの絞り込み・検索・期限切れの強調つきの HTML 1枚にする（Canvas 向け）","recommendGem":false,"mdName":"","order":5,"vars":[{"key":"ledger","label":"質問台帳","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"viewer","label":"見る人と場面","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 週次の定例で、課長と一緒に画面を見ながら確認する"}],"prompt":"# 役割\nあなたは業務画面に強い情報デザイナー兼フロントエンドエンジニアです。質問台帳を、開いてすぐ「何が残っているか」が分かる HTML 1枚にしてください。\n\n# 入力\n## 見る人と場面\n{{viewer}}（指定なしなら、自分が毎日見て次の行動を決める）\n\n## 質問台帳\n\"\"\"\n{{ledger}}\n\"\"\"\n\n# 画面に入れるもの\n1. 上部: ステータス別の件数カード（要確認・対応中・仮置き・確定・取り下げ）。カードを押すとそのステータスに絞り込む\n2. 絞り込み: ステータスの切り替えボタン、確認先の選択、文字検索（質問・回答・メモが対象）\n3. 一覧: 1件1行。ID・質問・ステータス・次の行動・確認先・期限を見せる。初期の並びは 要確認 → 対応中 → 仮置き → 確定 → 取り下げ、同じステータスの中は期限が近い順\n4. 行を押すと開く詳細: 回答の要点・根拠（引用）・あいまいな点・メモ\n5. 期限が今日より前で、確定・取り下げ以外の行は「期限切れ」の印を付ける\n6. 仮置きの行には、見直す条件をいつも見えるように出す\n\n# 作り方\n- HTML・CSS・JavaScript を1ファイルにまとめる\n- 台帳のデータは、HTML の中の JavaScript の配列として埋め込む\n- 画面の文字は textContent で入れる（innerHTML に台帳の文字を入れない）\n- ステータスは色に加えて、文字のラベルでも区別する\n- スマホの幅（375px）では、一覧を縦に積んだカードにする\n- 印刷したときは、絞り込み中の行だけが表で出るようにする\n\n# 出力形式\n## 画面の説明（3行）\n\n## HTML\n```html\n（ファイル全体。省略しない）\n```\n\n## 台帳を差し替えるとき\n次回、データの配列だけを入れ替える方法（1〜2行）。\n\n# 守ること\n- 外部のライブラリ・CDN・Web フォント・画像を使わない。通信しない\n- 台帳に無い内容を足さない。空の欄は「不明」ではなく空欄のまま表示する\n- 台帳の行を省略しない\n- コードを「…（省略）」で省かない。出し切れないときは区切りのよい所で止めて「続きは『続き』と送ってください」と書く\n\n# 最後に確認\n件数カードの数と台帳の件数が合っているか、すべての行がデータに入っているか、閉じタグの漏れがないかを確かめてから出す。","tips":"Gemini の Canvas を使うと、出来上がりをその場で見て「ここを直して」と続けて頼めます。\nCanvas からダウンロードした HTML はダブルクリックで開けます。社内で共有するときは、議事録と同じ扱いの場所に置いてください。\n次からは「質問台帳の更新」の出力を貼り、「データの配列だけ差し替えて」と頼むと、見た目を保ったまま更新できます。","example":"## 画面の説明\n上に5つの件数カード、その下に絞り込みと検索、一覧は要確認が先頭に来ます。\n期限切れの行には赤い枠と「期限切れ」の文字が付きます。\n行を押すと、根拠の引用とあいまいな点が開きます。\n\n## HTML\n```html\n\u003c!doctype html>\n\u003chtml lang=\"ja\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>質問台帳\u003c/title>\n\u003cstyle>/* 件数カード・一覧・詳細 */\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003csection class=\"counts\">…\u003c/section>\n  \u003csection class=\"filters\">…\u003c/section>\n  \u003cul class=\"ledger\">…\u003c/ul>\n  \u003cscript>\n    const rows = [\n      { id: 'Q-001', question: '夜間の障害対応は保守に含まれるか', status: '要確認', next: '夜間対応の有無と費用を聞く', owner: 'ベンダー営業', due: '' },\n      …\n    ];\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n```","gem":"","followups":[{"title":"期限で並べたい","text":"初期の並びを、ステータスに関係なく期限が近い順にしてください。期限が空の行は最後にしてください。"},{"title":"報告用の1枚にしたい","text":"絞り込みと検索を外し、要確認・仮置き・期限切れだけを載せた A4 縦1枚の印刷向けレイアウトにしてください。"}]},{"id":"qa-digest","title":"質問台帳 → 確定事項まとめ（NotebookLM に戻す）","category":"notebooklm","summary":"台帳の確定・仮置きだけを、NotebookLM のソースに戻せる文書にする。次の質問から、決まったことを踏まえた回答になる","recommendGem":true,"mdName":"確定事項まとめ","order":6,"vars":[{"key":"ledger","label":"質問台帳","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"project","label":"案件名","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 基幹システム更改"}],"prompt":"# 役割\nあなたは案件の記録係です。質問台帳から、決まったことと仮に決めたことだけを抜き出し、NotebookLM が正しく読み取れる文書にしてください。\n\n# 入力\n## 案件名\n{{project}}\n\n## 質問台帳\n\"\"\"\n{{ledger}}\n\"\"\"\n\n# 手順\n1. ステータスが「確定」と「仮置き」の行だけを取り出す。要確認・対応中・取り下げは入れない\n2. テーマ（費用・範囲・日程・体制・契約など）ごとにまとめる\n3. 1件を1文の言い切りにする。主語と数字と条件を省かない（例: ×「含まれない」→ ○「保守契約に夜間の障害対応は含まれない」）\n4. 確定には根拠を、仮置きには「仮置き」の印と見直す条件を、それぞれ文の後ろに付ける\n5. 台帳の ID を各文の頭に付け、元の台帳に戻れるようにする\n\n# 出力形式\n# {案件名} 確定事項まとめ（作成日: 今日の日付）\n\nこの文書は、質問台帳のうち確定と仮置きだけをまとめたもの。仮置きは未確定であり、見直す条件が満たされたら変わる。\n\n## （テーマ名）\n- [Q-001] 確定: （言い切りの1文）（根拠: ソース名・該当箇所）\n- [Q-003] 仮置き: （言い切りの1文）（見直す条件: …）\n\n## まだ決まっていないこと（件数だけ）\n要確認 ◯件、対応中 ◯件。中身は質問台帳を見る。\n\n# 守ること\n- 台帳に無い内容を足さない。台帳の文を、意味を変えずに言い切りにするだけにする\n- 仮置きを確定のように書かない。必ず「仮置き」と書く\n- 「これ」「上記」のような、前の文を見ないと分からない言葉を使わない（NotebookLM は文を切り出して読む）\n- 表を使わず、見出しと箇条書きだけで書く\n\n# 最後に確認\n確定と仮置き以外が入っていないか、すべての仮置きに見直す条件があるか、各文が単独で読んでも意味が通るかを確かめてから出す。","tips":"「.md で保存」したファイルを、NotebookLM のソースに追加してください。前の版は外して、いつも最新の1つだけを入れておきます。\nNotebookLM に質問するとき「確定事項まとめと食い違う記述があれば指摘して」と添えると、古い資料との食い違いが見つかります。","example":"# 基幹システム更改 確定事項まとめ（作成日: 2026-11-18）\n\n## 費用\n- [Q-002] 確定: A社の見積にはデータ移行作業費 120 万円が含まれる（根拠: 見積書 v3 p.3）\n- [Q-003] 仮置き: 移行するデータは直近5年分として見積を比べる（見直す条件: 7年以上の保存が必要と分かったとき）","gem":"","followups":[{"title":"仮置きを外したい","text":"確定だけでまとめ直してください。"}]},{"id":"qa-glossary","title":"案件の用語集（あいまいな言葉の定義）","category":"notebooklm","summary":"回答や資料に出てくる「原則」「標準」「月末」などの言葉を、案件の中での意味に固定する。決まっていない言葉は確認事項にする","recommendGem":true,"mdName":"用語集","order":7,"vars":[{"key":"text","label":"質問台帳・NotebookLM の回答・資料の抜粋","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"project","label":"案件名と関係者","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 基幹システム更改。当社（発注側）と A社（ベンダー）"}],"prompt":"# 役割\nあなたは契約書と仕様書の読み合わせに慣れた担当者です。人によって意味が変わりそうな言葉を拾い、案件の中での意味を1つに決めるための用語集を作ってください。\n\n# 入力\n## 案件名と関係者\n{{project}}\n\n## 質問台帳・回答・資料\n\"\"\"\n{{text}}\n\"\"\"\n\n# 手順\n1. 次のような言葉を拾う: 範囲があいまいな言葉（原則・標準・基本・など・一式）、時期の言葉（月末・営業日・速やかに）、数え方の言葉（1件・1人月・ユーザー数）、案件独自の略語や呼び名\n2. 言葉ごとに、資料の中で意味が書かれているかを探す。書かれていれば、その定義と出どころを書く\n3. 書かれていなければ、考えられる解釈を2つ以上挙げ、解釈によって何が変わるか（費用・日程・範囲）を書く\n4. 定義が書かれている言葉は「定義あり」、無い言葉は「要確認」にする\n\n# 出力形式\n## 1. 用語集\n| 用語 | 案件の中での意味 | 出どころ（資料名・該当箇所） | 状態（定義あり・要確認） |\n|---|---|---|---|\n\n## 2. 意味を決める必要がある言葉\n| 用語 | 解釈の候補 | 解釈で変わること | 誰と決めるか | 聞き方（そのまま使える一文） |\n|---|---|---|---|---|\n\n# 守ること\n- 資料に無い定義を作らない。定義が無いものは「要確認」にする\n- 一般的な辞書の意味で埋めない。案件の中での意味だけを書く\n- 影響の大きい言葉（費用・日程・範囲に効くもの）を先に並べる\n\n# 最後に確認\n「定義あり」のすべてに出どころがあるか、「要確認」のすべてに解釈の候補があるかを確かめてから出す。","tips":"質問台帳の「あいまいな点」の列や、「あいまいな言い回し」の表を貼ると、拾う言葉が絞れます。\n「要確認」の言葉は、質問台帳に新しい質問として足してください（「質問台帳の更新」に貼る）。\n定義が決まったら用語集を NotebookLM のソースに入れておくと、回答の言葉づかいがそろいます。","example":"## 2. 意味を決める必要がある言葉\n| 用語 | 解釈の候補 | 解釈で変わること | 誰と決めるか | 聞き方 |\n|---|---|---|---|---|\n| 営業日 | 平日のみ / 平日と当社の休業日を除く | 障害対応の期限が最大4日ずれる | ベンダー営業 | 「契約書の営業日には、当社の年末年始休業は含まれますか」 |","gem":"","followups":[{"title":"用語が多すぎる","text":"費用・日程・範囲のどれかに効く言葉だけに絞ってください。"}]},{"id":"qa-status-report","title":"質問台帳 → 確認状況の報告","category":"notebooklm","summary":"台帳から、要確認・期限切れ・最近決まったことと、その影響を、上司に送れる短い報告にする","recommendGem":false,"mdName":"","order":8,"vars":[{"key":"ledger","label":"質問台帳","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"reader","label":"報告する相手と、相手が気にしていること","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 課長。発注先を月末までに決められるかを気にしている"},{"key":"since","label":"前回の報告日","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 2026-11-11"}],"prompt":"# 役割\nあなたは忙しい上司への報告に慣れた担当者です。質問台帳から、相手が判断に使える情報だけを短くまとめてください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 報告する相手と、相手が気にしていること\n{{reader}}\n\n## 前回の報告日\n{{since}}（指定なしなら、更新日が直近7日以内のものを「最近決まったこと」とする）\n\n## 質問台帳\n\"\"\"\n{{ledger}}\n\"\"\"\n\n# 手順\n1. ステータス別の件数を数える\n2. 前回の報告日より後に「確定」「仮置き」になったものを拾う\n3. 期限が過ぎている、または7日以内のもので、確定・取り下げ以外のものを拾う\n4. 相手が気にしていることに効くものを選び、影響（遅れる・費用が増える・決められない）を一言で書く\n5. 相手にお願いしたいこと（判断・催促・承認）があれば、最後に1つにまとめる\n\n# 出力形式\n## 件名\n【確認状況】（案件名）（今日の日付）\n\n## 本文\n### 結論（3行以内）\n相手が気にしていることに対して、今どうか。\n\n### 件数\n要確認 ◯ / 対応中 ◯ / 仮置き ◯ / 確定 ◯（前回から確定 +◯）\n\n### 最近決まったこと\n- [Q-番号] 内容（確定・仮置き）\n\n### 気をつけてほしいこと\n| ID | 内容 | 期限 | 影響 |\n|---|---|---|---|\n\n### お願いしたいこと\n（無ければ「なし」）\n\n# 守ること\n- 台帳に無いことを書かない。分からない欄は「不明」と書く\n- 仮置きを確定と書かない\n- 全件を並べない。相手が判断に使うものだけにする（気をつけてほしいことは5件まで）\n- 本文は 400 字程度に収める\n\n# 最後に確認\n件数が台帳と合っているか、結論が相手の気にしていることに答えているかを確かめてから出す。","tips":"週1回、「質問台帳の更新」の後に使うと、報告の手間がほぼ無くなります。\nメールにする前に言い回しを整えたいときは、続けて「上司への報告」に貼ってください。\n前回の報告日を入れると、「最近決まったこと」がその日以降に絞られます。","example":"### 結論\n発注先は月末までに決められる見込みです。残る論点は夜間対応の費用1件で、11/22 までに A社から回答が来ます。\n\n### 気をつけてほしいこと\n| ID | 内容 | 期限 | 影響 |\n|---|---|---|---|\n| Q-004 | 夜間対応を別契約にするか | 11/22 | 回答が遅れると比較表が作れず、決定が翌月にずれる |","gem":"","followups":[{"title":"もっと短く","text":"結論と、お願いしたいことだけにしてください。チャットで送れる3行にしてください。"}]},{"id":"qa-decision-log","title":"決定ログ（いつ・誰が・何を根拠に決めたか）","category":"notebooklm","summary":"台帳の変更点・議事録・メールから、決めたことを日付順の記録にする。仮置きを確定にした理由も後から追える","recommendGem":true,"mdName":"決定ログ","order":9,"vars":[{"key":"text","label":"決めたことが分かる素材（台帳の変更点・議事録・メール）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"log","label":"これまでの決定ログ","multiline":true,"optional":true,"attachable":true,"placeholder":""}],"prompt":"# 役割\nあなたは案件の記録係です。後から「なぜこうなったのか」と聞かれても答えられるよう、決めたことを記録してください。\n\n# 入力\n## これまでの決定ログ\n\"\"\"\n{{log}}\n\"\"\"\n（空なら新しく作る。番号は D-001 から）\n\n## 決めたことが分かる素材\n\"\"\"\n{{text}}\n\"\"\"\n\n# 手順\n1. 素材から「決めた」「この前提で進める」「やめる」「変更する」に当たるものを拾う。検討しただけ・提案しただけのものは入れない\n2. それぞれについて、決めた日・決めた人（または場）・決めた内容・根拠・ほかの案と退けた理由・関係する質問台帳の ID を書く\n3. 前の決定を変えるものは、変える前の決定の番号を書き、「変更」とする\n4. これまでのログがあれば、その後ろに番号の続きで足す。過去の行は書き換えない\n\n# 出力形式\n## 1. 今回足した決定\n| No | 決めた日 | 決めた人・場 | 決めた内容 | 種類（決定・仮置き・変更・取りやめ） | 根拠 | 退けた案と理由 | 関係する ID |\n|---|---|---|---|---|---|---|---|\n\n## 2. 決定ログ（全件・日付順）\n（1と同じ列）\n\n## 3. 決めたのか分からないもの\n素材の中で、決まったのか検討中なのか読み取れないもの（なければ「なし」）。\n\n# 守ること\n- 素材に無い決定を作らない。決めた日や人が書かれていなければ「不明」と書く\n- 検討中のものを決定として書かない。迷ったら「3. 決めたのか分からないもの」に入れる\n- 過去の行を消したり書き換えたりしない。変えるときは新しい行で「変更」にする\n- 表のセルの中で改行しない\n\n# 最後に確認\nすべての決定に根拠か「不明」が書かれているか、過去の行が変わっていないかを確かめてから出す。","tips":"「質問台帳の更新」の変更点の表、会議の議事録、確認先とのメールをまとめて貼ってください。\n前回の .md を「これまでの決定ログ」に貼ると、続きの番号で足していきます。\n退けた案と理由を残しておくと、同じ議論を繰り返さずに済みます。","example":"## 1. 今回足した決定\n| No | 決めた日 | 決めた人・場 | 決めた内容 | 種類 | 根拠 | 退けた案と理由 | 関係する ID |\n|---|---|---|---|---|---|---|---|\n| D-004 | 2026-11-17 | 定例会議（課長） | 移行するデータは直近5年分で見積を比べる | 仮置き | 法定の保存年数を情シスが確認中のため | 全期間で比べる案: 見積がそろわず比較できない | Q-003 |","gem":"","followups":[{"title":"1件の経緯を見たい","text":"指定した ID に関係する決定だけを日付順に並べ、どう変わってきたかを3行でまとめてください。ID: （ここに書く）"}]},{"id":"ppt-outline","title":"素材 → スライド骨子","category":"ppt","summary":"1枚1メッセージ・タイトルに結論を書く形で、スライドの構成を作る（Gemini アプリ用）","recommendGem":false,"mdName":"スライド骨子","order":1,"vars":[{"key":"material","label":"素材（メモ・資料・議事録）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"goal","label":"発表の目的（誰に何をしてほしいか）","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 部長に Web 広告の増額を承認してもらう"},{"key":"audience","label":"聞き手","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 部長と課長3名。数字に厳しい"},{"key":"duration","label":"発表時間・枚数","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 10分 / 8枚程度"},{"key":"change","label":"聞き手の認識の変化（開始前 → 終了後）","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 前「AI は高くて効果が見えない」→ 後「小さく試せば元が取れる。まず1部署で試す」"},{"key":"medium","label":"見せ方","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 会議室で投影 / PDF で配って読んでもらう / スマホで読む"}],"prompt":"# 役割\nあなたは経営コンサルタント出身のプレゼン設計者です。聞き手が「なるほど、そうしよう」と動く資料の骨子を作ってください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 発表の目的\n{{goal}}\n\n## 聞き手\n{{audience}}\n\n## 発表時間・枚数\n{{duration}}（指定なしなら 8〜12 枚）\n\n## 聞き手の認識の変化\n{{change}}（指定なしなら、目的から「開始前に信じていること」と「終了後に分かってほしいこと」を推定し、推定だと明記する）\n\n## 見せ方\n{{medium}}（指定なしなら、会議室で投影）\n\n## 素材\n\"\"\"\n{{material}}\n\"\"\"\n\n# 手順\n1. 目的と聞き手から、資料全体で伝える「一文のメッセージ」を決める\n2. ストーリーを組む（結論 → 理由 → 根拠 → 提案 → 次の行動）。聞き手が反対しそうな点への答えを根拠の中に入れる。聞き手の認識が、開始前から終了後へ1枚ずつ進む順番にする\n3. 見せ方に合わせて1枚の情報量を決める。投影なら文字を減らして話で補う、PDF で配るなら読むだけで分かる文にする、スマホなら1枚の要素を2点までにする\n4. 1枚に1つのメッセージになるようにスライドへ割り振る。目安は発表1分あたり1枚\n5. 各スライドのタイトルを、名詞ではなく結論の文にする（例: ×「売上推移」→ ○「売上は3年で2倍に伸びた」）\n6. 各スライドに載せる要素と、図にするならその種類を決める\n\n# 出力形式\n## 1. 一文で言うと\n\n## 2. ストーリー\n結論 → 理由 → 根拠 → 提案 → 次の行動 を、それぞれ1行で。最後に「聞き手の認識: 開始前 → 終了後」を1行で。\n\n## 3. スライド構成\n| No | タイトル（結論の文・30字以内） | 伝えること | 載せる要素（3点まで） | 図の案（グラフ・表・図解の種類） | 素材の該当箇所 |\n|---|---|---|---|---|---|\n\n## 4. 素材に足りないもの\n説得力を上げるために追加したいデータや事例。\n\n# 守ること\n- 素材に無い数字や事例を作らない。必要なら「4. 素材に足りないもの」に書く\n- 1枚に載せる要素は3点まで。入りきらないものは別のスライドにするか削る\n- 表紙・目次・まとめのスライドも枚数に含める\n\n# 最後に確認\nタイトルだけを上から読んで話が通じるか、すべてのタイトルが結論の文になっているかを確かめ、直してから出す。","tips":"目的は「誰に何をしてほしいか」まで書くと、構成が締まります。\nこの骨子を「骨子 → スライドの Gemini 用の指示」に渡すと、Google スライドで1枚ずつ作れます。\n作る前に「ストーリーの診断」にかけるのもおすすめです。","example":"## 1. 一文で言うと\n展示会の予算を Web 広告に移せば、同じ費用で商談数を 1.3 倍にできる。\n\n## 3. スライド構成\n| No | タイトル | 伝えること | 載せる要素 | 図の案 | 素材の該当箇所 |\n|---|---|---|---|---|---|\n| 1 | 展示会の予算を Web 広告に移したい | 結論と依頼 | 依頼内容 / 金額 / 判断の期限 | なし（大きな文字） | 議事録 第3回 |\n| 2 | 展示会1回あたりの商談数は2年で4割減った | 現状の課題 | 商談数の推移 / 1件あたりの費用 | 棒グラフ（年別） | 実績表 p.4 |\n| 3 | Web 広告なら商談1件あたりの費用が半分になる | 解決策の根拠 | 費用比較 / 他社事例 | 横棒グラフ（2本の比較） | 見積もり資料 |","gem":"","followups":[{"title":"枚数が多すぎる","text":"半分の枚数にしてください。削るスライドと、その内容をどこに統合したかを示してください。"},{"title":"タイトルが結論になっていない","text":"すべてのタイトルを「〜は〜だ」「〜すべきだ」の形の結論文に書き直してください。"},{"title":"聞き手が納得しなさそう","text":"聞き手が最も疑いそうな点を3つ挙げ、それに答えるスライドを構成に組み込んでください。"}]},{"id":"story-check","title":"ストーリーの診断","category":"ppt","summary":"スライドのタイトルだけを並べて、話の流れが通るかを確かめる","recommendGem":false,"mdName":"ストーリーの診断","order":2,"vars":[{"key":"titles","label":"スライドのタイトル一覧","multiline":true,"optional":false,"attachable":false,"placeholder":"1行に1枚。上から順に"},{"key":"goal","label":"発表の目的","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたはストーリー構成の専門家です。タイトルだけを読んで、話の筋が通っているかを診断してください。\n\n# 入力\n## 発表の目的\n{{goal}}\n\n## スライドのタイトル一覧（上から順）\n\"\"\"\n{{titles}}\n\"\"\"\n\n# 手順\n1. タイトルだけを上から読み、伝わる内容を3行で要約する\n2. 各スライドの役割（結論・背景・課題・原因・解決策・根拠・効果・計画・依頼・まとめ）を判定する\n3. 論理の飛び・重複・順番の誤り・結論のないタイトルを指摘する\n4. 直したタイトル一覧を作る\n\n# 出力形式\n## タイトルだけで伝わる内容（3行）\n\n## 診断\n| No | タイトル | 役割 | 問題（なければ「—」） |\n|---|---|---|---|\n\n## 流れの問題\n- 論理の飛び（AとBの間に何が足りないか）\n- 重複\n- 順番\n\n## 直したタイトル一覧\n1. …\n\n# 守ること\n- タイトルはすべて結論の文（30字以内）に直す\n- 新しいスライドを足すときは【追加】と印を付ける\n\n# 最後に確認\n直したタイトル一覧だけを読んで、目的が伝わるかを確かめてから出す。","tips":"骨子の段階でも、完成した資料でも使えます。資料からタイトルだけをコピーして貼ってください。\n「タイトルを読むだけで話が分かる」資料は、忙しい人にも伝わります。","example":"## 診断\n| No | タイトル | 役割 | 問題 |\n|---|---|---|---|\n| 1 | 来期の販促計画 | 結論？ | 結論になっていない |\n| 2 | 展示会の実績 | 背景 | 何が言いたいか分からない |\n| 3 | Web 広告の見積もり | 解決策 | 課題の説明より先に解決策が来ている |\n\n## 直したタイトル一覧\n1. 展示会の予算を Web 広告に移したい\n2. 展示会の商談数は2年で4割減った\n3. 【追加】原因は来場者の層が変わったこと\n4. Web 広告なら商談1件の費用が半分になる","gem":"","followups":[{"title":"別の流れも見たい","text":"同じ内容を「課題から入る流れ」と「結論から入る流れ」の2通りで並べ、どちらが目的に合うか比べてください。"}]},{"id":"slides-gemini-instructions","title":"骨子 → スライドの Gemini 用の指示","category":"ppt","summary":"骨子から、Google スライドの Gemini にそのまま貼れる1枚ごとの短い指示を作る","recommendGem":false,"mdName":"","order":3,"vars":[{"key":"outline","label":"スライド骨子","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"design","label":"デザインの方向性","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 白地に紺。各スライドの主役はタイトルの結論と1つの数字。視線はタイトル → 数字 → 補足の順。写真と飾りのアイコンは使わない"}],"prompt":"# 役割\nあなたは Google スライドでの資料作りに慣れた制作担当です。スライドの中の Gemini に1枚ずつ渡す、短く迷いのない指示を作ってください。\n\n# 入力\n## デザインの方向性\n{{design}}\n\n## スライド骨子\n\"\"\"\n{{outline}}\n\"\"\"\n\n# 手順\n1. デザインの方向性が「おしゃれ」「高級感」のような形容詞だけなら、主役（最初に見せるもの）・配置・視線の順番・使わない要素に分けて解釈し、その解釈を「全体の作り方」に書く\n2. 骨子のスライドを1枚ずつ取り出す\n3. 1枚ごとに、タイトル・本文・図の指示を、そのまま貼れる短い文にまとめる\n4. 図は Gemini が作れない場合に備えて、自分で作るときの手順も一言添える\n\n# 出力形式\n最初に「全体の作り方」を3行で書く。その後、スライドごとに次の形で出す。\n\n### スライド {番号}: {タイトル}\n**Gemini に貼る指示**\n```\n次の内容でスライドを1枚作成してください。\nタイトル: …\n本文（箇条書き）:\n・…\n・…\nレイアウト: …（例: 左に本文、右に図）\n```\n**図・画像**: 何を、どう作るか（グラフならデータと種類）\n**発表で言うこと**: 1行\n\n# 守ること\n- Gemini に貼る指示は1枚あたり 250 字以内にする\n- 本文の箇条書きは3点まで、1点は全角25字以内にする\n- 骨子に無い内容を足さない\n- デザインの指定は全スライドで同じ言葉を使う（色やトーンが揃うようにする）\n\n# 最後に確認\nすべてのスライドがそろっているか、指示が 250 字を超えていないかを確かめてから出す。","tips":"「素材 → スライド骨子」の出力をそのまま貼ってください。\nGoogle スライドでは、右上の Gemini アイコンからサイドパネルを開き、1枚ずつ指示を貼ります。\nグラフは Gemini より、スプレッドシートで作って貼る方が数字が正確です。","example":"**全体の作り方**: 白地に紺のテーマを先に適用する → 1枚ずつ下の指示をサイドパネルに貼る → グラフはスプレッドシートで作って貼る。\n\n### スライド 2: 展示会1回あたりの商談数は2年で4割減った\n**Gemini に貼る指示**\n```\n次の内容でスライドを1枚作成してください。\nタイトル: 展示会1回あたりの商談数は2年で4割減った\n本文（箇条書き）:\n・2024年 30件 → 2026年 18件\n・1件あたりの費用は 2.3倍に\nレイアウト: 左に本文、右にグラフを置く空きスペース\n```\n**図・画像**: 年別の商談数の棒グラフ（2024: 30 / 2025: 24 / 2026: 18）。スプレッドシートで作って右側に貼る\n**発表で言うこと**: 費用は変わらないのに、成果だけが落ちています。","gem":"","followups":[{"title":"スライドの Gemini がうまく作れない","text":"指示をさらに短く、タイトルと本文だけにしてください。レイアウトの指定は外してください。"},{"title":"デザインがばらばら","text":"全スライド共通で使う「デザインの指示文」を1つ作り、各スライドの指示の先頭に同じ文を付けてください。"}]},{"id":"ppt-brushup-diagnosis","title":"既存資料のブラッシュアップ診断","category":"ppt","summary":"既存のスライドを1枚ずつ診断し、タイトル・削減・図解化・並べ替えの指示を出す","recommendGem":false,"mdName":"資料の診断","order":4,"vars":[{"key":"deck","label":"既存の資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"goal","label":"発表の目的","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 来期予算の承認を得る"},{"key":"audience","label":"聞き手","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは辛口のプレゼン講師です。この資料を、聞き手が一度で理解して動ける資料に直すための診断をしてください。遠慮は要りません。\n\n# 入力\n## 発表の目的\n{{goal}}\n\n## 聞き手\n{{audience}}\n\n## 既存の資料\n\"\"\"\n{{deck}}\n\"\"\"\n\n# 手順\n1. 資料全体を読み、いま伝わってくるメッセージを1文で書く。目的と比べてずれを指摘する\n2. スライドごとに、次の問題がないかを診断する\n   - メッセージが分からない（タイトルが名詞だけ）\n   - 情報が多すぎる（要素が4つ以上、文字が多い）\n   - 図にすべき文章がある\n   - 前後の流れに合わない・重複している\n3. 構成として、削る・まとめる・順番を変えるスライドを決める\n4. 表記ゆれ・フォント・色の使い方など、全体で揃えるルールを挙げる\n\n# 出力形式\n## 1. 総評\n- いま伝わるメッセージ:\n- 本来伝えたいメッセージ:\n- 最も効く直し方（3つ）\n\n## 2. スライドごとの診断\n| No | 今のタイトル | 問題 | 直したタイトル（結論の文） | 直し方の指示 |\n|---|---|---|---|---|\n\n## 3. 構成の組み替え\n- 削る: \n- まとめる: \n- 順番を変える: \n- 新しく足す: \n\n## 4. 全体で揃えること\n- 表記ゆれ（例: 「お客様／顧客」）、数字の単位、色の意味、フォントサイズ\n\n# 守ること\n- 資料に無い数字や事実を足さない。足すべきデータは「新しく足す」に提案として書く\n- 直し方の指示は「〜を〜にする」の形で具体的に書く（「見やすくする」は不可）\n- 良い点を褒めるより、直すべき点を優先する\n\n# 最後に確認\nすべてのスライドを診断したか、直したタイトルだけを読んで話が通るかを確かめてから出す。","tips":"PowerPoint は PDF に書き出してから添付すると、確実に読み取れます。\n診断の後は「スライド1枚の改善指示」で、問題の大きいスライドから直していくと効率的です。","example":"## 2. スライドごとの診断\n| No | 今のタイトル | 問題 | 直したタイトル | 直し方の指示 |\n|---|---|---|---|---|\n| 3 | 売上推移 | メッセージが分からない / 表が細かすぎる | 売上は3年で2倍、伸びは Web 経由 | 表を折れ線グラフにし、Web 経由の線だけ色を付ける |\n| 5 | 課題 | 箇条書きが8つ | 最大の課題は商談化率の低さ | 課題を3つに絞り、残りは付録へ |","gem":"","followups":[{"title":"指示が抽象的","text":"「直し方の指示」をすべて、作業する人が迷わない具体的な操作（何を・どこに・どうする）に書き直してください。"},{"title":"全部直す時間がない","text":"30分で直すとしたら、どのスライドの何を直すべきか、効果の大きい順に5つ挙げてください。"}]},{"id":"slide-single-improve","title":"スライド1枚の改善指示","category":"ppt","summary":"1枚のスライドを直し、スライドの Gemini にそのまま貼れる短い指示まで出す","recommendGem":false,"mdName":"","order":5,"vars":[{"key":"slide","label":"スライドの内容（文字・画像）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"message","label":"このスライドで伝えたいこと","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたはスライドの添削者です。この1枚を、3秒で言いたいことが伝わるスライドに直してください。\n\n# 入力\n## このスライドで伝えたいこと\n{{message}}\n\n## スライドの内容\n\"\"\"\n{{slide}}\n\"\"\"\n\n# 手順\n1. いまのスライドから伝わることを1文で書く\n2. 伝えたいことと比べて、問題を3つまで挙げる\n3. タイトル・本文・図を直す\n4. Google スライドの Gemini に貼る短い指示にまとめる\n\n# 出力形式\n## 今伝わること\n\n## 問題点（3つまで）\n\n## 直した内容\n- タイトル（結論の文・30字以内）:\n- 本文（箇条書き3点まで、1点は全角25字以内）:\n- 図・強調: \n\n## スライドの Gemini に貼る指示（200字以内）\n```\nこのスライドを次のように直してください。\n…\n```\n\n# 守ること\n- 伝えたいことが書かれていなければ、スライドから最も言いたそうなことを推定し、そう明記する\n- スライドに無い数字を足さない\n\n# 最後に確認\n直したタイトルだけで言いたいことが伝わるかを確かめてから出す。","tips":"Google スライドの該当ページのスクリーンショットを添付するのが手軽です。\n「既存資料のブラッシュアップ診断」で問題が大きかったスライドに使ってください。","example":"## 今伝わること\nいろいろな課題がある、ということしか伝わらない。\n\n## 問題点\n1. タイトル「課題」が結論になっていない\n2. 箇条書きが8つあり、どれが重要か分からない\n3. 文字が小さく、後ろの席から読めない\n\n## 直した内容\n- タイトル: 最大の課題は、商談化率が5%と低いこと\n- 本文: ・問い合わせは月120件と十分 ・商談になるのは6件だけ ・初回の返信が平均3日かかっている\n- 図・強調: 「5%」を大きく、赤で\n\n## スライドの Gemini に貼る指示\n```\nこのスライドを次のように直してください。\nタイトル: 最大の課題は、商談化率が5%と低いこと\n本文を3行に減らす: 問い合わせは月120件と十分 / 商談になるのは6件だけ / 初回の返信が平均3日かかっている\n「5%」を大きく強調する\n```","gem":"","followups":[{"title":"もっと大胆に","text":"文字をさらに減らし、数字1つと短い文1つで伝える版も作ってください。"}]},{"id":"chart-improve","title":"グラフの改善","category":"ppt","summary":"グラフの画像やデータから、伝えたいことに合った見せ方と作り方を出す","recommendGem":false,"mdName":"","order":6,"vars":[{"key":"chart","label":"グラフの画像またはデータ","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"message","label":"このグラフで伝えたいこと","multiline":false,"optional":false,"attachable":false,"placeholder":"例: Web 経由の売上だけが伸びている"}],"prompt":"# 役割\nあなたはデータの見せ方の専門家です。このグラフを、伝えたいことが一目で分かる形に直してください。\n\n# 入力\n## 伝えたいこと\n{{message}}\n\n## グラフの画像またはデータ\n\"\"\"\n{{chart}}\n\"\"\"\n\n# 手順\n1. いまのグラフから読み取れることと、読み取りにくいことを挙げる\n2. 伝えたいことに合うグラフの種類を選ぶ（比較 → 棒、推移 → 折れ線、構成 → 積み上げ棒、関係 → 散布図 など）\n3. 具体的な直し方を決める: 並び順、強調する1色、凡例をやめて直接ラベル、軸の範囲（棒グラフは0から）、単位、タイトルを結論の文に\n4. Google スプレッドシートでの作り方を手順にする\n\n# 出力形式\n## 今のグラフ\n- 読み取れること:\n- 読み取りにくいこと:\n\n## おすすめのグラフ\n- 種類と理由:\n- 次点:\n\n## 直し方\n| 項目 | 今 | 直した後 |\n|---|---|---|\n| タイトル | | |\n| 種類 | | |\n| 並び順 | | |\n| 色 | | |\n| ラベル・凡例 | | |\n| 軸・単位 | | |\n\n## スプレッドシートでの作り方\n1. …\n\n## 避けた方がよい見せ方\n- 3D・円グラフの多用など、このデータで誤解を生むもの\n\n# 守ること\n- 数字を変えない。画像から読み取った数字は「読み取り値」と明記する\n- 色は強調したい1系列だけに付け、他は灰色にする\n\n# 最後に確認\n直した後のタイトルが伝えたいことを言い切っているかを確かめてから出す。","tips":"グラフのスクリーンショットを添付するだけで使えます。元データを貼ると、作り方の手順が正確になります。","example":"## 直し方\n| 項目 | 今 | 直した後 |\n|---|---|---|\n| タイトル | 経路別売上 | Web 経由の売上だけが3年で2倍に |\n| 種類 | 円グラフ3つ | 折れ線グラフ1つ |\n| 色 | 5色 | Web 経由だけ紺、他は灰色 |\n| ラベル・凡例 | 凡例が右下 | 線の右端に経路名を直接書く |","gem":"","followups":[{"title":"スライドに貼る形にしたい","text":"このグラフをスライド1枚にするときのタイトル・補足の一文・強調の仕方を書いてください。"}]},{"id":"exec-summary","title":"エグゼクティブサマリー1枚","category":"ppt","summary":"長い資料を、経営層向けのスライド1枚にまとめる","recommendGem":false,"mdName":"","order":7,"vars":[{"key":"doc","label":"元の資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"reader","label":"読み手","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 役員会"},{"key":"ask","label":"読み手にしてほしいこと","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 予算 300 万円の承認"}],"prompt":"# 役割\nあなたは経営企画の担当者です。忙しい役員が1分で判断できるよう、資料をスライド1枚にまとめてください。\n\n# 入力\n## 読み手\n{{reader}}\n\n## 読み手にしてほしいこと\n{{ask}}\n\n## 元の資料\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 資料の結論と、読み手にしてほしいことを特定する\n2. 判断に必要な根拠を3つに絞る。それぞれ数字を1つ付ける\n3. リスクと、その対策を1つずつ書く\n\n# 出力形式\n## スライド1枚の内容\n- タイトル（結論の文・30字以内）:\n- 要点1（40字以内）／根拠の数字:\n- 要点2（40字以内）／根拠の数字:\n- 要点3（40字以内）／根拠の数字:\n- 判断してほしいこと（期限つき）:\n- リスクと対策（1行）:\n\n## スライドの Gemini に貼る指示（250字以内）\n```\n次の内容でエグゼクティブサマリーのスライドを1枚作成してください。\n…\n```\n\n## 口頭で添える一言（30秒）\n\n# 守ること\n- 資料に無い数字を使わない\n- 専門用語を使わない。使うなら一言で説明する\n- 判断してほしいことが資料から読み取れないときは「要確認」と書く\n\n# 最後に確認\n1枚に収まる量か（要点は3つまで）、数字がすべて資料にあるものかを確かめてから出す。","tips":"報告書や企画書の冒頭に付ける1枚として使えます。\n読み手にしてほしいことを書くと、要点がそれに向けて絞られます。","example":"## スライド1枚の内容\n- タイトル: 展示会費 300 万円を Web 広告に移し、商談を 1.3 倍に\n- 要点1: 展示会の商談数は2年で4割減 ／ 30件 → 18件\n- 要点2: Web 広告は商談1件の費用が半分 ／ 25万円 → 12万円\n- 要点
