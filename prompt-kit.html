      homeCrumb(h('span', { text: '検索' })),
      h('h2', { class: 'page-title', text: '「' + state.query.trim() + '」の検索結果 ' + hits.length + '件' }),
      hits.length ? cardGrid(hits, { showCat: true })
        : h('p', { class: 'empty', text: '見つかりませんでした。言葉を短くするか、ホームのタイルから探してください。' })
    );
  }

  // ---- 詳細のサイド（同じカテゴリだけ）----
  function renderSide() {
    var side = document.getElementById('side');
    clear(side);
    var p = byId.get(state.current);
    if (!p) return;
    var list = byCat.get(p.category) || [];
    side.append(
      h('div', { class: 'side-head' },
        h('button', { class: 'btn small', type: 'button', onclick: function () { go('#/'); } }, '← ホーム')
      ),
      h('div', { class: 'side-title' }, h('span', { text: catLabel.get(p.category) }), h('span', { text: String(list.length) })),
      h('div', null, list.map(function (q) {
        var fav = state.fav.has(q.id);
        return h('button', {
          class: 'item', type: 'button', 'aria-current': q.id === p.id ? 'true' : 'false',
          onclick: function () { openPrompt(q.id); }
        }, h('span', { class: 't' }, q.title, fav ? h('span', { class: 'fav', 'aria-hidden': 'true', text: '★' }) : null));
      }))
    );
    var cur = side.querySelector('.item[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  // ---- 詳細 ----
  function usesMy(p) {
    return referencedKeys(p.prompt).concat(referencedKeys(p.gem || '')).some(function (k) { return k.indexOf('my.') === 0; });
  }
  function hasMy() {
    return DATA.myFields.some(function (f) { return f.key !== 'tone' && (state.my[f.key] || '').trim(); });
  }
  function nextSteps(id) {
    var out = [];
    DATA.chains.forEach(function (c) {
      var i = c.steps.indexOf(id);
      if (i >= 0 && i < c.steps.length - 1) out.push({ chain: c, index: i + 1, next: byId.get(c.steps[i + 1]) });
    });
    return out;
  }

  function followupBlock(f) {
    var btn = h('button', { class: 'btn small', type: 'button', 'aria-label': '「' + f.title + '」をコピー' }, 'コピー');
    btn.addEventListener('click', function () {
      copyText(f.text).then(function (ok) {
        if (ok) { flashButton(btn, 'コピーしました ✓'); toast('追い指示をコピーしました。Gemini の同じ会話に続けて貼ってください'); }
        else toast('コピーできませんでした。文を選んで Ctrl+C でコピーしてください', 8000);
      });
    });
    return h('div', { class: 'fu' },
      h('div', { class: 'fu-head' }, h('strong', { text: f.title }), btn),
      h('p', { text: f.text })
    );
  }

  function renderDetail(box, opts) {
    opts = opts || {};
    var p = byId.get(state.current);

    // 連鎖から来たときの案内
    var banner = null;
    if (state.chainCtx && state.chainCtx.chain.steps[state.chainCtx.index] === p.id) {
      var c = state.chainCtx.chain;
      var idx = state.chainCtx.index;
      var prev = idx > 0 ? byId.get(c.steps[idx - 1]) : null;
      banner = h('div', { class: 'chain-banner' },
        h('p', null,
          h('strong', { text: '流れ「' + c.name + '」 STEP ' + (idx + 1) + ' / ' + c.steps.length }),
          prev ? '　前の「' + prev.title + '」の出力を、このプロンプトに続けて貼って送ります。' : ''
        ),
        h('button', { class: 'btn link', type: 'button', onclick: function () { go('#/flows/' + DATA.chains.indexOf(c)); } }, 'この流れを使い方タブで見る')
      );
    }

    // 送るものとコピー
    var preview = h('pre', { class: 'preview', tabindex: '0', 'aria-label': 'コピーされるプロンプト' });
    var chars = h('span', { class: 'chars' });
    var warn = h('div', { class: 'warn', role: 'status', hidden: true });
    function currentText() { return chatText(p, state.my, { withExample: state.withExample }); }
    function update() {
      var t = currentText();
      preview.textContent = t;
      chars.textContent = t.length.toLocaleString() + '文字';
    }
    function selectPreview() {
      var range = document.createRange();
      range.selectNodeContents(preview);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    var copyBtn = h('button', { class: 'btn primary big', type: 'button', id: 'copy-prompt', 'aria-keyshortcuts': 'Control+Enter' }, 'プロンプトをコピー');
    copyBtn.addEventListener('click', function () {
      copyText(currentText()).then(function (ok) {
        warn.hidden = ok;
        if (!ok) {
          warn.textContent = 'コピーできませんでした。「本文」の文を選択した状態にしたので、Ctrl+C でコピーしてください。';
          selectTab('prompt');
          selectPreview();
          toast('コピーできませんでした。選択した部分を Ctrl+C でコピーしてください', 8000);
          return;
        }
        flashButton(copyBtn, 'コピーしました ✓');
        pushRecent(p.id);
        toast(p.vars.length ? 'コピーしました。Gemini に貼り、続けて素材を貼るか添付して送ってください' : 'コピーしました。Gemini に貼って送ってください', 5000);
      });
    });
    var exampleToggle = null;
    if (p.example) {
      var cb = h('input', { type: 'checkbox' });
      cb.checked = state.withExample;
      cb.addEventListener('change', function () { state.withExample = cb.checked; update(); });
      exampleToggle = h('label', { class: 'check' }, cb, '出力例も一緒にコピーする（出力の形がぶれにくい）');
    }
    var sendItems = p.vars.map(function (v) {
      var badge = v.attachable ? h('span', { class: 'badge att', text: '貼り付け・添付どちらでも' })
        : v.optional ? h('span', { class: 'badge', text: 'なければ AI が判断' })
        : h('span', { class: 'badge req', text: 'あると良い' });
      return h('li', null, h('span', { class: 'lbl', text: v.label }), badge);
    });
    var sendCard = h('section', { class: 'card', 'aria-label': 'Gemini に送るもの' },
      h('div', { class: 'send-grid' },
        h('div', null,
          h('h3', { text: 'Gemini に送るもの' }),
          sendItems.length ? h('ul', { class: 'send-list' }, sendItems)
            : h('p', { class: 'hint', text: '素材は要りません。コピーして貼るだけで使えます。' }),
          p.mdName ? h('p', { class: 'md-note', text: '出力は Markdown（.md）のブロックで返ってきます。下の「Gemini の出力を .md で保存」でファイルにできます。' }) : null,
          usesMy(p) && !hasMy() ? h('p', { class: 'my-note' }, '自分の情報が未設定です。右上の「自分の情報」で設定すると、書き手の情報として入ります。') : null
        ),
        h('div', { class: 'send-action' },
          copyBtn,
          exampleToggle,
          h('span', { class: 'kbd-hint', text: 'Ctrl+Enter でもコピー' }),
          h('ol', { class: 'how' },
            h('li', null, 'Gemini の入力欄に貼る'),
            sendItems.length ? h('li', null, h('strong', { text: '続けて素材を貼るか、ファイルを添付する' })) : null,
            h('li', null, '送信する')
          ),
          warn
        )
      )
    );

    // 中身のタブ
    var gemPreview = h('pre', { class: 'preview', tabindex: '0', 'aria-label': 'Gem 用の指示' });
    var gemText1 = gemText(p, state.my);
    gemPreview.textContent = gemText1;
    var gemBtn = h('button', { class: 'btn', type: 'button' }, 'Gem 用をコピー');
    gemBtn.addEventListener('click', function () {
      copyText(gemText(p, state.my)).then(function (ok) {
        if (ok) { flashButton(gemBtn, 'コピーしました ✓'); toast('Gem 用の指示をコピーしました。Gem の指示の欄に貼ってください'); }
        else toast('コピーできませんでした', 8000);
      });
    });
    var panels = [
      { key: 'prompt', label: '本文', body: [
        h('div', { class: 'toolbar' }, h('span', { class: 'hint', text: 'コピーされる文の全体です。' }), h('span', { class: 'grow' }), chars),
        preview
      ] },
      { key: 'followups', label: '困ったとき', body: [
        h('p', { class: 'hint', style: 'margin-top:0', text: '出力を見て、当てはまるものを Gemini の同じ会話に続けて送ります。' }),
        p.followups.length ? h('div', { class: 'fu-label', text: 'このプロンプト用' }) : null,
        p.followups.map(followupBlock),
        DATA.followups.length ? h('details', { class: 'more' },
          h('summary', { text: '共通の追い指示（' + DATA.followups.length + '件）' }),
          DATA.followups.map(followupBlock)
        ) : null
      ] },
      p.example ? { key: 'example', label: '出力例', body: [h('pre', { class: 'preview', text: p.example })] } : null,
      { key: 'gem', label: 'Gem で使う', body: [
        h('p', { style: 'margin-top:0' }, p.recommendGem ? 'このプロンプトは Gem 向きです。毎週のように使うなら、一度登録すれば素材を送るだけで済みます。' : '何度も使うなら、Gem に登録すると素材を送るだけで済みます。'),
        h('ol', { class: 'gem-steps' },
          h('li', null, '下の「Gem 用をコピー」を押す'),
          h('li', null, 'Gemini の Gem の管理画面で新しい Gem を作り、指示の欄に貼って保存する'),
          h('li', null, '使うときは、その Gem を開いて素材を送る')
        ),
        h('div', { class: 'toolbar' }, gemBtn, h('span', { class: 'grow' }), h('span', { class: 'chars', text: gemText1.length.toLocaleString() + '文字' })),
        gemPreview
      ] },
      { key: 'tips', label: 'コツ', body: [h('p', { class: 'tips', text: p.tips })] }
    ].filter(Boolean);
    if (!panels.some(function (x) { return x.key === state.detailTab; })) state.detailTab = 'prompt';
    var tabBtns = {};
    var tabPanels = {};
    var tablist = h('div', { class: 'dtabs', role: 'tablist', 'aria-label': 'プロンプトの中身' });
    panels.forEach(function (x) {
      var b = h('button', {
        type: 'button', role: 'tab', id: 'dt-' + x.key, 'aria-controls': 'dp-' + x.key,
        onclick: function () { selectTab(x.key); }
      }, x.label);
      b.addEventListener('keydown', function (e) {
        var i = panels.indexOf(x);
        if (e.key === 'ArrowRight') i += 1;
        else if (e.key === 'ArrowLeft') i -= 1;
        else if (e.key === 'Home') i = 0;
        else if (e.key === 'End') i = panels.length - 1;
        else return;
        e.preventDefault();
        var nx = panels[(i + panels.length) % panels.length];
        selectTab(nx.key);
        tabBtns[nx.key].focus();
      });
      tabBtns[x.key] = b;
      tabPanels[x.key] = h('div', { role: 'tabpanel', id: 'dp-' + x.key, 'aria-labelledby': 'dt-' + x.key, tabindex: '0' }, x.body);
      tablist.append(b);
    });
    function selectTab(key) {
      state.detailTab = key;
      panels.forEach(function (x) {
        var on = x.key === key;
        tabBtns[x.key].setAttribute('aria-selected', on ? 'true' : 'false');
        tabBtns[x.key].tabIndex = on ? 0 : -1;
        tabPanels[x.key].hidden = !on;
      });
    }
    var bodyCard = h('section', { class: 'card', style: 'padding-top:0' }, tablist, panels.map(function (x) { return tabPanels[x.key]; }));
    selectTab(state.detailTab);

    // 出力を .md で保存（貼った出力はメモリだけ。保存はユーザーが押したときだけ）
    var mdCard = null;
    if (p.mdName) {
      if (!state.mdDraft.has(p.id)) state.mdDraft.set(p.id, { text: '', name: p.mdName + '_' + today() });
      var draft = state.mdDraft.get(p.id);
      var outId = 'md-out-' + p.id;
      var nameId = 'md-name-' + p.id;
      var outBox = h('textarea', { id: outId, placeholder: 'Gemini の出力を貼る（```markdown の囲みごと貼っても自動で外します）' });
      outBox.value = draft.text;
      outBox.addEventListener('input', function () { draft.text = outBox.value; });
      var nameBox = h('input', { id: nameId, type: 'text' });
      nameBox.value = draft.name;
      nameBox.addEventListener('input', function () { draft.name = nameBox.value; });
      var saveBtn = h('button', { class: 'btn primary', type: 'button' }, '.md で保存');
      saveBtn.addEventListener('click', function () {
        if (!outBox.value.trim()) { toast('先に Gemini の出力を貼ってください', 4000); outBox.focus(); return; }
        var name = mdFileName(nameBox.value);
        downloadText(name, extractMarkdown(outBox.value));
        flashButton(saveBtn, '保存しました ✓');
        toast(name + ' を保存しました（ブラウザのダウンロード先）', 4000);
      });
      mdCard = h('details', { class: 'card md-save' },
        h('summary', { text: 'Gemini の出力を .md で保存' }),
        h('p', { class: 'hint', style: 'margin:0 0 12px' }, 'Gemini の出力のコードブロック右上にあるコピーボタンでコピーし、ここに貼って保存します。貼った内容はこの画面を閉じると消えます。'),
        h('div', { class: 'field' }, h('label', { for: outId, text: 'Gemini の出力' }), outBox),
        h('div', { class: 'field' }, h('label', { for: nameId, text: 'ファイル名' }), nameBox),
        h('div', { class: 'toolbar' }, saveBtn)
      );
      mdCard.open = !!draft.text;
    }

    var nexts = nextSteps(p.id);
    var nextCard = nexts.length ? h('section', { class: 'card' },
      h('h3', { text: '次に使う' }),
      h('div', { class: 'next-list' }, nexts.map(function (n) {
        return h('button', {
          class: 'next', type: 'button',
          onclick: function () { openPrompt(n.next.id, { chain: n.chain, index: n.index }); }
        },
          h('span', { style: 'flex:1' },
            h('span', { class: 'via', text: '連鎖「' + n.chain.name + '」 STEP ' + (n.index + 1) + ' / ' + n.chain.steps.length }),
            h('strong', { text: n.next.title })
          ),
          h('span', { class: 'arrow', 'aria-hidden': 'true', text: '→' })
        );
      }))
    ) : null;

    var star = h('button', {
      class: 'star', type: 'button', 'aria-pressed': state.fav.has(p.id) ? 'true' : 'false',
      onclick: function () {
        if (state.fav.has(p.id)) state.fav.delete(p.id); else state.fav.add(p.id);
        var ok = save(KEYS.fav, Array.from(state.fav));
        star.setAttribute('aria-pressed', state.fav.has(p.id) ? 'true' : 'false');
        starIcon.textContent = state.fav.has(p.id) ? '★' : '☆';
        if (!ok) toast(SAVE_FAILED, 6000);
        renderSide();
      }
    });
    var starIcon = h('span', { 'aria-hidden': 'true', text: state.fav.has(p.id) ? '★' : '☆' });
    star.append(starIcon, ' お気に入り');

    [
      homeCrumb(h('button', { type: 'button', onclick: function () { go('#/c/' + p.category); } }, catLabel.get(p.category))),
      h('div', { class: 'title-row' }, h('h2', { tabindex: '-1', id: 'detail-title', text: p.title }), star),
      h('p', { class: 'lead', style: 'margin-bottom:8px', text: p.summary }),
      h('div', { style: 'margin-bottom:24px' }, promptBadges(p)),
      banner, sendCard, bodyCard, mdCard, nextCard
    ].forEach(function (el) { if (el) box.append(el); });
    update();
  }

  function pushRecent(id) {
    state.recent = [id].concat(state.recent.filter(function (x) { return x !== id; })).slice(0, RECENT_MAX);
    if (!save(KEYS.recent, state.recent)) toast(SAVE_FAILED, 6000);
  }

  // ---- 中央の描画（検索中は検索結果、それ以外は今の画面）----
  function renderMain(opts) {
    opts = opts || {};
    var tab = document.getElementById('tab-prompts');
    var box = document.getElementById('detail');
    clear(box);
    var q = state.query.trim();
    var view = q ? 'results' : state.view;
    var isDetail = view === 'detail';
    tab.classList.toggle('wide', !isDetail);
    box.classList.toggle('wide', !isDetail);
    if (view === 'results') renderResults(box);
    else if (view === 'detail') { renderSide(); renderDetail(box, opts); }
    else if (view === 'category') renderCategory(box);
    else renderHome(box);
    if (opts.resetScroll) resetScroll(document.getElementById('main-scroll'));
    if (opts.focus) {
      var title = document.getElementById('detail-title');
      if (title) title.focus({ preventScroll: true });
    }
  }

  // ---- 使い方タブ（基本の流れと、続けて使う流れ）----
  // which: 'basic' か連鎖の番号
  function renderFlows(which) {
    var box = document.getElementById('flows');
    clear(box);
    var nav = h('div', { class: 'fl-nav', role: 'navigation', 'aria-label': '流れを選ぶ' },
      h('button', { type: 'button', 'aria-current': which === 'basic' ? 'true' : 'false', onclick: function () { go('#/flows'); } }, '基本の使い方'),
      DATA.chains.map(function (c, ci) {
        return h('button', { type: 'button', 'aria-current': which === ci ? 'true' : 'false', onclick: function () { go('#/flows/' + ci); } }, c.name);
      })
    );
    box.append(h('h2', { class: 'page-title', tabindex: '-1', id: 'flows-title', text: '使い方' }), nav);
    // 横スクロールのとき、選んでいるボタンを見える位置へ
    var cur = nav.querySelector('[aria-current="true"]');
    if (cur) setTimeout(function () { nav.scrollLeft = cur.offsetLeft - nav.offsetLeft - 16; }, 0);
    if (which === 'basic') {
      box.append(
        h('p', { class: 'fl-intro', text: 'どのプロンプトも同じ流れで使います。続けて使う流れは、上のボタンから選べます。' }),
        basicStep(), gemStep()
      );
      return;
    }
    var c = DATA.chains[which];
    box.append(
      h('h3', { style: 'font-size:22px;margin:0 0 4px', text: c.name }),
      c.description ? h('p', { class: 'fl-intro', text: c.description }) : null,
      h('div', null, c.steps.map(function (id, i) { return chainStep(c, which, i); }))
    );
  }

  // ---- 自分の情報 ----
  var dialog = document.getElementById('settings');
  var settingInputs = {};
  function openSettings() {
    var box = document.getElementById('settings-fields');
    clear(box);
    DATA.myFields.forEach(function (f) {
      var id = 's-' + f.key;
      var input = f.multiline ? h('textarea', { id: id, placeholder: f.placeholder || '' }) : h('input', { id: id, type: 'text', placeholder: f.placeholder || '' });
      input.value = state.my[f.key] || '';
      settingInputs[f.key] = input;
      box.append(h('div', { class: 'field' }, h('label', { for: id, text: f.label }), input));
    });
    disarmClear();
    dialog.showModal();
  }
  document.getElementById('open-settings').addEventListener('click', openSettings);
  document.getElementById('settings-cancel').addEventListener('click', function () { dialog.close(); });
  document.getElementById('settings-form').addEventListener('submit', function () {
    var m = {};
    DATA.myFields.forEach(function (f) {
      var v = settingInputs[f.key].value.trim();
      if (v) m[f.key] = v;
    });
    state.my = m;
    toast(save(KEYS.my, m) ? '自分の情報を保存しました' : SAVE_FAILED, 4000);
    if (state.view === 'detail') renderMain();
  });
  var clearBtn = document.getElementById('clear-storage');
  var armed = false;
  function disarmClear() {
    armed = false;
    clearBtn.classList.remove('armed');
    clearBtn.textContent = '保存した値をすべて消す';
  }
  clearBtn.addEventListener('click', function () {
    if (!armed) {
      armed = true;
      clearBtn.classList.add('armed');
      clearBtn.textContent = 'もう一度押すと消えます';
      return;
    }
    try { Object.keys(KEYS).forEach(function (k) { localStorage.removeItem(KEYS[k]); }); } catch (e) { /* 保存できない環境では消すものも無い */ }
    state.fav.clear();
    state.recent = [];
    state.my = {};
    state.mdDraft.clear();
    dialog.close();
    toast('お気に入り・最近使ったもの・自分の情報・貼った出力を消しました', 4000);
    renderMain();
  });

  // ---- ルーティング ----
  var pendingFocus = false;
  function go(hash, opts) {
    pendingFocus = !!(opts && opts.focusDetail);
    if (location.hash === hash) route(); else location.hash = hash;
  }
  function showTab(name) {
    ['prompts', 'flows'].forEach(function (t) {
      document.getElementById('tab-' + t).hidden = t !== name;
      var b = document.getElementById('tab-btn-' + t);
      if (t === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  function resetScroll(el) {
    if (el) el.scrollTop = 0;
    document.querySelector('main').scrollTop = 0;
  }
  function route() {
    clearQuery();
    var hash = location.hash || '';
    var focus = pendingFocus;
    pendingFocus = false;
    var m;
    if ((m = hash.match(/^#\/p\/([a-z0-9-]+)$/)) && byId.has(m[1])) {
      showTab('prompts');
      if (state.chainCtx && state.chainCtx.chain.steps[state.chainCtx.index] !== m[1]) state.chainCtx = null;
      if (state.current !== m[1]) state.detailTab = 'prompt';
      state.view = 'detail';
      state.current = m[1];
      renderMain({ focus: focus, resetScroll: true });
    } else if ((m = hash.match(/^#\/c\/([a-z0-9-]+)$/)) && byCat.has(m[1])) {
      showTab('prompts');
      state.view = 'category';
      state.cat = m[1];
      state.chainCtx = null;
      renderMain({ resetScroll: true, focus: focus });
    } else if ((m = hash.match(/^#\/(?:flows|chains|guide)(?:\/(\d+))?$/))) {
      var ci = m[1] != null ? Number(m[1]) : null;
      showTab('flows');
      renderFlows(ci != null && ci < DATA.chains.length ? ci : 'basic');
      resetScroll(document.getElementById('flows-scroll'));
    } else {
      showTab('prompts');
      state.view = 'home';
      state.current = null;
      state.chainCtx = null;
      renderMain({ resetScroll: true });
    }
  }
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-tab');
      clearQuery();
      go(t === 'prompts' ? '#/' : '#/' + t);
    });
  });
  document.getElementById('brand-home').addEventListener('click', function () { clearQuery(); go('#/'); });
  window.addEventListener('hashchange', route);
  document.getElementById('save-html').addEventListener('click', function () {
    downloadText('prompt-kit.html', PAGE_SOURCE, 'text/html');
  });

  var searchBox = document.getElementById('search');
  function clearQuery() {
    if (!state.query) return;
    state.query = '';
    searchBox.value = '';
  }
  searchBox.addEventListener('input', function () {
    state.query = searchBox.value;
    // 表示と URL を合わせる（使い方タブから検索しても、URL はホームにする）
    if (document.getElementById('tab-prompts').hidden) {
      showTab('prompts');
      history.replaceState(null, '', '#/');
      state.view = 'home';
    }
    renderMain({ resetScroll: true });
  });
  searchBox.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && searchBox.value) { e.preventDefault(); clearQuery(); renderMain(); }
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    // Ctrl+Enter（Mac は ⌘+Enter）でコピーする
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !dialog.open && !document.getElementById('tab-prompts').hidden) {
      var btn = document.getElementById('copy-prompt');
      if (btn) { e.preventDefault(); btn.click(); }
      return;
    }
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && !dialog.open) {
      e.preventDefault();
      searchBox.focus();
    }
  });

  route();
})();
</script>
</body>
</html>
