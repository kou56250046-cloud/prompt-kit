3: 他部署で同じ移行をして成果が出ている ／ 商談 +35%\n- 判断してほしいこと: 予算の振り替えの承認（12/5 の役員会まで）\n- リスクと対策: 既存顧客との接点が減る → 東京の展示会は継続する","gem":"","followups":[{"title":"まだ長い","text":"要点を2つに減らし、タイトルと判断してほしいことだけで伝わる版にしてください。"}]},{"id":"speaker-notes-qa","title":"発表者ノートと想定問答","category":"ppt","summary":"スライドごとの話す内容と、聞かれそうな質問への答えを用意する","recommendGem":false,"mdName":"発表者ノートと想定問答","order":8,"vars":[{"key":"deck","label":"資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"audience","label":"聞き手と関心ごと","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 部長（費用対効果）、経理（予算の根拠）"},{"key":"duration","label":"発表時間","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 10分"}],"prompt":"# 役割\nあなたは発表のリハーサルに付き合うコーチです。本番で詰まらないよう、話す内容と想定問答を用意してください。\n\n# 前提\n発表者:\n{{my.profile}}\n\n# 入力\n## 聞き手と関心ごと\n{{audience}}\n\n## 発表時間\n{{duration}}\n\n## 資料\n\"\"\"\n{{deck}}\n\"\"\"\n\n# 手順\n1. スライドごとに、話す内容を書く。発表時間をスライドに配分する\n2. 聞き手の関心ごとから、出そうな質問を洗い出す\n3. 質問ごとに、30秒で言える答えと、根拠になるスライドを示す\n4. 最も厳しい質問を3つ選び、答え方を丁寧に用意する\n\n# 出力形式\n## 発表者ノート\n| No | スライド | 話す内容（話し言葉で） | 時間の目安 |\n|---|---|---|---|\n\n## 想定問答\n| 質問 | 質問者（立場） | 質問の意図 | 答え（30秒） | 根拠のスライド |\n|---|---|---|---|---|\n\n## 厳しい質問トップ3\n質問ごとに: 答え / 追加で聞かれたときの答え / 答えられないときの言い方\n\n# 守ること\n- 資料に無い事実を答えに使わない。資料で答えられない質問は「持ち帰る」答え方にする\n- 話す内容はスライドの文字を読み上げるだけにしない\n\n# 最後に確認\n時間の合計が発表時間に収まるか、厳しい質問に資料で裏付けのある答えがあるかを確かめてから出す。","tips":"資料は PDF で添付すると確実です。発表者ノートはそのまま Google スライドのノート欄に貼れます。","example":"## 想定問答\n| 質問 | 質問者 | 質問の意図 | 答え（30秒） | 根拠のスライド |\n|---|---|---|---|---|\n| Web 広告で本当に商談が増えるのか | 部長 | 効果の確からしさ | 他部署で同じ移行をして商談が 35% 増えました。まず3か月試し、商談数で判断させてください | 4 |","gem":"","followups":[{"title":"答えが長い","text":"すべての答えを、最初の一文で結論を言う形にして、2文以内に縮めてください。"}]},{"id":"html-design-improve","title":"HTML のデザイン改善","category":"html","summary":"機能を壊さずに、配色・余白・文字・階層を整えた完全な HTML を返す","recommendGem":false,"mdName":"","order":1,"vars":[{"key":"html","label":"HTML のコード","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"purpose","label":"画面の目的と使う人","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 社内の営業担当が毎朝見る売上の一覧"},{"key":"taste","label":"デザインの方向性","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 主役は今日の合計金額。視線は合計 → 担当者別の表 → 注記の順。紺と白、飾りのアイコンとグラデーションは使わない"},{"key":"constraints","label":"制約","multiline":true,"optional":true,"attachable":false,"placeholder":"例: 外部の CDN・フォントは使わない。JavaScript は変えない"}],"prompt":"# 役割\nあなたは業務システムの UI に強いシニアデザイナー兼フロントエンドエンジニアです。見た目を整えるだけでなく、使う人が迷わない画面にしてください。\n\n# 入力\n## 画面の目的と使う人\n{{purpose}}\n\n## デザインの方向性\n{{taste}}\n\n## 制約\n{{constraints}}\n\n## HTML のコード\n\"\"\"\n{{html}}\n\"\"\"\n\n# 手順\n1. 現状を診断する。観点: 情報の優先順位（最初に目に入るもの）、余白とそろえ、配色とコントラスト、文字の大きさと行間、ボタンやリンクの見分けやすさ、状態の表示（読み込み中・空・エラー）、スマホでの表示\n2. 改善の方針を3行で決める。方向性が「おしゃれ」「高級感」のような形容詞だけなら、主役（最初に見せるもの）・配置・視線の順番・使わない要素に分けて解釈し、その解釈を方針に書く\n3. 色・余白・文字サイズを CSS 変数（:root）にまとめ、全体に当てる\n4. 改善後の HTML を、省略せずに1つのファイルとして出す\n\n# 出力形式\n## 1. 診断\n| 優先度 | 観点 | 問題 | 直し方 |\n|---|---|---|---|\n\n## 2. 改善の方針（3行）\n\n## 3. 改善後の HTML\n```html\n（ファイル全体。省略しない）\n```\n\n## 4. 変更点\n- 何を、なぜ変えたか（箇条書き）\n\n# 守ること\n- 既存の文言・機能・フォーム・JavaScript から参照されている id と class を消さない、名前を変えない\n- 制約に「外部を使わない」とあれば、CDN・Web フォント・外部画像を使わない\n- 文字と背景のコントラストは 4.5:1 以上にする\n- コードを「…（省略）」で省かない。長くて出し切れないときは、区切りのよい所で止めて「続きは『続き』と送ってください」と書く\n\n# 最後に確認\n改善後の HTML で、元の id・class・文言が残っているか、閉じタグの漏れがないかを確かめてから出す。","tips":"Gemini の Canvas で開くと、改善後の画面をその場でプレビューできます。\n方向性は「誰が・どんな気分で使うか」を書くと決まりやすいです（例: 疲れた夕方でも読める）。\n「かっこよく」より「主役は何か・視線をどの順で動かすか・何を使わないか」を書く方が、狙いどおりになります。\nまず診断だけ出させて、方針に納得してからコードを出させる進め方もおすすめです。","example":"## 1. 診断\n| 優先度 | 観点 | 問題 | 直し方 |\n|---|---|---|---|\n| 高 | 情報の優先順位 | 合計金額が表の下にあり見落とす | 合計を画面上部のカードに出す |\n| 高 | コントラスト | 灰色の文字 #aaa が白地で 2.3:1 | #5b6169 に変えて 6.4:1 にする |\n| 中 | 余白 | 表の行の高さが詰まっている | 行の上下に 10px の余白 |\n\n## 2. 改善の方針\n- いちばん見たい数字を上に、詳細は下に\n- 色は紺1色と灰色だけ。強調は紺の濃淡で\n- 余白は 8px の倍数でそろえる","gem":"","followups":[{"title":"機能が壊れた","text":"元の HTML と比べて、消えた・名前が変わった id と class、変わった JavaScript をすべて挙げ、元に戻した版を出してください。"},{"title":"地味すぎる","text":"業務向けの落ち着きは保ったまま、見出しと数字にメリハリを付けた版を出してください。変更は CSS だけにしてください。"},{"title":"コードが途中で切れた","text":"続きを、切れた行の直前から出してください。"}]},{"id":"text-to-diagram-html","title":"文字資料 → 図解 HTML","category":"html","summary":"文字ばかりの資料を、フロー図・比較表・タイムラインなどの HTML 1枚にする（Canvas 向け）","recommendGem":false,"mdName":"","order":2,"vars":[{"key":"doc","label":"資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"diagram","label":"図の種類","multiline":false,"optional":true,"attachable":false,"placeholder":"例: フロー図 / 比較表 / タイムライン / 関係図 / おまかせ"},{"key":"audience","label":"見る人","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは情報デザイナーです。文字ばかりの資料を、ひと目で全体が分かる図解の HTML にしてください。\n\n# 入力\n## 図の種類\n{{diagram}}（指定なしなら、内容に最も合うものを選ぶ）\n\n## 見る人\n{{audience}}\n\n## 資料\n\"\"\"\n{{doc}}\n\"\"\"\n\n# 手順\n1. 資料の構造を見極める: 手順（順番がある）→ フロー図、選択肢の比較 → 比較表、時間の流れ → タイムライン、要素どうしのつながり → 関係図、場合分け → 分岐図\n2. 図に載せる要素を選ぶ。1つの図に載せる箱は 12 個までにする\n3. HTML 1ファイルで描く。図は HTML と CSS（必要なら SVG）で組む\n4. 図の下に、図だけでは伝わらない補足を短く添える\n\n# 出力形式\n## 選んだ図とその理由（2行）\n\n## HTML\n```html\n（ファイル全体）\n```\n\n# 守ること\n- 外部のライブラリ・CDN・Web フォント・画像を使わない\n- スマホの幅（375px）でも読めるようにする。横に長い図は縦に並び替える\n- 色だけで区別しない（形やラベルも変える）\n- 資料に無い情報を足さない\n\n# 最後に確認\n資料の要素が図から抜けていないか、HTML が1ファイルで完結しているかを確かめてから出す。","tips":"Gemini の Canvas を使うと、出来上がりをその場で見て、続けて「ここを直して」と頼めます。\n図の種類を迷ったら空欄で構いません。理由付きで選んでくれます。","example":"## 選んだ図とその理由\n申請から承認までの順番がある手続きなので、フロー図にしました。差し戻しの分岐があるため、分岐を矢印で示しています。\n\n## HTML\n```html\n\u003c!doctype html>\n\u003chtml lang=\"ja\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>経費申請の流れ\u003c/title>\n\u003cstyle>/* 箱と矢印のスタイル */\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003col class=\"flow\">\n    \u003cli class=\"step\">申請者が入力\u003c/li>\n    \u003cli class=\"step\">上長が確認\u003c/li>\n    …\n  \u003c/ol>\n\u003c/body>\n\u003c/html>\n```","gem":"","followups":[{"title":"図が複雑すぎる","text":"箱の数を半分にしてください。細かい内容は図の下の補足に移してください。"},{"title":"印刷したい","text":"A4 横1枚に収まるよう、印刷用の CSS（@media print）を追加してください。"}]},{"id":"interactive-slides","title":"素材 → 動かせる HTML スライド","category":"html","summary":"前提をスライダーで動かすと試算と結論の数字が変わり、数字の出典をその場で見せられるスライドを HTML 1枚で作る（Canvas 向け）","recommendGem":false,"mdName":"","order":3,"vars":[{"key":"material","label":"素材（メモ・数値・骨子・既存の資料）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"goal","label":"発表の目的（誰に何をしてほしいか）","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 部長に問い合わせ AI の試験導入を承認してもらう"},{"key":"audience","label":"聞き手","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 部長と課長3名。費用対効果に厳しい"},{"key":"duration","label":"発表時間・枚数","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 10分 / 10枚程度"},{"key":"assumptions","label":"会議で動かしたい前提","multiline":true,"optional":true,"attachable":false,"placeholder":"例: 月の問い合わせ件数 / 1件の対応時間 / AI で解決できる割合 / 時給"},{"key":"design","label":"デザインの指定","multiline":true,"optional":true,"attachable":false,"placeholder":"例: 主役は各ページの結論の数字。視線はタイトル → 数字 → グラフの順。写真と飾りのアイコンは使わない"}],"prompt":"# 役割\nあなたは試算に強いプレゼン設計者兼フロントエンドエンジニアです。会議の場で「この前提が違ったら？」「その数字はどこから？」と聞かれても、その場で答えられるスライドを、HTML 1ファイルで作ってください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 発表の目的\n{{goal}}\n\n## 聞き手\n{{audience}}\n\n## 発表時間・枚数\n{{duration}}（指定なしなら 8〜12 枚）\n\n## 会議で動かしたい前提\n{{assumptions}}（指定なしなら、素材の数字のうち結論を左右するものを3〜4個選ぶ）\n\n## デザインの指定\n{{design}}（指定なしなら、白地に1色のアクセント。1枚に主張1つ、主役の要素1つ）\n\n## 素材\n\"\"\"\n{{material}}\n\"\"\"\n\n# 手順\n1. 目的と聞き手から、資料全体の結論を一文で決める。各ページのタイトルは結論の文にする\n2. 素材の数字を「自社のデータ」と「外部の調査データ」に分ける。外部の数字には出典を付ける。出典が素材に無い数字は使わず「不明」と書く\n3. 動かす前提を決め、前提から結果を出す計算式を1か所（JavaScript の関数）にまとめる\n4. ページを組む: 表紙 → 結論 → 現状 → 試算 → 根拠 → 提案 → 次の行動 → 出典一覧\n5. HTML を書き、最後に、前提を動かしたときに試算と結論の数字が両方変わるかを確かめる\n\n# 入れる機能\n- ページ送り: 矢印キーとボタン。今のページ番号と総数を表示\n- 前提のスライダー: 試算のページのグラフを押すと、前提のスライダーと数値の入力欄が開く。値を変えると、グラフ・ラベル・合計がその場で変わる\n- 結論との連動: 結論ページの数字も同じ計算式から出す。試算と結論が食い違わない\n- 計算の内訳: スライダーの横に、どの数字からどう計算したかの表を出す。「当初に戻す」ボタンを付ける\n- 出典カード: 外部の数字を押すと開く。資料名・発行元・公表日・該当箇所・原文の引用・確度（高・中・低）とその理由\n- データの区別: 自社のデータと外部の調査データを、色と「自社」「調査」のラベルの両方で分ける\n- ページ間のリンク: 目次の項目と、結論ページの各要素から、根拠のページへ移れる\n- 台本: 各ページに発表で話す文。N キーで表示・非表示を切り替える。発表時間に合わせた長さにする\n\n# 出力形式\n## 1. 一文で言うと\n\n## 2. ページ構成\n| No | タイトル（結論の文） | 載せる要素 | 動かせる前提 | 出典 |\n|---|---|---|---|---|\n\n## 3. 計算式\n前提と、結果を出す式（文章と式で）。\n\n## 4. HTML\n```html\n（ファイル全体。省略しない）\n```\n\n## 5. 素材に足りないもの\n試算や根拠を強くするために欲しいデータ。\n\n# 守ること\n- 外部のライブラリ・CDN・Web フォント・画像を使わない。グラフは SVG か HTML と CSS で描く。通信しない\n- 素材に無い数字・事例・出典を作らない。分からないものは「不明」と書く\n- 確度を水増ししない。根拠の書かれていない目安や、出典が一次資料でない数字は「低」にし、理由を書く\n- 色だけで区別しない（ラベルや形も変える）\n- 画面の文字は textContent で入れる\n- コードを「…（省略）」で省かない。出し切れないときは区切りのよい所で止めて「続きは『続き』と送ってください」と書く\n\n# 最後に確認\nすべての前提について、動かすと試算と結論の両方の数字が変わるか、外部の数字すべてに出典カードがあるか、HTML が1ファイルで完結しているかを確かめてから出す。","tips":"Gemini の Canvas を使うと、出来上がりをその場で動かして確かめ、「ここを直して」と続けて頼めます。\n先に「素材 → スライド骨子」で骨子を作ってから、その骨子と数字を素材に貼ると、構成が安定します。\n外部の数字を調べてほしいときは、先に Deep Research で調べ、出典つきの結果を素材に貼ってください。このプロンプトは素材に無い出典を作りません。\n1回で全ページが出し切れないときは、ページ構成と計算式を確かめてから「HTML を出して」と頼むと崩れにくくなります。","example":"## 3. 計算式\n- 前提: 月の問い合わせ件数 N（初期値 600）、1件の対応時間 t 分（12）、AI で解決できる割合 r（50%）、時給 w 円（2,500）\n- 年間の削減額 = N × 12 × r × t ÷ 60 × w = 600 × 12 × 0.5 × 12 ÷ 60 × 2,500 = 180 万円\n\n## 4. HTML\n```html\n\u003c!doctype html>\n\u003chtml lang=\"ja\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>問い合わせ AI の効果試算\u003c/title>\n\u003cstyle>/* ページ・グラフ・スライダー・出典カード */\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003csection class=\"slide\" id=\"p3\">…結論…\u003c/section>\n  \u003csection class=\"slide\" id=\"p6\">…試算のグラフとスライダー…\u003c/section>\n  \u003cscript>\n    const base = { n: 600, t: 12, r: 0.5, w: 2500 };\n    function calc(p) { return p.n * 12 * p.r * p.t / 60 * p.w; }\n    …\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n```","gem":"","followups":[{"title":"結論の数字が動かない","text":"結論ページの数字が、試算と同じ calc 関数から計算されているか確かめ、連動していない数字をすべて連動させてください。"},{"title":"ページが多すぎて途中で切れる","text":"まずページ構成を半分にし、試算と結論のページを優先して HTML を出してください。残りのページは次の回答で足してください。"},{"title":"出典の確度を見直したい","text":"出典カードの確度をすべて見直し、一次資料でないもの・根拠の書かれていないものを「低」にして、理由を書き直してください。"}]},{"id":"ui-score-review","title":"画面の採点レビュー","category":"html","summary":"観点別に10点満点で採点し、効果と手間つきの改善案を優先度順に出す","recommendGem":false,"mdName":"","order":3,"vars":[{"key":"target","label":"画面のスクリーンショットまたは HTML","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"purpose","label":"画面の目的","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 問い合わせフォーム。入力完了率を上げたい"},{"key":"users","label":"使う人","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは UI/UX の厳しい審査員です。点数を甘くせず、根拠のある採点と具体的な改善案を出してください。\n\n# 入力\n## 画面の目的\n{{purpose}}\n\n## 使う人\n{{users}}\n\n## 画面\n\"\"\"\n{{target}}\n\"\"\"\n\n# 手順\n1. 画面の目的が、最初の3秒で伝わるかを確かめる\n2. 次の7観点で採点する（各10点）。目的の伝わりやすさ / 情報の優先順位 / 操作の分かりやすさ / 見た目の一貫性 / 読みやすさ / アクセシビリティ / スマホでの使いやすさ\n3. 点数の理由を、画面のどこを見てそう判断したかと一緒に書く\n4. 改善案それぞれに重さを付ける。停止（目的を果たせない・誤操作や誤読を招く。直すまで公開しない）/ 修正必須（使えるが、多くの人がつまずく）/ 要観察（人によっては困る。使われ方を見て判断する）/ 許容（気になるが直さなくてよい）\n5. 改善案を、重さが大きい順、同じ重さの中では効果が大きく手間が小さい順に並べる\n\n# 出力形式\n## 採点\n| 観点 | 点数 | 理由 | 根拠の箇所 |\n|---|---|---|---|\n\n**合計: ◯ / 70**\n\n## 改善案\n| 優先 | 重さ（停止・修正必須・要観察・許容） | 問題 | 改善案（具体的に） | 効果 | 手間（小・中・大） |\n|---|---|---|---|---|---|\n\n## 今日すぐ直せること（3つ）\n\n# 守ること\n- 7点以上は「直すところがほとんど無い」場合だけにする\n- 改善案は「余白を広げる」ではなく「カード間の余白を 8px から 16px にする」のように具体的にする\n- スクリーンショットで判断できない観点（キーボード操作など）は「画像からは判断できない」と書き、点数を付けない\n\n# 最後に確認\nすべての点数に根拠の箇所があるか、改善案が優先度順になっているかを確かめてから出す。","tips":"同じ画面を直す前と後で採点すると、改善の効果を数字で示せます。\n目的に「何を増やしたいか」（入力完了率など）を書くと、改善案がそれに向きます。","example":"## 採点\n| 観点 | 点数 | 理由 | 根拠の箇所 |\n|---|---|---|---|\n| 目的の伝わりやすさ | 5 | 見出しが「お問い合わせ」だけで、何が得られるか分からない | 画面上部 |\n| 操作の分かりやすさ | 4 | 必須の欄が分からず、送信後にエラーが出る | 入力欄のラベル |\n\n**合計: 33 / 70**\n\n## 改善案\n| 優先 | 重さ | 問題 | 改善案 | 効果 | 手間 |\n|---|---|---|---|---|---|\n| 1 | 修正必須 | 必須が分からない | ラベルの横に「必須」を付け、任意の欄は「任意」と書く | 大 | 小 |","gem":"","followups":[{"title":"点数が甘い","text":"同業の優れた画面と比べるつもりで、厳しく採点し直してください。点数を下げた理由も書いてください。"}]},{"id":"a11y-check","title":"アクセシビリティ点検","category":"html","summary":"コントラスト・キーボード操作・見出し・ラベルなどを WCAG の基準で点検し、修正コードを出す","recommendGem":false,"mdName":"","order":4,"vars":[{"key":"html","label":"HTML のコード","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"users","label":"想定する利用者","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 高齢の社員も使う、キーボードだけで操作する人がいる"}],"prompt":"# 役割\nあなたはアクセシビリティの専門家です。WCAG 2.2 の AA を基準に、この HTML を点検してください。\n\n# 入力\n## 想定する利用者\n{{users}}\n\n## HTML のコード\n\"\"\"\n{{html}}\n\"\"\"\n\n# 手順\n次の項目を順に点検する。\n1. 文字と背景のコントラスト（本文 4.5:1、大きい文字 3:1）\n2. キーボードだけで全操作ができるか、フォーカスが見えるか、順番が自然か\n3. 見出しの構造（h1 から順に、飛ばしていないか）\n4. フォームの入力欄にラベルがあるか、エラーの伝え方\n5. 画像の代替テキスト\n6. 色だけで情報を伝えていないか\n7. ボタンとリンクの使い分け、操作できる部品の名前\n8. html の lang、ページのタイトル\n9. 動き・自動再生の抑制（prefers-reduced-motion）\n10. タップできる領域の大きさ（24px 以上）\n\n# 出力形式\n## 点検結果\n| No | 項目 | WCAG の基準番号 | 箇所（要素・行） | 問題 | 修正のコード | 重要度（高・中・低） |\n|---|---|---|---|---|---|---|\n\n## 問題が無かった項目\n\n## 修正後の HTML\n```html\n（ファイル全体。省略しない）\n```\n\n# 守ること\n- コントラストは色の値から計算した比率を書く\n- 見た目と機能は変えない。アクセシビリティに必要な変更だけをする\n- 判断できない項目（実際の操作が要るもの）は「コードからは判断できない」と書く\n\n# 最後に確認\n重要度「高」の問題がすべて修正後の HTML に反映されているかを確かめてから出す。","tips":"修正後のコードを受け取ったら、実際に Tab キーだけで画面を操作して確かめてください。","example":"## 点検結果\n| No | 項目 | WCAG | 箇所 | 問題 | 修正のコード | 重要度 |\n|---|---|---|---|---|---|---|\n| 1 | コントラスト | 1.4.3 | .note の文字 | #999 / #fff = 2.8:1 | `color: #595959;`（7.0:1） | 高 |\n| 2 | ラベル | 1.3.1 / 3.3.2 | メールの入力欄 | placeholder だけでラベルが無い | `\u003clabel for=\"mail\">メールアドレス\u003c/label>` | 高 |","gem":"","followups":[{"title":"修正が多すぎる","text":"重要度「高」だけを直した版を出してください。"}]},{"id":"mobile-check","title":"スマホ表示の点検","category":"html","summary":"スマホのスクリーンショットから、崩れている箇所と直す CSS を出す","recommendGem":false,"mdName":"","order":5,"vars":[{"key":"screenshot","label":"スマホのスクリーンショット","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"html","label":"HTML・CSS のコード","multiline":true,"optional":true,"attachable":false,"placeholder":""},{"key":"device","label":"端末・画面幅","multiline":false,"optional":true,"attachable":false,"placeholder":"例: iPhone 15 / 393px"}],"prompt":"# 役割\nあなたはスマホ表示に詳しいフロントエンドエンジニアです。スクリーンショットから、崩れや使いにくさを見つけて直し方を示してください。\n\n# 入力\n## 端末・画面幅\n{{device}}\n\n## スクリーンショット\n{{screenshot}}\n\n## HTML・CSS のコード\n\"\"\"\n{{html}}\n\"\"\"\n\n# 手順\n1. スクリーンショットを上から見て、崩れ・はみ出し・重なり・横スクロール・小さすぎる文字やボタンを探す\n2. 指で押しにくい部品（押せる領域が 44px 未満、隣と近すぎる）を探す\n3. 画面を占めすぎている固定ヘッダーや、最初の画面に大事な情報が無いことも指摘する\n4. コードがあれば原因の箇所を特定し、直す CSS を書く。コードが無ければ原因は推定と明記する\n\n# 出力形式\n## 問題一覧\n| No | 箇所 | 症状 | 原因（推定なら「推定」） | 直す CSS | 重要度 |\n|---|---|---|---|---|---|\n\n## まとめて当てる CSS\n```css\n@media (max-width: 600px) {\n  …\n}\n```\n\n# 守ること\n- 本文の文字は 16px 以上、押せる領域は 44px 四方以上を基準にする\n- パソコン表示を崩さないよう、変更は @media の中に入れる\n- 画像から分からないことは推測で決めつけない\n\n# 最後に確認\n直す CSS がすべての問題に対応しているかを確かめてから出す。","tips":"複数の画面を見るときは、スクリーンショットを何枚か添付して「画面ごとに」と書き足してください。\nコードも一緒に貼ると、原因の特定が正確になります。","example":"## 問題一覧\n| No | 箇所 | 症状 | 原因 | 直す CSS | 重要度 |\n|---|---|---|---|---|---|\n| 1 | 料金の表 | 右端が切れて横スクロールになる | 表の幅が固定（推定） | `.table-wrap { overflow-x: auto; }` | 高 |\n| 2 | 送信ボタン | 高さが 32px で押しにくい | padding が小さい | `button { min-height: 44px; }` | 中 |","gem":"","followups":[{"title":"表がどうしても入らない","text":"横に長い表を、スマホでは1行ずつカードに並べ替える CSS を書いてください。"}]},{"id":"mail-write","title":"メール作成・返信","category":"writing","summary":"用件と相手から、そのまま送れるメールを作る。返信にも使える","recommendGem":true,"mdName":"","order":1,"vars":[{"key":"situation","label":"用件・伝えたいこと","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"recipient","label":"相手と関係","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 取引先の課長。2回目のやりとり"},{"key":"received","label":"返信する元のメール","multiline":true,"optional":true,"attachable":false,"placeholder":""},{"key":"must","label":"必ず入れること","multiline":true,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたはビジネスメールの書き方に長けた秘書です。相手が一度読めば分かり、すぐ返事ができるメールを書いてください。\n\n# 前提\n書き手:\n{{my.profile}}\n文体: {{my.tone}}\n\n# 入力\n## 相手と関係\n{{recipient}}\n\n## 用件・伝えたいこと\n\"\"\"\n{{situation}}\n\"\"\"\n\n## 返信する元のメール\n\"\"\"\n{{received}}\n\"\"\"\n\n## 必ず入れること\n{{must}}\n\n# 手順\n1. 返信の場合は、元のメールで聞かれていることをすべて拾う\n2. 相手との関係から、敬語の度合いと長さを決める\n3. 結論（お願い・回答）を最初に書き、理由と詳細を後に書く\n4. 相手にしてほしいことがあれば、期限と一緒にはっきり書く\n\n# 出力形式\n## メール\n件名:\n本文:\n\n## 短い版\n同じ内容を半分の長さにしたもの。\n\n## 確認してほしい点\n- 事実が入力から分からず、仮に書いた箇所\n\n# 守ること\n- 入力に無い日付・金額・約束を書かない。必要なら【要確認: 〜】と書く\n- 返信では、元のメールで聞かれたことに漏れなく答える\n- 過剰な前置き・へりくだりを入れない\n\n# 最後に確認\n相手にしてほしいことと期限が明確か、元のメールの質問に全部答えているかを確かめてから出す。","tips":"用件は箇条書きのメモで構いません。言いにくいこと（断り・催促）も、そのまま書けば角の立たない言い方にしてくれます。","example":"","gem":"","followups":[{"title":"硬すぎる","text":"社内のやりとりとして、もう少しくだけた言い方にしてください。"},{"title":"断りをやわらげたい","text":"断る結論は変えずに、代わりの案を1つ添えた言い方にしてください。"}]},{"id":"boss-report","title":"上司への報告","category":"writing","summary":"結論 → 根拠 → 依頼の順で、チャット版とメール版を作る","recommendGem":false,"mdName":"","order":2,"vars":[{"key":"facts","label":"報告する内容・事実","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"ask","label":"上司にしてほしいこと","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 承認 / 判断 / 共有のみ"},{"key":"boss","label":"上司の関心ごと","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 期限に間に合うか、費用が増えないか"}],"prompt":"# 役割\nあなたは報告の上手な中堅社員です。忙しい上司が10秒で状況をつかみ、すぐ判断できる報告を書いてください。\n\n# 前提\n書き手:\n{{my.profile}}\n文体: {{my.tone}}\n\n# 入力\n## 報告する内容・事実\n\"\"\"\n{{facts}}\n\"\"\"\n\n## 上司にしてほしいこと\n{{ask}}\n\n## 上司の関心ごと\n{{boss}}\n\n# 手順\n1. 結論を1〜2行にする（何が起きたか／どうなったか／何をしてほしいか）\n2. 結論を支える根拠を3つまで選ぶ。上司の関心ごとに答えるものを優先する\n3. してほしいことを期限つきで書く。選択肢があれば、推す案と理由を添える\n4. 悪い知らせは隠さず、対策と一緒に先に書く\n\n# 出力形式\n## チャット版（150字以内）\n\n## メール版\n件名: 【報告】…（【要判断】【共有】など、してほしいことを件名に入れる）\n本文:\n1. 結論\n2. 根拠（3つまで）\n3. お願いしたいこと（期限）\n4. 補足（リスク・選択肢）\n\n# 守ること\n- 事実と自分の意見を分ける（意見には「私の考えでは」と付ける）\n- 入力に無い数字や見通しを書かない\n- 言い訳を書かない\n\n# 最後に確認\n最初の2行だけで状況とお願いが伝わるかを確かめてから出す。","tips":"進捗の報告、トラブルの第一報、判断のお願いに使えます。メモの箇条書きを貼るだけで十分です。","example":"","gem":"","followups":[{"title":"トラブルの報告にしたい","text":"起きたこと・影響・いまの対応・再発防止・お願い、の順に書き直してください。"}]},{"id":"proofread","title":"文章の校正","category":"writing","summary":"誤字・表記ゆれ・敬語・冗長さを直し、修正の一覧を付ける","recommendGem":true,"mdName":"校正","order":3,"vars":[{"key":"text","label":"文章","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"kind","label":"文書の種類","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 社外向けの案内文 / 社内報告書"},{"key":"rules","label":"表記のルール","multiline":true,"optional":true,"attachable":false,"placeholder":"例: 「お客様」に統一。数字は半角"}],"prompt":"# 役割\nあなたは経験豊富な校正者です。書き手の意図と文体を保ったまま、誤りと読みにくさを直してください。\n\n# 入力\n## 文書の種類\n{{kind}}\n\n## 表記のルール\n{{rules}}\n\n## 文章\n\"\"\"\n{{text}}\n\"\"\"\n\n# 手順\n1. 誤字脱字・変換ミスを直す\n2. 表記ゆれを統一する（ルールがあればそれに従い、無ければ多い方に合わせる）\n3. 敬語の誤り（二重敬語・尊敬と謙譲の取り違え）を直す\n4. 一文が長すぎるもの（目安 60 字超）を分ける。重複した言い回しを削る\n5. 意味が変わる可能性のある修正は、本文には入れず提案に回す\n\n# 出力形式\n## 修正後の全文\n\n## 修正一覧\n| No | 原文 | 修正 | 理由（誤字・表記ゆれ・敬語・長文・重複） |\n|---|---|---|---|\n\n## 提案（意味が変わる可能性があるもの）\n| 箇所 | 原文 | 提案 | 理由 |\n|---|---|---|---|\n\n# 守ること\n- 内容（事実・数字・主張）を変えない\n- 書き手の文体（です・ます／である）を変えない\n\n# 最後に確認\n修正後の全文で、数字や固有名詞が原文から変わっていないかを確かめてから出す。","tips":"社内の表記ルールを「表記のルール」に一度書いておき、Gem に登録すると毎回そろいます。","example":"","gem":"","followups":[{"title":"直しすぎ","text":"誤字・敬語の誤りだけを直し、言い回しは元のままにした版を出してください。"}]},{"id":"weekly-report","title":"週報・日報","category":"writing","summary":"箇条書きのメモから、決まった形式の報告を作る","recommendGem":true,"mdName":"週報","order":4,"vars":[{"key":"notes","label":"今週（今日）のメモ","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"period","label":"期間","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 11/10〜11/14"},{"key":"format","label":"社内の書式","multiline":true,"optional":true,"attachable":false,"placeholder":"決まった見出しがあれば貼る"}],"prompt":"# 役割\nあなたは要点をまとめるのが得意な同僚です。走り書きのメモを、上司が読みやすい報告に整えてください。\n\n# 前提\n書き手:\n{{my.profile}}\n文体: {{my.tone}}\n\n# 入力\n## 期間\n{{period}}\n\n## 社内の書式\n{{format}}\n\n## メモ\n\"\"\"\n{{notes}}\n\"\"\"\n\n# 手順\n1. メモを「やったこと」「成果・数字」「来週の予定」「課題・相談」「共有」に振り分ける\n2. やったことは成果が伝わる書き方にする（「〜した」ではなく「〜して、〜になった」）\n3. 社内の書式があれば、その見出しと順番に合わせる\n\n# 出力形式\n（社内の書式が無い場合）\n## {期間} 報告\n### 今週の成果\n### 数字\n### 来週の予定\n### 課題・相談\n### 共有事項\n\n# 守ること\n- メモに無い成果や数字を作らない\n- 1項目1行を基本にする\n- 相談事項は、誰に何を決めてほしいかまで書く\n\n# 最後に確認\nメモの内容がどこかの見出しに入っているか（漏れがないか）を確かめてから出す。","tips":"毎日のメモをためておき、金曜にまとめて貼る使い方が楽です。\n社内の書式を Gem に登録すると、毎回メモを貼るだけで済みます。","example":"","gem":"","followups":[{"title":"成果が地味に見える","text":"事実は変えずに、成果が伝わる書き方に直してください。数字がある項目は数字を先に書いてください。"}]},{"id":"devil-advocate","title":"反論役の壁打ち","category":"thinking","summary":"案の弱点をあえて突かせ、反論への答えと補強策を出す","recommendGem":false,"mdName":"反論と弱点","order":1,"vars":[{"key":"idea","label":"考え・案","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"context","label":"背景・誰に通したいか","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは手ごわい反対派です。この案を通す前に潰しておくべき弱点を、遠慮なく指摘してください。褒める必要はありません。\n\n# 入力\n## 背景・誰に通したいか\n{{context}}\n\n## 考え・案\n\"\"\"\n{{idea}}\n\"\"\"\n\n# 手順\n1. この案が成り立つための前提を洗い出し、疑わしいものを挙げる\n2. 反論を強い順に挙げる（論理の穴・根拠の弱さ・費用・リスク・代わりの案）\n3. 反論ごとに、どう答えればよいか、何の根拠があれば答えられるかを書く\n4. 案そのものを強くする直し方を出す\n\n# 出力形式\n## いちばんの弱点（1行）\n\n## 疑わしい前提\n| 前提 | なぜ疑わしいか | 確かめ方 |\n|---|---|---|\n\n## 反論\n| 強さ（強・中・弱） | 反論 | 答え方 | 必要な根拠 |\n|---|---|---|---|\n\n## 案を強くする直し方（3つ）\n\n# 守ること\n- 一般論ではなく、この案の中身に即して反論する\n- 反論のための反論（どんな案にも言えること）は書かない\n\n# 最後に確認\n反論のうち「強」のものに、答え方と必要な根拠がそろっているかを確かめてから出す。","tips":"企画を上司に出す前、提案を顧客に出す前に。同じ会話で「答え方」を自分で書いて、さらに突っ込ませると鍛えられます。","example":"","gem":"","followups":[{"title":"もっと厳しく","text":"決裁者になりきって、この案を却下する理由を3つ、却下のメールの文面で書いてください。"}]},{"id":"options-compare","title":"選択肢の比較と推奨","category":"thinking","summary":"重み付きの評価軸で選択肢を比べ、推奨と「推奨が変わる条件」を出す","recommendGem":false,"mdName":"選択肢の比較","order":2,"vars":[{"key":"decision","label":"決めたいこと","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 会計ソフトをどれにするか"},{"key":"options","label":"選択肢","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"criteria","label":"重視すること","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 費用、使いやすさ、サポート"},{"key":"constraints","label":"制約","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 予算は年 50 万円まで、3月から使いたい"}],"prompt":"# 役割\nあなたは公平な意思決定の支援者です。好みではなく、根拠と重みで選択肢を比べてください。\n\n# 入力\n## 決めたいこと\n{{decision}}\n\n## 選択肢\n\"\"\"\n{{options}}\n\"\"\"\n\n## 重視すること\n{{criteria}}\n\n## 制約\n{{constraints}}\n\n# 手順\n1. 評価軸を決め、重みを付ける（合計 100）。重視することがあればそれを重くする\n2. 制約を満たさない選択肢は、その時点で外し理由を書く\n3. 各選択肢を軸ごとに5段階で評価し、理由を書く\n4. 重み付きの合計で順位を出し、推奨を決める\n5. 推奨が入れ替わる条件（どの前提が変わったらか）を書く\n\n# 出力形式\n## 評価軸と重み\n| 軸 | 重み | なぜこの重みか |\n|---|---|---|\n\n## 比較\n| 選択肢 | 軸1 | 軸2 | … | 重み付き合計 |\n|---|---|---|---|---|\n（セルは「4: 理由」の形）\n\n## 推奨\n- 推奨: \n- 理由（3行）:\n- 推奨が変わる条件:\n\n## 決める前に確かめること\n\n# 守ること\n- 入力に無い情報（価格・機能）を推測で評価しない。分からないものは「不明」とし、評価から外したことを明記する\n- 推奨は1つに絞る\n\n# 最後に確認\n重みの合計が 100 か、「不明」が多い選択肢を高く評価していないかを確かめてから出す。","tips":"選択肢はカタログやWebページの内容を貼ると評価が具体的になります。\n上司への説明には、出てきた比較表と「推奨が変わる条件」がそのまま使えます。","example":"","gem":"","followups":[{"title":"重みを変えたら？","text":"費用を最も重視した場合と、使いやすさを最も重視した場合で、順位がどう変わるかを示してください。"}]},{"id":"proposal-outline","title":"企画書の骨子","category":"thinking","summary":"アイデアのメモから、企画書の項目を埋めた骨子と「要確認」を出す","recommendGem":false,"mdName":"企画書の骨子","order":3,"vars":[{"key":"idea","label":"アイデア・メモ","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"reader","label":"提出先","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 部長会 / 社長 / 取引先"},{"key":"constraints","label":"予算・期間などの条件","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは社内で企画を何本も通してきた企画担当です。メモから、決裁者が判断できる企画書の骨子を作ってください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 提出先\n{{reader}}\n\n## 予算・期間などの条件\n{{constraints}}\n\n## アイデア・メモ\n\"\"\"\n{{idea}}\n\"\"\"\n\n# 手順\n1. 企画の一文の要約を作る（誰の・何の課題を・どう解決し・何が良くなるか）\n2. 企画書の各項目をメモから埋める\n3. メモから埋まらない項目は「要確認」とし、何を調べれば埋まるかを書く\n4. 決裁者が気にする点（費用・効果・リスク）を厚めにする\n\n# 出力形式\n## 一文で言うと\n\n## 企画書の骨子\n| 項目 | 内容 | 根拠（メモのどこか）／要確認なら調べること |\n|---|---|---|\n| 背景 | | |\n| 課題 | | |\n| 目的・目標（数値） | | |\n| 提案内容 | | |\n| 期待する効果（数値） | | |\n| 実施計画（いつ・何を） | | |\n| 体制 | | |\n| 費用 | | |\n| リスクと対策 | | |\n| 判断してほしいこと | | |\n\n## 最初に埋めるべき「要確認」（3つ）\n\n# 守ること\n- メモに無い数字を作らない。目標や効果の数字が無ければ「要確認」とし、仮の置き方の例を添える\n- 提出先に合わせて言葉を選ぶ（社外なら社内用語を使わない）\n\n# 最後に確認\nすべての項目が埋まっているか「要確認」になっているかを確かめてから出す。","tips":"骨子ができたら「反論役の壁打ち」で弱点を洗い、「素材 → スライド骨子」でスライドにできます。","example":"","gem":"","followups":[{"title":"効果の数字が弱い","text":"期待する効果を数字で示すために、どのデータを使って、どう見積もればよいかを手順で示してください。"}]},{"id":"premortem","title":"事前検死（プレモーテム）","category":"thinking","summary":"「この計画が失敗したとしたら」から原因を洗い出し、予防策を決める","recommendGem":false,"mdName":"プレモーテム","order":4,"vars":[{"key":"plan","label":"計画","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"horizon","label":"いつの時点で振り返る想定か","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 半年後"}],"prompt":"# 役割\nあなたはプロジェクトの失敗例をたくさん見てきたリスク管理の専門家です。\n\n# 前提\nいまは{{horizon}}（指定なしなら半年後）。この計画は**大失敗に終わった**とします。なぜ失敗したのかを振り返ってください。\n\n# 入力\n## 計画\n\"\"\"\n{{plan}}\n\"\"\"\n\n# 手順\n1. 失敗の筋書きを5〜8個考える。人・お金・期限・技術・外部の変化・思い込み、の観点で偏りなく\n2. それぞれ、起きる前に出る兆候を考える\n3. 起きやすさと影響の大きさを評価する\n4. 予防策と、起きたときの対応を決める\n\n# 出力形式\n## 失敗の筋書き\n| No | 失敗の原因 | 起きる前の兆候 | 起きやすさ（高・中・低） | 影響（大・中・小） | 予防策 | 起きたときの対応 |\n|---|---|---|---|---|---|---|\n\n## 最優先で手を打つこと（3つ）\n起きやすさ×影響が大きいものから。担当と期限の欄を空けておく。\n\n## 計画に書き足すべきこと\n\n# 守ること\n- 計画の中身に即した原因を書く。どの計画にも当てはまる一般論は1つまでにする\n- 予防策は、明日から実行できる具体的な行動にする\n\n# 最後に確認\n最優先の3つが、表の中で起きやすさと影響の大きいものと一致しているかを確かめてから出す。","tips":"計画を立てた直後、関係者で集まる前に使うと、会議で話すべきリスクが先にそろいます。","example":"","gem":"","followups":[{"title":"想定が甘い","text":"最悪の場合（2つの失敗が同時に起きる）の筋書きを1つ作り、そのときの損失と対応を書いてください。"}]},{"id":"objection-prep","title":"反対意見への回答準備","category":"thinking","summary":"提案に対して出そうな反対意見を立場ごとに洗い、30秒の答えを用意する","recommendGem":false,"mdName":"反対意見への回答","order":5,"vars":[{"key":"proposal","label":"提案の内容","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"audience","label":"説明する相手と立場","multiline":true,"optional":false,"attachable":false,"placeholder":"例: 経理部長（費用に厳しい）、現場リーダー（手間が増えるのを嫌う）"}],"prompt":"# 役割\nあなたは根回しの上手な調整役です。提案の場で反対されても、落ち着いて答えられるよう準備してください。\n\n# 入力\n## 説明する相手と立場\n{{audience}}\n\n## 提案の内容\n\"\"\"\n{{proposal}}\n\"\"\"\n\n# 手順\n1. 相手の立場ごとに、提案で損をする点・不安に思う点を考える\n2. そこから出そうな反対意見を挙げる（表に出る言い方と、本音の懸念を分ける）\n3. 反対意見ごとに、30秒で言える答えと、用意しておく根拠を決める\n4. 事前に個別に話しておくべき相手を決める\n\n# 出力形式\n## 予想される反対意見\n| 反対意見（言い方） | 言いそうな人 | 本音の懸念 | 答え（30秒） | 用意する根拠 |\n|---|---|---|---|---|\n\n## 答えにくいもの\n- 今の提案では答えられない反対意見と、提案側で直せること\n\n## 事前に話しておく相手\n| 相手 | 話しておくこと | 引き出したい反応 |\n|---|---|---|\n\n# 守ること\n- 提案に無い約束（追加の予算・人員）を答えに使わない\n- 相手を言い負かす答えではなく、懸念を解く答えにする\n\n# 最後に確認\nすべての立場について反対意見が1つ以上あるか、答えに根拠があるかを確かめてから出す。","tips":"相手の立場は一言でも効きます。「本音の懸念」が分かると、会議の前の根回しが楽になります。","example":"","gem":"","followups":[{"title":"相手になりきって","text":"いちばん手ごわい相手になりきって、私の答えに再反論してください。私が答えたら、さらに続けてください。"}]},{"id":"request-clarify","title":"依頼内容の確認","category":"planning","summary":"上司や顧客からの依頼に対して、着手前に聞くべきことと確認の文面を出す","recommendGem":false,"mdName":"依頼の確認","order":1,"vars":[{"key":"request","label":"依頼の文面","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"requester","label":"依頼してきた人","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 部長 / 取引先の担当者"}],"prompt":"# 役割\nあなたは手戻りを嫌う段取り上手です。依頼を受けてすぐ着手する前に、認識のずれを潰してください。\n\n# 前提\n{{my.profile}}\n文体: {{my.tone}}\n\n# 入力\n## 依頼してきた人\n{{requester}}\n\n## 依頼の文面\n\"\"\"\n{{request}}\n\"\"\"\n\n# 手順\n1. 依頼を「目的」「成果物（形式・量）」「期限」「品質の基準」「使い道」「関係者」「予算・制約」に分けて読み取る\n2. 読み取れない・解釈が割れるものを挙げる\n3. 聞かないと作業が無駄になるものを優先度 A にする\n4. 相手が答えやすい形（選択肢つき）で確認の文面を作る\n5. 確認が取れないまま進める場合の仮置きを決める\n\n# 出力形式\n## 依頼の理解\n| 項目 | 読み取れたこと | 不明・曖昧な点 |\n|---|---|---|\n\n## 着手前に聞くこと\n| 優先度 | 聞くこと | 聞かないと起きること |\n|---|---|---|\n\n## 確認の文面（そのまま送れるもの）\n\n## 返事が来ない場合の仮置き\n- 「〜と仮定して進めます」と伝える内容\n\n# 守ること\n- 依頼の文面から読み取れることは聞かない\n- 確認は5つまでにする。それ以上は仮置きで進める\n\n# 最後に確認\n優先度 A の確認が文面に入っているか、文面が相手を責める調子になっていないかを確かめてから出す。","tips":"チャットで来た依頼をそのまま貼ってください。確認の後は「タスク分解」に進むと流れがスムーズです。","example":"","gem":"","followups":[{"title":"聞くことを減らしたい","text":"確認を2つまでに絞り、残りは仮置きにしてください。仮置きの内容は文面に一言添えてください。"}]},{"id":"task-breakdown","title":"タスク分解","category":"planning","summary":"ぼんやりした依頼を、作業・担当・期限・確認ポイントに分ける","recommendGem":false,"mdName":"タスク一覧","order":2,"vars":[{"key":"request","label":"依頼・目標","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"deadline","label":"最終期限","multiline":false,"optional":true,"attachable":false,"placeholder":""},{"key":"members","label":"関わる人","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 自分、田中さん（デザイン）、外注先"}],"prompt":"# 役割\nあなたは段取りの上手なプロジェクトリーダーです。依頼を、明日から手を動かせる作業の一覧にしてください。\n\n# 前提\n{{my.profile}}\n\n# 入力\n## 依頼・目標\n\"\"\"\n{{request}}\n\"\"\"\n\n## 最終期限\n{{deadline}}\n\n## 関わる人\n{{members}}\n\n# 手順\n1. ゴールと「完了の定義」（何がそろったら終わりか）を決める\n2. ゴールから逆算して作業を洗い出す。1つの作業は半日〜2日で終わる大きさにする\n3. 作業の順番と、前の作業が終わらないと始められない関係を整理する\n4. 担当・期限・成果物・確認ポイント（誰に見てもらうか）を付ける\n5. 遅れると全体が遅れる作業の並び（クリティカルパス）を示す\n\n# 出力形式\n## ゴールと完了の定義\n\n## 作業一覧\n| No | 作業 | 担当 | 期限 | 前提の作業 | 成果物 | 確認ポイント |\n|---|---|---|---|---|---|---|\n\n## 遅れてはいけない作業の並び\nNo.1 → No.3 → …\n\n## 最初の一手（今日やること）\n\n## 依頼者に確かめること\n\n# 守ること\n- 担当や期限が入力から決められないものは「未定」とする\n- 期限は最終期限から逆算し、最後に1〜2割の余裕を残す\n\n# 最後に確認\n作業をすべて終えると完了の定義を満たすか、期限が最終期限を超えていないかを確かめてから出す。","tips":"表はそのままスプレッドシートに貼ってタスク管理に使えます。\n依頼が曖昧なときは、先に「依頼内容の確認」を使うと手戻りが減ります。","example":"","gem":"","followups":[{"title":"作業が粗い","text":"期間が3日を超える作業を、さらに細かく分けてください。"}]},{"id":"sheet-formula","title":"スプレッドシートの関数作成","category":"numbers","summary":"やりたいことと表の構成から、数式と入れるセル・使い方を出す","recommendGem":false,"mdName":"","order":1,"vars":[{"key":"want","label":"やりたいこと","multiline":true,"optional":false,"attachable":false,"placeholder":"例: 担当者ごとに今月の売上合計を出したい"},{"key":"layout","label":"表の構成（列名と数行の例）","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"tool","label":"使うソフト","multiline":false,"optional":true,"attachable":false,"placeholder":"Google スプレッドシート / Excel"}],"prompt":"# 役割\nあなたは表計算の達人です。表計算に詳しくない人でもそのまま使えるように、数式と使い方を教えてください。\n\n# 入力\n## 使うソフト\n{{tool}}（指定なしなら Google スプレッドシート）\n\n## やりたいこと\n{{want}}\n\n## 表の構成（列名と数行の例）\n\"\"\"\n{{layout}}\n\"\"\"\n\n# 手順\n1. 表の構成から、列の位置（A列・B列…）とデータの範囲を確かめる\n2. やりたいことを実現する数式を、できるだけ単純な関数で作る\n3. 例のデータで計算した結果を示し、数式が正しいことを確かめる\n4. よくある失敗（範囲のずれ・文字列の数字・空白セル）と対処を書く\n\n# 出力形式\n## 数式\n```\n=…\n```\n- 入れるセル:\n- 下にコピーしてよいか:\n\n## 数式の読み方\n関数ごとに何をしているかを1行ずつ。\n\n## 例での結果\n| 入力 | 結果 |\n|---|---|\n\n## うまくいかないとき\n| 症状 | 原因 | 直し方 |\n|---|---|---|\n\n## 別のやり方（あれば）\nピボットテーブルやフィルタで済む場合はその手順。\n\n# 守ること\n- 使うソフトで動く関数だけを使う（Google スプレッドシート専用の関数を Excel で使わない）\n- 列の位置が入力から分からないときは、仮定した位置を明記する\n\n# 最後に確認\n例のデータで数式を実際に計算し、結果が合うことを確かめてから出す。","tips":"表の先頭数行をそのまま貼るのが一番確実です（列名つき）。中身はダミーでも構いません。","example":"","gem":"","followups":[{"title":"エラーが出た","text":"出たエラーの表示（#N/A など）と、数式を入れたセルを伝えるので、原因と直し方を教えてください。"}]},{"id":"table-insight","title":"表データの集計と示唆","category":"numbers","summary":"表を集計し、事実・解釈・打ち手を分けて示唆を出す","recommendGem":false,"mdName":"集計と示唆","order":2,"vars":[{"key":"table","label":"表データ","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"question","label":"知りたいこと","multiline":false,"optional":false,"attachable":false,"placeholder":"例: どの商品が伸びていて、何が落ちているか"}],"prompt":"# 役割\nあなたは事業部付きのデータアナリストです。数字から言えることと言えないことを分け、次の行動につながる示唆を出してください。\n\n# 入力\n## 知りたいこと\n{{question}}\n\n## 表データ\n\"\"\"\n{{table}}\n\"\"\"\n\n# 手順\n1. データの概要を確かめる（行数・列・期間・単位・欠けている値）\n2. 知りたいことに答える集計をする。計算はコードを実行するか、式を書いてから行う\n3. 結果を「事実（数字そのもの）」「解釈（なぜそうなったかの推測）」「打ち手」に分けて書く\n4. 結論の確かさを弱める要因（件数が少ない・外れ値・期間が短い）を挙げる\n\n# 出力形式\n## データの概要\n\n## 集計結果\n| 切り口 | 値 | 前期比など |\n|---|---|---|\n\n## 示唆\n| 事実 | 解釈（推測） | 打ち手 |\n|---|---|---|\n\n## 注意点\n\n## 追加で見るとよい切り口\n\n# 守ること\n- 事実と推測を混ぜない。推測には「推測」と書く\n- データに無い期間・項目について言わない\n- 数字は単位つきで書く\n\n# 最後に確認\n集計結果の数字を、もう一度計算して確かめてから出す。","tips":"Excel や CSV を添付すると、Gemini がコードで集計してくれることがあり、計算が正確になります。\n「知りたいこと」は1つに絞った方が、示唆が鋭くなります。","example":"","gem":"","followups":[{"title":"グラフにしたい","text":"この結果を伝えるのに最適なグラフを1つ選び、スプレッドシートで作る手順を教えてください。"}]},{"id":"chart-choice","title":"グラフの選び方","category":"numbers","summary":"データと伝えたいことから、最適なグラフと作り方・避けるべき見せ方を出す","recommendGem":false,"mdName":"","order":3,"vars":[{"key":"data_desc","label":"データの内容","multiline":true,"optional":false,"attachable":false,"placeholder":"例: 5商品の月別売上、12か月分"},{"key":"message","label":"伝えたいこと","multiline":false,"optional":false,"attachable":false,"placeholder":""},{"key":"audience","label":"見る人","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたはデータの見せ方の専門家です。伝えたいことが一目で伝わるグラフを選んでください。\n\n# 入力\n## データの内容\n{{data_desc}}\n\n## 伝えたいこと\n{{message}}\n\n## 見る人\n{{audience}}\n\n# 手順\n1. 伝えたいことの型を決める（大小の比較・時間の推移・内訳・分布・関係）\n2. 型に合うグラフを選び、次点も挙げる\n3. 作り方を具体的に決める（並び順、強調する色、ラベル、軸の範囲、単位、タイトル）\n4. このデータで誤解を生む見せ方を挙げる\n\n# 出力形式\n## おすすめ\n- グラフ:\n- 理由:\n- 次点:\n\n## 作り方\n| 項目 | 設定 |\n|---|---|\n| タイトル（結論の文） | |\n| 横軸 / 縦軸 | |\n| 並び順 | |\n| 色 | |\n| ラベル | |\n\n## 避けた方がよい見せ方\n\n# 守ること\n- 棒グラフの縦軸は0から始める\n- 色は強調したい1つにだけ付ける\n\n# 最後に確認\nおすすめのグラフで、伝えたいことが3秒で分かるかを確かめてから出す。","tips":"グラフを作る前に使ってください。作った後のグラフを直すときは「グラフの改善」が向いています。","example":"","gem":"","followups":[{"title":"もっと目を引く見せ方","text":"正確さを保ったまま、見る人の印象に残る見せ方を1つ提案してください。"}]},{"id":"data-item-extract","title":"資料 → データ項目と判断ルールの洗い出し","category":"design","summary":"要件書・帳票・画面の資料から、扱うデータ項目と「〜の場合は〜」の判断ルールを出典つきで抜き出す（NotebookLM に貼る）","recommendGem":false,"mdName":"","order":1,"vars":[{"key":"scope","label":"対象の業務・システム","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 受注から出荷までの販売管理"},{"key":"focus","label":"特に見たい帳票・画面","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 受注伝票、出荷指示書、与信の審査"}],"prompt":"# 役割\nあなたは業務システムのデータ設計を担当する分析者です。このノートブックのソースだけを根拠に、システムが扱うデータ項目と判断ルールを漏れなく洗い出してください。設計（テーブルへの分け方）はまだしません。\n\n# 目的\n後でテーブル設計と判断マスタを作るための材料にする。対象: {{scope}}（指定なしなら、ソース全体の業務）\n\n# 特に見るもの\n{{focus}}（指定なしなら、すべての帳票・画面・業務の説明）\n\n# 手順\n1. ソースに出てくる業務・帳票・画面・外部とのやりとり（ファイル連携など）を一覧にする\n2. それぞれに出てくる項目（入力・表示・印字・計算される値）を拾う。同じ意味で名前が違う項目は1つにまとめ、別名を書く\n3. 項目ごとに、意味・例の値・桁や形式・必須かどうか・1件の中で繰り返すか（明細行など）を、ソースにある範囲で書く\n4. 「〜の場合は〜」「〜以上なら〜」「〜のときは不可」など、判断・分岐・計算の記述を別の表に抜き出す\n5. ソースどうしで食い違う記述と、ソースには無いが業務上ありそうな項目を分けて挙げる\n\n# 出力形式\n## 1. 業務・帳票・画面の一覧\n| No | 名前 | 種類（業務/帳票/画面/連携） | 概要 | 出典（ソース名と箇所） |\n|---|---|---|---|---|\n\n## 2. データ項目の一覧\n| No | 項目名 | 別名 | 出てくる帳票・画面 | 意味 | 例の値 | 桁・形式 | 必須 | 繰り返し | 確度 | 出典 |\n|---|---|---|---|---|---|---|---|---|---|---|\n- 確度は「明記」（ソースに書いてある）か「推測」（ソースから読み取った）のどちらか\n- 繰り返しは「1件に1つ」か「1件に複数（明細など）」\n\n## 3. 判断・分岐のルール\n| No | 何を判断するか | 条件 | 結果 | 例外・但し書き | 確度 | 出典 |\n|---|---|---|---|---|---|---|\n\n## 4. ソースどうしの食い違い\n| 項目・ルール | ソースA の記述 | ソースB の記述 |\n|---|---|---|\n\n## 5. ソースに無いが要りそうな項目\n- 項目名: 要りそうな理由（ソースのどの記述から考えたか）\n\n# 守ること\n- ソースに無いことは推測で埋めず「不明」と書く。桁・形式・必須が書かれていなければ「不明」\n- 推測した項目やルールは、確度を「推測」にし、5 に分ける\n- 出典は、後で人が確かめられるようにソース名と箇所（ページ・スライド番号・見出し）まで書く\n- テーブルへの分け方やコードの体系は提案しない（次の段階で行う）\n\n# 最後に確認\nすべての行に出典があるか、確度が「明記」の行は本当にソースに書かれているかを確かめてから出す。","tips":"NotebookLM のノートブックに、要件定義書・提案書・帳票の見本・画面の資料をソースとして入れてから貼ってください。\npptx や docx は、Google スライド・Google ドキュメントに変換するか PDF にしてから入れると確実です。\n資料が多いときは「特に見たい帳票・画面」を絞って何回かに分けると、拾い漏れが減ります。出力をつなげて次の「テーブル設計」に貼ります。\n判断マスタを作るときは、3 の表を「判断マスタの設計」に貼ります。","example":"","gem":"","followups":[{"title":"拾い漏れを探す","text":"ソースをもう一度見直し、上の一覧に無い項目・判断ルールだけを同じ表の形で追加してください。無ければ「追加なし」と書いてください。"},{"title":"1つの帳票を詳しく","text":"次の帳票（または画面）について、項目を印字・表示の順に並べ直し、明細行と見出しの項目を分けてください:"}]},{"id":"table-design","title":"データ項目 → テーブル設計案","category":"design","summary":"洗い出した項目から、テーブル一覧・カラム定義・ER 図（Mermaid）を作る。根拠のない列は「推測」と明示する","recommendGem":false,"mdName":"テーブル設計","order":2,"vars":[{"key":"items","label":"データ項目の一覧（洗い出しの出力や資料）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"naming","label":"命名の決まり","multiline":false,"optional":true,"attachable":false,"placeholder":"例: マスタは m_ で始める、主キーは id"}],"prompt":"# 役割\nあなたは業務システムの詳細設計を担当するデータベース設計者です。与えられたデータ項目から、リレーショナルデータベースのテーブル設計案を作ってください。データベースの製品はまだ決まっていないので、特定の製品に依存しない形で書きます。\n\n# 目的\n詳細設計書のテーブル定義のたたき台にする。人がレビューして直す前提で、根拠と仮置きを見分けられるようにする。\n\n# 入力\n## 命名の決まり\n{{naming}}（指定なしなら、物理名は英小文字の snake_case。テーブル名は複数形にしない。主キーは id）\n\n## データ項目の一覧\n\"\"\"\n{{items}}\n\"\"\"\n\n# 手順\n1. 項目を、マスタ（顧客・商品など、繰り返し参照されるもの）、トランザクション（受注・出荷など、業務で発生するもの）、関連（多対多をつなぐもの）、コード（区分値）に分ける\n2. 1件に複数ある項目（明細など）は別のテーブルに分ける。同じ値を何か所にも持たないように、第3正規形を目安に分ける\n3. テーブルごとに主キーを決め、テーブルどうしの関係を外部キーで表す\n4. 区分値（状態・種別など）は、値の一覧をコードテーブルにするか、列の取りうる値として書く\n5. 作成日時・更新日時など全テーブル共通の列は、共通列として1か所にまとめて書く\n6. 資料に根拠が無い判断（分け方・型・桁）は、仮置きとして一覧にする\n\n# 出力形式\n# テーブル設計案: （対象の業務）\n\n## 1. テーブル一覧\n| No | 区分 | 論理名 | 物理名 | 説明 | 主な出典 |\n|---|---|---|---|---|---|\n- 区分は マスタ / トランザクション / 関連 / コード のどれか\n\n## 2. カラム定義\nテーブルごとに見出し（### 論理名（物理名））を立てて、次の表を書く。\n| No | 論理名 | 物理名 | 型 | 桁 | 必須 | PK | FK（参照先） | 既定値 | 説明 | 確度 | 根拠 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n- 型は 文字列 / 整数 / 小数 / 日付 / 日時 / 真偽 のどれか（製品ごとの型名にしない）\n- 確度は「明記」（資料に書いてある）か「推測」（設計上補った）。推測の行は、根拠に補った理由を書く\n\n## 3. 共通列\n全テーブルに付ける列を、上と同じ表で。\n\n## 4. ER 図\nMermaid の erDiagram で書く。囲みは、1行目を ~~~mermaid、最後の行を ~~~ にする（バッククォート3つは使わない）。\nテーブル名は物理名、関係の線には「1対多」などの意味が分かるラベルを付ける。\n\n## 5. 仮置きにした設計判断\n| No | 判断したこと | 理由 | 確かめる相手・方法 |\n|---|---|---|---|\n\n## 6. 資料から決められなかったこと\n- 項目名やテーブル名: 何が分からないか\n\n# 守ること\n- 資料に無いことは推測で埋めず「不明」と書く。桁が分からなければ桁は「不明」にする\n- 補った列やテーブルは必ず確度を「推測」にする。明記と推測を混ぜない\n- 特定のデータベース製品の型名・CREATE 文・インデックス設計は書かない\n- 物理名は1つの意味に1つの単語を使い、テーブルをまたいで同じ意味の列は同じ物理名にする\n\n# 最後に確認\n出力の前に、データ項目の一覧の項目がどれかの列に入っているか（入れなかった項目は 6 に理由を書く）、外部キーの参照先がテーブル一覧にあるか、ER 図のテーブルが 1 と一致しているかを確かめ、足りなければ直してから出す。","tips":"「資料 → データ項目と判断ルールの洗い出し」の出力をそのまま貼ってください。資料が少ないときは、資料を Gemini に直接添付しても使えます。\nテーブルが多くて出し切れないときは、「続き」と送れば続きが出ます。\n社内の命名規約があれば「命名の決まり」に書くと、物理名がそろいます。\nER 図は、Mermaid に対応したエディタ（GitHub、Notion、mermaid.live など）に貼ると図になります。","example":"","gem":"","followups":[{"title":"スプレッドシート貼付用に出し直す","text":"2 のカラム定義を、全テーブル分つなげて1つの表にし、タブ区切りで出し直してください。1行目は見出し（テーブル物理名 / テーブル論理名 / No / 論理名 / 物理名 / 型 / 桁 / 必須 / PK / FK / 既定値 / 説明 / 確度 / 根拠）。セルの中に改行とタブを入れないでください。"},{"title":"テーブル一覧もタブ区切りで","text":"1 のテーブル一覧を、タブ区切りで出し直してください。1行目は見出し。セルの中に改行とタブを入れないでください。"},{"title":"1つのテーブルを詳しく","text":"次のテーブルについて、列ごとに取りうる値・入力のチェック（範囲・形式）・更新されるタイミングを追加してください:"}]},{"id":"table-sample-rows","title":"テーブル設計 → サンプル行で確かめる","category":"design","summary":"各テーブルに3〜5行のサンプルデータを入れて、1対多・空欄・履歴の扱いが破綻しないかを確かめる","recommendGem":false,"mdName":"","order":3,"vars":[{"key":"design","label":"テーブル設計案","multiline":true,"optional":false,"attachable":true,"placeholder":""}],"prompt":"# 役割\nあなたは業務システムのテスト設計者です。テーブル設計案に実際にありそうなデータを入れてみて、設計が業務を表しきれるかを確かめてください。\n\n# 目的\n表にデータを並べることで、机上では気づかない設計の穴（入れられないデータ、同じ値の重複、関係の向きの誤り）を見つける。\n\n# 入力\n## テーブル設計案\n\"\"\"\n{{design}}\n\"\"\"\n\n# 手順\n1. 業務でよくある流れを1つ選び（例: 顧客が2回注文し、1回目は明細が3行）、その流れに沿って各テーブルに3〜5行のデータを作る\n2. 外部キーの値は、参照先のテーブルに実在する行と合わせる\n3. 次のような、設計が試される行を必ず混ぜる: 1件に明細が複数ある / 任意の列が空 / 途中で値が変わる（住所変更・単価改定など） / 取り消し・返品\n4. データを入れられなかった、または不自然になった箇所を、設計の問題として挙げる\n\n# 出力形式\n## 1. 想定した業務の流れ\n- 箇条書きで3〜6行\n\n## 2. サンプル行\nテーブルごとに見出し（### 論理名（物理名））を立てて、列は物理名で Markdown の表に。\n値は架空のものにする（実在の人名・社名・電話番号は使わない）。\n\n## 3. 入れてみて分かった問題\n| No | テーブル・列 | 起きたこと | 原因と思われる設計 | 直し方の案 |\n|---|---|---|---|---|\n\n## 4. 問題が無かった点\n- 確かめられたこと（例: 明細が複数でも受注は1行で表せた）\n\n# 守ること\n- 設計案に無い列を勝手に足して入れない。足りない列は 3 に問題として書く\n- 設計案から分からない値の形式は推測で埋めず「不明」と書く\n- 個人情報に見える値を作らない\n\n# 最後に確認\n外部キーの値がすべて参照先の行に存在するか、3 で挙げた問題ごとに再現できるサンプル行があるかを確かめてから出す。","tips":"「データ項目 → テーブル設計案」の出力をそのまま貼ってください。\n問題が見つかったら、テーブル設計案のプロンプトに戻って「次の問題を直して設計し直してください」と 3 の表を貼ると直せます。","example":"","gem":"","followups":[{"title":"スプレッドシート貼付用に出し直す","text":"2 のサンプル行を、テーブルごとにタブ区切りで出し直してください。各テーブルの前に「# テーブル物理名」の1行を置き、その次の行を見出しにしてください。セルの中に改行とタブを入れないでください。"},{"title":"別の業務の流れで試す","text":"別の業務の流れ（例外が多いもの）を選んで、同じ形でサンプル行と問題を出してください。"}]},{"id":"table-design-review","title":"テーブル設計のレビューと確認事項","category":"design","summary":"正規化の漏れ・重複・根拠のない列・命名のゆれを重大度つきで洗い、顧客に確かめる事項にまとめる","recommendGem":false,"mdName":"","order":4,"vars":[{"key":"design","label":"テーブル設計案","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"items","label":"データ項目の一覧（元の洗い出し）","multiline":true,"optional":true,"attachable":true,"placeholder":""}],"prompt":"# 役割\nあなたは経験の長いデータベース設計のレビュアーです。テーブル設計案を厳しくレビューし、直すべき点と、顧客に確かめないと決まらない点を分けてください。\n\n# 目的\n設計レビューの前に問題を洗い出し、顧客への確認を一度で済ませる。\n\n# 入力\n## テーブル設計案\n\"\"\"\n{{design}}\n\"\"\"\n\n## データ項目の一覧（元の洗い出し）\n\"\"\"\n{{items}}\n\"\"\"\n（空なら、設計案だけでレビューする）\n\n# 手順\n1. 次の観点で設計案を見る\n   - 正規化: 同じ値を複数のテーブルに持っていないか、1つの列に複数の値を入れていないか\n   - 関係: 1対多・多対多の向きと外部キーが業務と合っているか\n   - 履歴: 変わりうる値（単価・住所・組織）を、過去の伝票が壊れない形で持てるか\n   - 根拠: 確度が「推測」の列・テーブルが多すぎないか、根拠の書き方が確かめられるか\n   - 命名: 同じ意味の列が別の物理名になっていないか、論理名と物理名が合っているか\n   - 共通列: 作成日時・更新日時・削除の扱いがそろっているか\n   - 漏れ: 元の項目の一覧にあって、設計案に入っていない項目\n2. 問題ごとに重大度を付ける（高: 業務が回らない・データが壊れる / 中: 後で直すと手戻りが大きい / 低: 体裁・命名）\n3. 設計者が直せる問題と、顧客に聞かないと決まらない問題を分ける\n\n# 出力形式\n## 1. 総評（3行）\n\n## 2. 直すべき点\n| No | 重大度 | 観点 | テーブル・列 | 問題 | 直し方の案 |\n|---|---|---|---|---|---|\n重大度の高い順に並べる。\n\n## 3. 顧客に確かめること\n| No | 確かめたいこと | なぜ必要か（設計のどこが決まるか） | 選択肢の案 | 関係するテーブル・列 |\n|---|---|---|---|---|\n\n## 4. 問題が無かった観点\n- 観点: 確かめた内容\n\n# 守ること\n- 設計案と項目の一覧に無いことは推測で埋めず「不明」と書く\n- 好みの問題（書き方の流儀）を重大度「高」にしない\n- 特定のデータベース製品の機能を前提にした指摘はしない\n\n# 最後に確認\n2 の各行に直し方の案があるか、3 の各行が「はい/いいえ」か選択肢で答えられる聞き方になっているかを確かめてから出す。","tips":"「データ項目 → テーブル設計案」の出力を貼ってください。元の洗い出しも貼ると、項目の漏れまで見られます。\n3 の表は「質問リスト」に貼れば、顧客に送る形に整えられます。NotebookLM の質問箱を使っているなら、質問台帳に加えてください。","example":"","gem":"","followups":[{"title":"直した設計案を出す","text":"2 の重大度「高」と「中」を反映したテーブル設計案を、元と同じ形で出し直してください。変えた箇所には説明の列の先頭に【変更】と付けてください。"}]},{"id":"decision-master","title":"判断ルール → 判断マスタと判別フロー","category":"design","summary":"「〜の場合は〜」の記述を、1行1ルールの判断表と判別フロー（Mermaid）にし、抜け・重複・矛盾を洗い出す","recommendGem":false,"mdName":"判断マスタ","order":5,"vars":[{"key":"rules","label":"判断ルールの記述（洗い出しの出力や資料）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"purpose","label":"何を判定するか","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 受注を自動承認するか、上長承認に回すか"}],"prompt":"# 役割\nあなたは業務ルールの整理を担当するシステム設計者です。資料に書かれた判断の記述を、システムのマスタとして登録できる判断表と、人が読める判別フローにまとめてください。\n\n# 目的\n判断マスタの中身（条件の組み合わせと結果）を、抜けと矛盾が無い形で確定させる。判定するもの: {{purpose}}（指定なしなら、記述から読み取れる判断ごとに分ける）\n\n# 入力\n## 判断ルールの記述\n\"\"\"\n{{rules}}\n\"\"\"\n\n# 手順\n1. 記述から、判断に使う条件（例: 金額、顧客区分、在庫の有無）と、出す結果（例: 承認、保留、却下）を拾う\n2. 条件ごとに取りうる値を決める。数値は境界（以上・未満）をはっきりさせて区間に分ける\n3. 記述を1行1ルールの判断表にする。どの条件も関係ないルールでは、その条件を「-」（問わない）にする\n4. 複数のルールに当てはまる場合の優先順位を決め、どのルールにも当てはまらない場合の既定の行（それ以外）を最後に置く\n5. 条件の組み合わせを総当たりで見て、どのルールにも当たらない組み合わせ（抜け）、同じ条件で結果が違うルール（矛盾）、ほかのルールに完全に含まれるルール（重複）を探す\n6. 判別フローを作る。条件が7つ程度を超えるときは、主な分岐だけを図にし、細かい条件は判断表を見るように書く\n\n# 出力形式\n# 判断マスタ: （判定するもの）\n\n## 1. 条件と結果\n| 区分 | 名前 | 取りうる値 | 出典 |\n|---|---|---|---|\n- 区分は「条件」か「結果」\n\n## 2. 判断表\n| ルールID | 優先順位 | 条件1 | 条件2 | … | 結果 | 確度 | 根拠 |\n|---|---|---|---|---|---|---|---|\n- 条件の列名は 1 の条件の名前にする\n- 最後の行は「それ以外」の既定のルールにする。記述に既定が無ければ、結果を「不明」にする\n- 確度は「明記」（資料に書いてある）か「推測」（補った）。推測の行は、根拠に補った理由を書く\n\n## 3. 判別フロー\nMermaid の flowchart TD で書く。囲みは、1行目を ~~~mermaid、最後の行を ~~~ にする（バッククォート3つは使わない）。\nひし形に条件、四角に結果を置き、分岐の線に条件の値をラベルで付ける。\n\n## 4. 網羅チェック\n| No | 種類（抜け/矛盾/重複） | 該当するルールID・条件の組み合わせ | 内容 | 案 |\n|---|---|---|---|---|\n問題が無ければ「なし」と書く。\n\n## 5. 確かめること\n| No | 確かめたいこと | 決まらないと困ること | 選択肢の案 |\n|---|---|---|---|\n\n# 守ること\n- 記述に無い条件や結果は推測で埋めず「不明」と書く。補った行は必ず確度を「推測」にする\n- 境界の値（ちょうど10万円など）がどのルールに入るかを、すべての数値条件で明示する\n- 判定のプログラムやルールエンジンの設定は書かない\n\n# 最後に確認\n出力の前に、4 で総当たりした組み合わせがすべて 2 のどれかの行（それ以外を含む）に当たるか、3 のフローの結果が 2 の結果と食い違っていないかを確かめ、足りなければ直してから出す。","tips":"「資料 → データ項目と判断ルールの洗い出し」の 3（判断・分岐のルール）を貼ってください。資料が少なければ、資料を直接添付しても使えます。\n判断が何種類もあるときは、「何を判定するか」を1つに絞って、判断ごとに使うと抜けが見つかりやすくなります。\n判断表をマスタとして持つテーブルの形は、この出力を「データ項目 → テーブル設計案」に貼ると作れます。","example":"","gem":"","followups":[{"title":"スプレッドシート貼付用に出し直す","text":"2 の判断表を、タブ区切りで出し直してください。1行目は見出し。セルの中に改行とタブを入れないでください。"},{"title":"4 の問題を反映する","text":"4 の網羅チェックの案を反映した判断表を出し直してください。追加・変更した行は、根拠の先頭に【追加】【変更】と付けてください。"},{"title":"境界の値でテストする","text":"各数値条件の境界のちょうどの値・その前後の値を使ったテストケースを、入力（条件の値）・期待する結果・当たるルールIDの表で出してください。"}]},{"id":"manual-from-notes","title":"メモ → 手順書","category":"manual","summary":"口頭説明の文字起こしや操作メモから、迷わない手順書を作る","recommendGem":false,"mdName":"手順書","order":1,"vars":[{"key":"notes","label":"口頭説明・メモ","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"reader","label":"読む人","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 入社1か月目の事務スタッフ"},{"key":"system","label":"対象の業務・システム名","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたはマニュアル作りの専門家です。初めての人が一人で作業を終えられる手順書を作ってください。\n\n# 入力\n## 読む人\n{{reader}}\n\n## 対象の業務・システム名\n{{system}}\n\n## 口頭説明・メモ\n\"\"\"\n{{notes}}\n\"\"\"\n\n# 手順\n1. 作業の目的と、始める前にそろえるもの（権限・ファイル・情報）を拾う\n2. 操作を1手順1動作に分ける。「どの画面の・どこを・どうするか」と「うまくいったときの見え方」を書く\n3. 間違えやすい箇所と、困ったときの対処を拾う\n4. メモから分からない箇所を不明点として挙げる\n\n# 出力形式\n# {作業名} の手順書\n## 目的\n## 始める前に\n- 必要な権限・ファイル・情報\n## 手順\n| No | 操作 | 画面・場所 | 入力する値 | うまくいったときの見え方 |\n|---|---|---|---|---|\n## 間違えやすい点\n## 困ったとき\n| 症状 | 対処 | 聞く相手 |\n|---|---|---|\n## 作成者が確かめること\n- メモから分からなかった点\n\n# 守ること\n- メモに無い操作を足さない。抜けていそうな手順は「作成者が確かめること」に書く\n- 専門用語は読む人に合わせて言い換えるか、一言説明する\n\n# 最後に確認\n手順を上から順にたどって作業が終わるか（途中で抜けがないか）を確かめてから出す。","tips":"詳しい人に作業をしてもらいながら説明を録音し、その文字起こしを貼るのが一番速い作り方です。\n画面のスクリーンショットも添付すると、場所の説明が正確になります。","example":"","gem":"","followups":[{"title":"手順が粗い","text":"1つの手順に2つ以上の操作が入っているものを分けてください。"}]},{"id":"handover","title":"引き継ぎ資料","category":"manual","summary":"業務メモから、業務一覧・定期作業・関係者・進行中の案件・暗黙のルールをまとめる","recommendGem":false,"mdName":"引き継ぎ資料","order":2,"vars":[{"key":"materials","label":"業務のメモ・資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"successor","label":"引き継ぐ相手","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 他部署から来る中堅社員"},{"key":"date","label":"引き継ぎの期限","multiline":false,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは引き継ぎの段取りに慣れた先輩です。後任が初日から困らない引き継ぎ資料を作ってください。\n\n# 前提\n引き継ぐ人:\n{{my.profile}}\n\n# 入力\n## 引き継ぐ相手\n{{successor}}\n\n## 引き継ぎの期限\n{{date}}\n\n## 業務のメモ・資料\n\"\"\"\n{{materials}}\n\"\"\"\n\n# 手順\n1. 業務を洗い出し、頻度（毎日・毎週・毎月・年1回・都度）で分ける\n2. 業務ごとに、期限・所要時間・関係者・手順の場所を拾う\n3. 進行中の案件と、その状態・次の一手を拾う\n4. 書かれていないと困る暗黙のルールや注意点を拾う\n5. 引き継ぎの面談で確かめるべきことを挙げる\n\n# 出力形式\n## 業務一覧\n| 業務 | 頻度 | 期限・時期 | 所要時間 | 関係者 | 手順の場所 |\n|---|---|---|---|---|---|\n\n## 定期作業のカレンダー\n| 時期 | 作業 |\n|---|---|\n\n## 関係者\n| 名前・部署 | 何でやりとりするか | 注意点 |\n|---|---|---|\n\n## 進行中の案件\n| 案件 | 状態 | 次の一手 | 期限 |\n|---|---|---|---|\n\n## 注意点・暗黙のルール\n\n## 引き継ぎの面談で確かめること\n\n# 守ること\n- メモに無いことは推測で埋めず「不明」と書く\n- パスワードなどの秘密の情報は資料に書かず、「別途伝える」とする\n\n# 最後に確認\n年1回の業務や、時期が決まっている作業が漏れていないかを確かめてから出す。","tips":"異動の1か月前から、メールやチャットの履歴、手元のメモを貼って作り始めると漏れが減ります。","example":"","gem":"","followups":[{"title":"抜けがありそう","text":"年1回・半年に1回の業務（決算・監査・契約更新・棚卸しなど）が漏れていないか、もう一度メモを読み直してください。"}]},{"id":"whiteboard-ocr","title":"ホワイトボード・手書きメモ → テキスト","category":"image","summary":"写真の文字を配置どおりに起こし、矢印やグループの構造も文章にする","recommendGem":false,"mdName":"ホワイトボード","order":1,"vars":[{"key":"image","label":"写真","multiline":false,"optional":false,"attachable":true,"placeholder":""},{"key":"purpose","label":"何に使うか","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 会議の記録として議事録に入れる"}],"prompt":"# 役割\nあなたは手書き文字の読み取りが得意な書記です。写真に書かれた内容を、漏れなく正確にテキストにしてください。\n\n# 入力\n## 写真\n{{image}}\n\n## 何に使うか\n{{purpose}}\n\n# 手順\n1. 写真全体を見て、書かれている領域（枠・列・付箋のかたまり）を把握する\n2. 領域ごとに、上から下・左から右の順で文字を起こす\n3. 矢印・線・丸囲み・色の違いなどの構造を読み取り、言葉で表す\n4. 読めない文字は推測で埋めず、[判読不可] とする。候補があれば [判読不可: 〇〇?] とする\n\n# 出力形式\n## 文字起こし（配置どおり）\n領域ごとに見出しを立てて箇条書き。\n\n## 構造\n- 「A → B」「C と D は同じグループ（青の丸）」のように\n\n## 整理した要点\n目的に合わせて3〜5行。\n\n## 読めなかった箇所\n| 位置 | 読めた部分 | 候補 |\n|---|---|---|\n\n# 守ること\n- 書かれていない言葉を補わない（整理した要点を除く）\n- 数字・日付・人名は特に慎重に読み、自信がなければ [判読不可] にする\n\n# 最後に確認\n写真のすべての領域を起こしたかを確かめてから出す。","tips":"正面から、ボード全体が入るように撮ると精度が上がります。字が小さい部分は寄った写真も一緒に添付してください。","example":"","gem":"","followups":[{"title":"議事録にしたい","text":"この内容を、決定事項・ToDo・論点に分けた議事録の形に整えてください。"}]},{"id":"screenshot-error","title":"スクショからエラーの原因推定","category":"image","summary":"エラー画面のスクリーンショットから、意味・原因の候補・安全な解決手順を出す","recommendGem":false,"mdName":"","order":2,"vars":[{"key":"image","label":"エラー画面のスクリーンショット","multiline":false,"optional":false,"attachable":true,"placeholder":""},{"key":"situation","label":"何をしたときに出たか","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"env","label":"使っている環境","multiline":false,"optional":true,"attachable":false,"placeholder":"例: Windows 11、Excel（Microsoft 365）、社内の経費システム"}],"prompt":"# 役割\nあなたは社内のヘルプデスク担当です。パソコンに詳しくない人にも分かる言葉で、エラーの意味と直し方を説明してください。\n\n# 入力\n## スクリーンショット\n{{image}}\n\n## 何をしたときに出たか\n{{situation}}\n\n## 使っている環境\n{{env}}\n\n# 手順\n1. 画面のエラーメッセージを原文のまま書き出す\n2. メッセージの意味を分かりやすい言葉で説明する\n3. 原因の候補を、可能性の高い順に挙げる。それぞれ確かめ方を書く\n4. 解決の手順を、安全なもの（再起動・再ログインなど）から順に書く\n5. 自分で直せないときの、問い合わせの文面を作る\n\n# 出力形式\n## エラーの原文\n\n## 意味（2行）\n\n## 原因の候補\n| 可能性 | 原因 | 確かめ方 |\n|---|---|---|\n\n## 解決の手順\n1. …（各手順の後に「これで直ったら終わり」と書く）\n\n## 問い合わせの文面\n情報システム部門などにそのまま送れるもの（起きたこと・時刻・画面・試したこと）。\n\n# 守ること\n- データが消える・設定を大きく変える手順は、最後に回し「実行前に担当部署に確認」と書く\n- 画面から読み取れないことは決めつけない\n\n# 最後に確認\n解決の手順が安全な順に並んでいるかを確かめてから出す。","tips":"Windows なら「Windows キー + Shift + S」で画面の一部を撮れます。エラーの直前に何をしたかを書くほど、原因が絞れます。","example":"","gem":"","followups":[{"title":"直らなかった","text":"試した手順と、その結果の画面を伝えるので、次に試すことを教えてください。"}]},{"id":"key-visual","title":"キービジュアルの画像生成指示","category":"image","summary":"形容詞ではなく、主役の物・構図・視線の順番・光・素材・媒体で指示する画像生成プロンプトを、方向の違う3案で作る","recommendGem":false,"mdName":"","order":9,"vars":[{"key":"concept","label":"伝えたいこと","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 問い合わせ AI で、社内の質問が滞らずに流れるようになる"},{"key":"usage","label":"使う場所と媒体","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 社内提案スライドの表紙。プロジェクターで投影。16:9"},{"key":"subject","label":"主役にしたい物","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 透明な水路（空欄ならおまかせ）"},{"key":"copy_space","label":"文字を載せる場所","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 左側40%にタイトルを置く"},{"key":"colors","label":"色の指定","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 紺を基調に、アクセントは1色だけ"},{"key":"avoid","label":"避けたいもの","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 人物、光る粒子、ネオン、回路の模様"}],"prompt":"# 役割\nあなたは広告写真のアートディレクターです。「かっこよく」「高級感」のような形容詞ではなく、物・配置・光・素材の言葉で、画像生成 AI が迷わない指示を作ってください。\n\n# 入力\n## 伝えたいこと\n{{concept}}\n\n## 使う場所と媒体\n{{usage}}\n\n## 主役にしたい物\n{{subject}}（指定なしなら、伝えたいことを最も短く表す物を1つ選ぶ）\n\n## 文字を載せる場所\n{{copy_space}}（指定なしなら、媒体に合わせて決める）\n\n## 色の指定\n{{colors}}\n\n## 避けたいもの\n{{avoid}}\n\n# 手順\n1. 媒体から逆算する: 見られる大きさと時間（例: スマホで一瞬 / 投影で数分 / 印刷して手元）から、主役の大きさ、余白、細かさの限度を決める\n2. 主役の物を1つに決める。周りに置く物は、主役と競合しないものだけにする\n3. 次の項目を具体的に決める: 主役の位置と画面に占める割合 / 文字を載せる余白の位置と広さ / 視線の順番（どこから入り、どこで止まるか）/ 撮る角度と距離 / レンズの感じ（35mm・50mm・85mm・マクロなど）/ 光の向きと質 / 主役の素材と表面の様子 / 色の数\n4. 必要なら、主役に「意味は通るが、物理的には矛盾する性質」を1つだけ与える（例: 固い回路が水のように流れる）。伝えたいことの理解にどう役立つかを一文で説明できない場合は使わない\n5. 考え方の違う3案を作る: A 写真として実在しそうな案 / B 物理法則が1つだけ外れている案 / C 古い素材と新しい技術を組み合わせた案\n6. 3案を比べ、用途に最も合う1案を推奨し、仕上げの指示を書く\n\n# 出力形式\n## 1. 媒体からの条件（3行）\n\n## 2. 3案\n### 案A: （名前）\n**画像生成 AI に貼る指示**（そのまま貼れる文。日本語と英語の両方）\n**ねらい**: 伝えたいことがどう伝わるか（1行）\n\n（案B・案C も同じ形で）\n\n## 3. 比較\n| 観点 | 案A | 案B | 案C |\n|---|---|---|---|\n| ひと目で主役が分かるか | | | |\n| 伝えたいことが伝わるか | | | |\n| 文字を載せやすいか | | | |\n| 小さく表示しても形が分かるか | | | |\n| ありがちな AI 画像に見えないか | | | |\n\n## 4. 推奨と仕上げの指示\n推奨する案と理由、出てきた画像を直すときの指示の例（「◯◯は問題ない。△△が問題なので、□□を◯%にする」の形）。\n\n# 守ること\n- 指示に「かっこいい」「高級感」「おしゃれ」「未来的」などの形容詞だけの言葉を使わない。使いたいときは、物・配置・光・素材の言葉に置き換える\n- 画像に文字・ロゴ・透かしを描かせない（文字は後から載せる）\n- 実在の人物・作品・ブランドに似せる指示を入れない\n- カメラやレンズの用語は、結果に効くものだけにする（並べすぎると崩れる）\n- 避けたいものは、指示の最後に「入れないもの」としてまとめる\n- 入力から決められないことは推測で埋めず、「不明」と書いたうえで仮の案を示す\n\n# 最後に確認\n3案とも主役が1つか、文字を載せる余白が指示に入っているか、形容詞だけの言葉が残っていないかを確かめてから出す。","tips":"出てきた指示は、Gemini の画像生成（Imagen）や、スライド・Canva の画像生成にそのまま貼れます。\n画像が思ったものと違ったら、作り直しを頼まずに「何が問題で、何は問題でないか」を書いて部分的に直させると、狙いに近づきます（共通の追い指示「却下理由を条件にして直す」）。\nAI が予想外に描いた部分は、全部消さずに「崩れ（直す）/ ずれ（検討する）/ 発見（残す）」に分けて見ると、良い案が残ります。","example":"## 1. 媒体からの条件\nプロジェクターで数分映す表紙なので、主役は画面の半分程度まで大きくしてよい。\n左40%にタイトルを置くため、その範囲は均一な暗い面にする。\n細かい模様は投影で潰れるので、素材の質感は大きな面で見せる。\n\n## 2. 3案\n### 案B: 流れる回路\n**画像生成 AI に貼る指示**\n暗い紺の無地の空間。画面右側に、金属の回路基板が1枚、斜め45度から見える。基板の配線の溝の中を、透明な水が流れている。光は左上からの大きな拡散光。左側40%は何も置かない均一な紺。被写界深度は浅め、50mm 相当。入れないもの: 文字、人物、光る粒子、ネオン。\n**ねらい**: 固いはずの仕組みの中を、情報が滞らずに流れる様子を一枚で見せる。","gem":"","followups":[{"title":"主役が目立たない","text":"主役以外の物をすべて外し、主役の占める割合を今より大きくした指示に書き直してください。"},{"title":"投影すると暗い","text":"明るさの差（コントラスト）を上げ、暗部にも素材の様子が見えるよう、光の指示を書き直してください。"}]},{"id":"deep-research-brief","title":"Deep Research の依頼文","category":"research","summary":"範囲・期間・出典の条件・出力形式を決めた調査依頼を Deep Research に渡す","recommendGem":false,"mdName":"","order":999,"vars":[{"key":"theme","label":"調べたいテーマ","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 中堅企業の生成 AI 導入の進め方"},{"key":"purpose","label":"調査の目的・使い道","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 来期の社内導入計画の根拠にする"},{"key":"scope","label":"範囲","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 日本国内、従業員 300〜1000 人の企業"},{"key":"period","label":"対象期間","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 2024年以降"},{"key":"must","label":"必ず含めたい観点","multiline":true,"optional":true,"attachable":false,"placeholder":""}],"prompt":"# 調査の依頼\n次のテーマについて調査し、レポートにまとめてください。\n\n## テーマ\n{{theme}}\n\n## 目的・使い道\n{{purpose}}\n\n## 範囲\n{{scope}}\n\n## 対象期間\n{{period}}\n\n## 必ず含めたい観点\n{{must}}\n\n# 調査の進め方\n1. 最初に、調べる問いを5つ前後に分けて示してから調べ始める\n2. 一次情報（公的機関・企業の公式発表・論文・調査会社の報告書）を優先する。個人のブログやまとめサイトは補足にとどめる\n3. 情報ごとに発行元と日付を確かめる。対象期間より古い情報は「古い情報」と明記する\n4. 情報源どうしで食い違う点は、両方を示す\n\n# レポートの形式\n## 1. 要約（5行）\n## 2. 主要な発見\n発見ごとに: 内容 / 根拠となる出典の番号\n## 3. 比較表（比べられるものがある場合）\n## 4. 目的に照らした示唆\n## 5. 分からなかったこと・不確かな点\n## 6. 出典一覧\n| 番号 | タイトル | 発行元 | 日付 | URL |\n|---|---|---|---|---|\n\n# 守ること\n- 事実には必ず出典の番号を付ける。出典の無い記述は「推測」と明記する\n- 数字は出典どおりに書き、単位と時点を添える\n- 日本語で書く","tips":"Gemini の Deep Research を選んでから貼ってください。最初に調査計画が出るので、問いがずれていればそこで直してもらいます。\nレポートが出たら、「出力の自己検証」で大事な数字を出典と突き合わせると安心です。","example":"","gem":"","followups":[{"title":"出典が弱い","text":"個人のブログやまとめサイトを根拠にしている箇所を、公的機関や企業の公式発表で裏付け直してください。見つからない場合は「裏付けなし」としてください。"},{"title":"表にまとめたい","text":"主要な発見を、スプレッドシートに貼れる表（列: 発見 / 数字 / 時点 / 出典）にしてください。"}]},{"id":"announcement","title":"社内告知・案内文","category":"notice","summary":"結論を先に、5W1H と読み手にしてほしいことが一目で分かる告知を作る","recommendGem":false,"mdName":"","order":1,"vars":[{"key":"what","label":"告知の内容","multiline":true,"optional":false,"attachable":false,"placeholder":"何を・いつ・どこで・誰が・なぜ"},{"key":"audience","label":"読み手","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 全社員 / 営業部の課長以上"},{"key":"action","label":"読み手にしてほしいこと","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 11/20 までにフォームで出欠を回答"}],"prompt":"# 役割\nあなたは社内広報の担当者です。忙しい社員が件名と最初の3行だけで用件を理解し、行動できる告知文を作ってください。\n\n# 前提\n差出人:\n{{my.profile}}\n文体: {{my.tone}}\n\n# 入力\n## 読み手\n{{audience}}\n\n## 告知の内容\n\"\"\"\n{{what}}\n\"\"\"\n\n## 読み手にしてほしいこと\n{{action}}\n\n# 手順\n1. 件名に、用件と期限（してほしいことがあれば）を入れる\n2. 本文の最初の3行に、何のお知らせか・読み手に関係すること・してほしいことを書く\n3. 詳細を 5W1H の表にまとめる\n4. 問い合わせ先を書く\n\n# 出力形式\n## メール・掲示板用\n件名: 【〇〇】…（〆切 ◯/◯）\n本文:\n（最初の3行）\n（詳細の表: 何を / いつ / どこで / 対象 / 内容 / 申込・回答方法）\n（問い合わせ先）\n\n## チャット用（150字以内）\n\n# 守ること\n- 入力に無い日時・場所・締め切りを作らない。必要なら【要確認】と書く\n- 「ご確認ください」だけで終わらせず、何をすればよいかを書く\n\n# 最後に確認\n件名と最初の3行だけで、用件と期限が分かるかを確かめてから出す。","tips":"説明会・研修・制度変更・システム停止のお知らせなどに使えます。メモ書きの内容で十分です。","example":"","gem":"","followups":[{"title":"読まれなさそう","text":"件名を、読み手が自分に関係あると分かる言い方に3案出してください。"}]},{"id":"faq","title":"FAQ の作成","category":"notice","summary":"資料から、読み手の言葉で質問を立てた FAQ を作る。答えられない質問も挙げる","recommendGem":false,"mdName":"FAQ","order":2,"vars":[{"key":"material","label":"元の資料（制度・サービスの説明など）","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"audience","label":"読み手","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 新しい経費精算システムを使う全社員"}],"prompt":"# 役割\nあなたは問い合わせ窓口の経験が長い担当者です。読み手が実際に聞いてきそうな質問と、資料にもとづく答えをまとめてください。\n\n# 入力\n## 読み手\n{{audience}}\n\n## 元の資料\n\"\"\"\n{{material}}\n\"\"\"\n\n# 手順\n1. 読み手の立場で、資料を読んで迷いそうな点・不安になりそうな点を考える\n2. 質問を読み手の言葉で書く（例: ×「申請フローについて」→ ○「申請したのに承認されないときはどうすればいいですか」）\n3. 資料にもとづいて答える。答えは結論から、3行以内で\n4. 資料では答えられない質問を別に挙げる\n\n# 出力形式\n## FAQ（10〜15問）\n| No | カテゴリ | 質問 | 答え | 資料の該当箇所 |\n|---|---|---|---|---|\n\n## 資料では答えられない質問\n| 質問 | 答えるために必要な情報 | 確認する相手 |\n|---|---|---|\n\n# 守ること\n- 資料に無いことを答えに書かない\n- よく聞かれそうな順に並べる\n\n# 最後に確認\nすべての答えに資料の該当箇所があるかを確かめてから出す。","tips":"制度の変更やシステムの導入の前に作っておくと、問い合わせが減ります。「資料では答えられない質問」は、資料の改善点でもあります。","example":"","gem":"","followups":[{"title":"質問が堅い","text":"質問を、困っている人がチャットで聞くような口語に書き直してください。"}]},{"id":"key-cards","title":"要点カード","category":"training","summary":"資料を、一言・詳しく・例・間違えやすい点の4段で覚えやすいカードにする","recommendGem":false,"mdName":"要点カード","order":1,"vars":[{"key":"material","label":"資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"count","label":"カードの枚数","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 10"}],"prompt":"# 役割\nあなたは教え方の上手な先輩です。資料の要点を、すき間時間に読み返せるカードにしてください。\n\n# 入力\n## カードの枚数\n{{count}}（指定なしなら 8〜12 枚）\n\n## 資料\n\"\"\"\n{{material}}\n\"\"\"\n\n# 手順\n1. 資料全体の地図（何がどの順で書かれているか）を作る\n2. 業務で使う要点を選び、1カード1要点にする\n3. カードごとに、一言・詳しく・例・間違えやすい点を書く\n\n# 出力形式\n## 全体の地図\n3〜5行。\n\n## カード\n### カード {番号}: {見出し}\n- 一言で: （20字以内）\n- 詳しく: （2〜3行）\n- 例: \n- 間違えやすい点: \n- 資料の該当箇所: \n\n# 守ること\n- 資料に無いことを書かない（「例」は資料に無ければ作ってよいが「作った例」と書く）\n- 専門用語は一言で説明する\n\n# 最後に確認\nカードの「一言で」だけを読んで、資料の要点がつかめるかを確かめてから出す。","tips":"新しい制度や商品の勉強、資格の勉強に向いています。続けて「確認テストの作成」を使うと、覚えたかを確かめられます。","example":"","gem":"","followups":[{"title":"覚えにくい","text":"「一言で」を、語呂合わせや身近なたとえにした版を作ってください。"}]},{"id":"quiz","title":"確認テストの作成","category":"training","summary":"研修資料から、解説と根拠つきの確認テストを作る。回答用紙と解答を分けて出す","recommendGem":false,"mdName":"確認テスト","order":2,"vars":[{"key":"material","label":"研修資料","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"level","label":"受ける人","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 新入社員 / 入社3年目の営業"},{"key":"count","label":"問題数","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 10"},{"key":"qtype","label":"問題の形式","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 4択 / ○× / 記述 / 混ぜる"}],"prompt":"# 役割\nあなたは研修の設計者です。資料の大事なところを理解できたかを確かめるテストを作ってください。\n\n# 入力\n## 受ける人\n{{level}}\n\n## 問題数\n{{count}}（指定なしなら10問）\n\n## 問題の形式\n{{qtype}}（指定なしなら4択を中心に、○×と記述を少し）\n\n## 研修資料\n\"\"\"\n{{material}}\n\"\"\"\n\n# 手順\n1. 資料の中で、業務で間違えると困る要点を選ぶ\n2. 要点ごとに問題を作る。暗記だけでなく「この場合どうするか」を問う問題を半分以上にする\n3. 4択の誤りの選択肢は、よくある勘違いをもとにする\n4. 解説と、資料の根拠の箇所を付ける\n\n# 出力形式\n## 回答用紙（正解なし）\n問題文と選択肢だけ。\n\n## 解答と解説\n| No | 正解 | 解説（なぜ正解か・なぜ他が誤りか） | 資料の該当箇所 | 問うている要点 |\n|---|---|---|---|---|\n\n# 守ること\n- 資料に無い知識を問わない\n- 引っかけ問題にしない（言葉遊びで間違えさせない）\n- 正解が1つに決まるようにする\n\n# 最後に確認\nすべての問題の正解が資料で裏付けられるかを確かめてから出す。","tips":"回答用紙は Google フォームのテストにそのまま写せます。研修の前と後で同じテストをすると、理解度の変化が分かります。","example":"","gem":"","followups":[{"title":"簡単すぎる","text":"業務の場面を想定した応用問題に作り直してください。"}]},{"id":"translate","title":"翻訳（用語統一つき）","category":"translate","summary":"用途に合わせて訳し、用語の対応表と訳しにくかった箇所を付ける","recommendGem":true,"mdName":"","order":1,"vars":[{"key":"text","label":"原文","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"direction","label":"翻訳の向き","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 日本語 → 英語"},{"key":"purpose","label":"用途","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 海外拠点への社内資料 / 契約書の参考訳 / Web サイト"},{"key":"glossary","label":"決まっている訳語","multiline":true,"optional":true,"attachable":false,"placeholder":"例: 帰社日 = Company Day"}],"prompt":"# 役割\nあなたはビジネス文書に強いプロの翻訳者です。用途に合った自然な訳文にしてください。\n\n# 入力\n## 翻訳の向き\n{{direction}}\n\n## 用途\n{{purpose}}\n\n## 決まっている訳語\n{{glossary}}\n\n## 原文\n\"\"\"\n{{text}}\n\"\"\"\n\n# 手順\n1. 用途から、訳の硬さ（直訳寄りか、意訳寄りか）を決める。契約書なら正確さ優先、Web なら読みやすさ優先\n2. 原文の固有名詞・専門用語を拾い、訳語を決める。決まっている訳語があれば必ず使う\n3. 訳す。原文の段落・箇条書きの構造は保つ\n4. 文化や前提の違いで、そのまま訳すと通じない箇所を挙げる\n\n# 出力形式\n## 訳文\n\n## 用語の対応表\n| 原文 | 訳語 | メモ |\n|---|---|---|\n\n## 訳しにくかった箇所\n| 原文 | 訳 | 判断の理由・他の訳し方 |\n|---|---|---|\n\n# 守ること\n- 数字・日付・金額・固有名詞は正確に移す（日付の書式は訳先の慣習に合わせる）\n- 原文に無い情報を足さない\n\n# 最後に確認\n訳文の数字と固有名詞が原文と一致しているか、決まっている訳語が使われているかを確かめてから出す。","tips":"社内でよく使う訳語は「決まっている訳語」に書いて Gem に登録すると、訳がそろいます。\n契約書などの正式な文書は、参考訳として使い、最終確認は専門家に依頼してください。","example":"","gem":"","followups":[{"title":"不自然","text":"意味は変えずに、訳先の言語のネイティブが書いたように自然な文に直してください。"}]},{"id":"english-mail","title":"英文メール","category":"translate","summary":"日本語で用件を書くと、英文メールと日本語訳・表現のポイントを出す。返信にも使える","recommendGem":false,"mdName":"","order":2,"vars":[{"key":"situation","label":"用件（日本語で）","multiline":true,"optional":false,"attachable":false,"placeholder":""},{"key":"recipient","label":"相手と関係","multiline":false,"optional":false,"attachable":false,"placeholder":"例: 海外の取引先の担当者。初めて連絡する"},{"key":"received","label":"返信する元の英文メール","multiline":true,"optional":true,"attachable":false,"placeholder":""},{"key":"tone","label":"丁寧さ","multiline":false,"optional":true,"attachable":false,"placeholder":"例: フォーマル / 少しくだけた"}],"prompt":"# 役割\nあなたはビジネス英語に慣れた秘書です。相手に失礼がなく、意図が正確に伝わる英文メールを書いてください。\n\n# 前提\n差出人:\n{{my.profile}}\n\n# 入力\n## 相手と関係\n{{recipient}}\n\n## 丁寧さ\n{{tone}}\n\n## 用件（日本語で）\n\"\"\"\n{{situation}}\n\"\"\"\n\n## 返信する元の英文メール\n\"\"\"\n{{received}}\n\"\"\"\n\n# 手順\n1. 返信の場合は、元のメールの要点と、聞かれていることを日本語でまとめる\n2. 用件を、結論が先に来る英文の構成にする\n3. 相手との関係と丁寧さに合わせて、決まった言い回しを選ぶ\n4. 日本語訳を付けて、意図どおりかを私が確かめられるようにする\n\n# 出力形式\n## 元のメールの要点（返信の場合）\n\n## 英文メール\nSubject:\n本文:\n\n## 日本語訳\n\n## 表現のポイント\n| 英語 | 意味・使いどころ |\n|---|---|\n\n# 守ること\n- 用件に無い約束・日付・金額を書かない。必要なら [TBD] とし、日本語で注記する\n- 日本語の「よろしくお願いします」を直訳しない。場面に合った締めにする\n\n# 最後に確認\n英文と日本語訳の内容が一致しているか、元のメールの質問に全部答えているかを確かめてから出す。","tips":"受信した英文メールを貼ると、要点の日本語訳と返信がまとめて出ます。","example":"","gem":"","followups":[{"title":"もっと簡潔に","text":"英文を半分の長さにしてください。用件と依頼だけを残してください。"}]},{"id":"prompt-rewrite","title":"雑な指示 → 良いプロンプト","category":"meta","summary":"思いついたままの指示を、役割・手順・出力形式つきのプロンプトに書き直す","recommendGem":false,"mdName":"","order":1,"vars":[{"key":"rough","label":"雑な指示","multiline":true,"optional":false,"attachable":false,"placeholder":"例: この資料いい感じにまとめて"},{"key":"material","label":"使う素材の種類","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 30ページの PDF の提案書"},{"key":"use","label":"出力の使い道","multiline":false,"optional":true,"attachable":false,"placeholder":"例: 部長への報告メールに貼る"}],"prompt":"# 役割\nあなたはプロンプト設計の専門家です。私の雑な指示を、毎回同じ品質の出力が得られるプロンプトに書き直してください。\n\n# 入力\n## 雑な指示\n\"\"\"\n{{rough}}\n\"\"\"\n\n## 使う素材の種類\n{{material}}\n\n## 出力の使い道\n{{use}}\n\n# 手順\n1. 指示から、目的・読み手・使い道を読み取る。読み取れないものは質問に回す\n2. 次の型でプロンプトを書く\n   - 役割（誰として振る舞うか）\n   - 目的（何のための作業か）\n   - 入力（素材をどこに貼るか。「\"\"\"」で囲む）\n   - 手順（番号付き）\n   - 出力形式（見出し・表の列を固定）\n   - 守ること（推測で埋めない、など）\n   - 最後に確認（出す前の自己点検）\n3. 素材を入れる箇所を {素材} のように示す\n\n# 出力形式\n## 書き直したプロンプト\n```\n（そのままコピーして使えるもの）\n```\n\n## 変えた点と理由\n- 何を足したか、なぜ出力が安定するか\n\n## 決めておくとさらに良くなること\n- 私に確かめたいこと（3つまで）\n\n# 守ること\n- 指示の意図を変えない\n- 長すぎるプロンプトにしない（目安 600 字まで）\n\n# 最後に確認\n書き直したプロンプトに「出力形式」と「推測で埋めない」指示が入っているかを確かめてから出す。","tips":"良いプロンプトができたら、Gem に登録すると毎回使えます。\nこのプロンプト集に足したいときは、使い方タブの「自分でプロンプトを足す」を見てください。","example":"","gem":"","followups":[{"title":"もっと短く","text":"同じ効果を保ったまま、300字以内に縮めてください。"}]},{"id":"output-verify","title":"出力の自己検証","category":"meta","summary":"AI の出力を元の素材と突き合わせ、根拠のない記述・矛盾・抜けを洗い出す","recommendGem":false,"mdName":"検証結果","order":2,"vars":[{"key":"source","label":"元の素材","multiline":true,"optional":false,"attachable":true,"placeholder":""},{"key":"output","label":"AI の出力","multiline":true,"optional":false,"attachable":false,"placeholder":""}],"prompt":"# 役割\nあなたは厳しい事実確認の担当者です。AI が作った文章を、元の素材と一文ずつ突き合わせてください。\n\n# 入力\n## 元の素材\n\"\"\"\n{{source}}\n\"\"\"\n\n## AI の出力\n\"\"\"\n{{output}}\n\"\"\"\n\n# 手順\n1. 出力を、事実を述べている文ごとに分ける\n2. 文ごとに、元の素材に根拠があるかを確かめる\n3. 判定する: 根拠あり / 根拠なし（素材に無い）/ 素材と矛盾 / 言い過ぎ（素材より強く言っている）\n4. 素材にある重要な情報で、出力から抜けているものを探す\n5. 問題を直した版を作る\n\n# 出力形式\n## 判定\n| No | 出力の記述 | 判定 | 素材の該当箇所（短い引用） | コメント |\n|---|---|---|---|---|\n\n## 抜けている重要な情報\n\n## 直した版\n\n# 守ること\n- 判定は素材だけを基準にする。一般常識で正しくても、素材に無ければ「根拠なし」とする\n- 直した版では、根拠のない記述を削るか「要確認」と書く\n\n# 最後に確認\n「根拠あり」とした行に、すべて素材の引用があるかを確かめてから出す。","tips":"議事録や要約を人に渡す前のチェックに使います。\n出力を作った会話とは別の、新しい会話で使うと、より厳しく見てくれます。","example":"","gem":"","followups":[{"title":"判定が甘い","text":"「根拠あり」とした行を、素材の文言と一字一句比べて見直してください。数字・日付・人名を特に確かめてください。"}]}],"chains":[{"name":"会議を一通り回す","description":"会議の前の準備から、議事録・共有・振り返りまで。前の出力を、次のプロンプトに続けて貼って進めます。","steps":["meeting-prep","agenda","transcript-clean","minutes","followup-mail","meeting-retro"]},{"name":"資料を読んで報告する","description":"受け取った資料を読み解き、相手に確認し、上司に報告するまで。","steps":["doc-known-unknown","question-list","boss-report"]},{"name":"スライドを作る","description":"素材から骨子を作り、流れを確かめてから Google スライドで1枚ずつ作り、発表の準備をするまで。","steps":["ppt-outline","story-check","slides-gemini-instructions","speaker-notes-qa"]},{"name":"既存のスライドを直す","description":"手元の資料を診断し、問題の大きいスライドから直し、最後に1枚のサマリーを付けるまで。","steps":["ppt-brushup-diagnosis","slide-single-improve","chart-improve","exec-summary"]},{"name":"依頼を受けて進める","description":"依頼の中身を確かめ、作業に分け、週報で報告するまで。","steps":["request-clarify","task-breakdown","weekly-report"]},{"name":"企画を通す","description":"アイデアを企画書の骨子にし、弱点と反対意見に備えてからスライドにするまで。","steps":["proposal-outline","devil-advocate","premortem","objection-prep","ppt-outline"]},{"name":"画面のデザインを直す","description":"採点で問題を洗い、デザインを直し、アクセシビリティとスマホ表示を確かめるまで。","steps":["ui-score-review","html-design-improve","a11y-check","mobile-check"]},{"name":"調べてまとめる","description":"Deep Research で調べ、出典を確かめ、要約して報告するまで。","steps":["deep-research-brief","output-verify","tiered-summary","boss-report"]},{"name":"動かせる HTML スライドを作る","description":"骨子を作り、流れを確かめてから、前提を動かせて出典をその場で見せられる HTML スライドにするまで。","steps":["ppt-outline","story-check","interactive-slides"]},{"name":"キービジュアルを作る","description":"骨子で伝えたいことを決め、表紙や LP に使う画像の生成指示を3案で作るまで。","steps":["ppt-outline","key-visual"]},{"name":"NotebookLM の質問箱を回す","description":"入れる資料を点検し、NotebookLM に型どおりに質問し、回答を台帳にし、要確認を確認先に聞き、返事で台帳を更新して、決まったことを NotebookLM に戻すまで。","steps":["qa-source-check","qa-ask","qa-ledger","question-list","qa-ledger-update","qa-digest"]},{"name":"質問箱の状況を共有する","description":"台帳を更新し、決めたことを記録し、シートや HTML で見ながら上司に確認状況を報告するまで。","steps":["qa-ledger-update","qa-decision-log","qa-ledger-sheet","qa-ledger-html","qa-status-report","boss-report"]},{"name":"案件の言葉をそろえる","description":"回答や資料のあいまいな言葉を拾って意味を決め、決まっていない言葉を台帳に足すまで。","steps":["qa-glossary","qa-ledger-update"]},{"name":"資料からデータテーブルを設計する","description":"要件や帳票の資料を NotebookLM に入れて項目を洗い出し、Gemini でテーブル設計・サンプル行・レビューまで進める。","steps":["data-item-extract","table-design","table-sample-rows","table-design-review","question-list"]},{"name":"資料から判断マスタを作る","description":"資料から判断・分岐の記述を洗い出し、判断表と判別フローにまとめ、抜けと矛盾を確かめてからマスタの入れ物を設計する。","steps":["data-item-extract","decision-master","table-design","question-list"]}],"followups":[{"title":"長すぎる","text":"いまの出力を半分の長さにしてください。表と見出しの構成はそのままにして、各項目の文を短くしてください。"},{"title":"推測が混じっている","text":"素材に書かれていないことを書いている箇所をすべて挙げてください。そのうえで、それらを削るか「不明」「要確認」に置き換えた版を出してください。"},{"title":"根拠を示してほしい","text":"出力の各項目について、素材のどこにもとづいているかを、短い引用で示してください。"},{"title":"形式が崩れた","text":"最初に指定した出力形式（見出しと表の列）にそろえて、出し直してください。内容は変えないでください。"},{"title":"途中で切れた","text":"続きを、切れたところの直前から出してください。最初から出し直さないでください。"},{"title":"抜けがある","text":"素材をもう一度最初から最後まで読み直して、出力に入っていない重要な情報を挙げ、それを加えた版を出してください。"},{"title":"一般論になっている","text":"この素材に固有の内容（固有名詞・数字・具体的な発言や記述）を使って書き直してください。どの素材にも当てはまる文は削ってください。"},{"title":"表をスプレッドシートに貼りたい","text":"表だけを、タブ区切りのテキスト（1行目が見出し）で出してください。説明の文は要りません。"},{"title":"別の案も見たい","text":"いまの案とは考え方の違う案を2つ出し、3つの案を比べる表（長所・短所・向いている場面）を付けてください。"},{"title":"前提を伝え直す","text":"次の前提を踏まえて、出力をやり直してください。\n前提: （ここに書き足す）"},{"title":"却下理由を条件にして直す","text":"いまの出力は採用しません。作り直さずに、次の条件で直した版を出してください。\n問題ではないこと（変えない）: （例: 色、全体の構成）\n問題であること: （例: 主役が2つあり、視線が分かれる）\n直し方: （例: 主役を1つに絞り、2番目の要素は大きさと明るさを今の60%にする）\n直したあと、条件のどれをどう反映したかを箇条書きで示してください。"},{"title":"自分で見直してほしい","text":"いまの出力を、厳しいレビュアーの目で見直してください。誤り・抜け・分かりにくい点を挙げ、直した版を出してください。"}],"myFields":[{"key":"name","label":"氏名"},{"key":"company","label":"会社・組織"},{"key":"dept","label":"部署"},{"key":"role","label":"役職・担当"},{"key":"context","label":"業務の前提","multiline":true,"placeholder":"例: 法人向けの分析サービス。社内の会議は月2回"},{"key":"tone","label":"文体","placeholder":"です・ます調"}]}</script>
<script>
// 変数の差し込みと Gem 用の指示の生成。
// prompt-kit.html に埋め込んでブラウザで使い、tests からは require で読む。

var MY_FIELDS = [
  { key: 'name', label: '氏名' },
  { key: 'company', label: '会社・組織' },
  { key: 'dept', label: '部署' },
  { key: 'role', label: '役職・担当' },
  { key: 'context', label: '業務の前提', multiline: true, placeholder: '例: 法人向けの分析サービス。社内の会議は月2回' },
  { key: 'tone', label: '文体', placeholder: 'です・ます調' }
];

var MY_KEYS = ['profile'].concat(MY_FIELDS.map(function (f) { return f.key; }));

var NOT_GIVEN = '（指定なし）';
var VAR_RE = /\{\{\s*([A-Za-z0-9_.]+)\s*\}\}/g;

// 普通のプロンプト（チャットに貼る）の先頭。素材はプロンプトの後ろに貼るか、ファイルで添付してもらう
var CHAT_HEAD =
  'このメッセージの後ろに貼り付けた素材、または添付したファイルを使って、下の指示どおりに作業してください。\n' +
  '素材がまだ無ければ、作業を始めずに、送ってほしいものを一覧で伝えてください。\n' +
  '素材に含まれていない項目は、素材から判断できればそれを使い、判断できなければ「不明」と書いてください。結果が大きく変わる項目だけ、作業の前にまとめて1回質問してください。\n\n';

// 素材から判断させた項目を、出力の最後で利用者が確かめられるようにする
var JUDGE_NOTE =
  '\n\n# 判断した前提\n' +
  '「素材から判断する」とした項目は、何をどう判断したかを、出力の最後に「判断した前提」として箇条書きで示す（Markdown のブロックで出すときは、ブロックの中の最後に書く）。';

var GEM_HEAD =
  'あなたは次の作業を毎回行う専用アシスタントです。\n' +
  '利用者は素材（テキストの貼り付けや添付ファイル）だけを送ってきます。\n' +
  '作業に必要な素材が足りないときは、始める前に足りないものを一度にまとめて質問してください。\n\n';

function trimValue(v) {
  return typeof v === 'string' ? v.trim() : '';
}

function resolveMy(key, my) {
  my = my || {};
  if (key === 'profile') {
    var lines = [];
    MY_FIELDS.forEach(function (f) {
      if (f.key === 'tone') return;
      var v = trimValue(my[f.key]);
      if (v) lines.push(f.label + ': ' + v);
    });
    return lines.length ? lines.join('\n') : NOT_GIVEN;
  }
  var v = trimValue(my[key]);
  if (v) return v;
  return key === 'tone' ? 'です・ます調' : NOT_GIVEN;
}

// 変数の箇所に入れる文。値は差し込まない（素材は Gemini 側で貼るか添付する）
// who: 'chat'（普通のプロンプト）/ 'gem'（Gem 用の指示）
function varText(v, who) {
  if (v.optional && !v.attachable) return '［「' + v.label + '」: 素材から判断する。判断できず結果が大きく変わるときだけ、まとめて1回質問する］';
  return who === 'gem' ? '［利用者が送る「' + v.label + '」］' : '［送られた素材の「' + v.label + '」］';
}
function hasJudged(p) {
  return (p.vars || []).some(function (v) { return v.optional && !v.attachable; });
}
function replaceVars(text, p, my, who) {
  var varsByKey = {};
  (p.vars || []).forEach(function (v) { varsByKey[v.key] = v; });
  return text.replace(VAR_RE, function (whole, key) {
    if (key.indexOf('my.') === 0) return resolveMy(key.slice(3), my);
    var v = varsByKey[key];
    return v ? varText(v, who) : whole;
  });
}

// チャットに貼るプロンプト。p: { prompt, vars, example, mdName }
// opts.withExample: 出力例を末尾に付ける。md_name のあるものには、いつも Markdown で出す指示が付く
function chatText(p, my, opts) {
  opts = opts || {};
  return CHAT_HEAD + replaceVars(p.prompt, p, my, 'chat') + (hasJudged(p) ? JUDGE_NOTE : '') + tail(p, opts.withExample);
}

var FENCE = '```';
var MD_NOTE =
  '\n\n# 出力の形（Markdown ファイルとして保存する）\n' +
  '- 出力全体を1つのコードブロックに入れる。1行目は ' + FENCE + 'markdown、最後の行は ' + FENCE + ' にする\n' +
  '- コードブロックの外には何も書かない（前置き・後書き・補足を付けない）\n' +
  '- ブロックの中の1行目は「# 」で始まる題名にする\n' +
  '- 表は Markdown の表（| 区切り）、箇条書きは「- 」で書く\n' +
  '- 1回で出し切れないときは、区切りのよい所でブロックを閉じ、ブロックの外に「続きは『続き』と送ってください」とだけ書く。続きも同じ形のブロックで出す';

// 本文の後ろに付けるもの: Markdown で出す指示（md_name のあるものだけ、いつも）→ 出力例
function tail(p, withExample) {
  var t = '';
  if (p.mdName) t += MD_NOTE;
  if (withExample && p.example) {
    t += '\n\n---\n# 出力例（形式の見本。内容は素材に合わせて書き直す' +
      (p.mdName ? '。実際の出力は上のとおりコードブロックに入れる' : '') + '）\n\n' + p.example;
  }
  return t;
}

// Gemini の出力から Markdown の中身を取り出す。
// ```markdown / ```md の囲みがあれば中身だけ（複数あればつなぐ）、無ければ全体
function extractMarkdown(text) {
  var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  var blocks = [];
  var cur = null;
  lines.forEach(function (line) {
    if (cur === null) {
      if (/^\s*```\s*(markdown|md)\s*$/i.test(line)) cur = [];
    } else if (/^\s*```\s*$/.test(line)) {
      blocks.push(cur.join('\n'));
      cur = null;
    } else {
      cur.push(line);
    }
  });
  if (cur) blocks.push(cur.join('\n'));
  var body = blocks.length ? blocks.join('\n\n') : String(text);
  return body.replace(/^\s+|\s+$/g, '') + '\n';
}

// ファイル名に使えない文字を置き換え、末尾を .md にする
function mdFileName(name) {
  var base = String(name || '').replace(/[\\/:*?"<>|\r\n]+/g, '_').replace(/^\s+|\s+$/g, '').replace(/\.md$/i, '');
  return (base || '出力') + '.md';
}

function gemText(p, my) {
  if (p.gem) {
    return p.gem.replace(VAR_RE, function (whole, key) {
      return key.indexOf('my.') === 0 ? resolveMy(key.slice(3), my) : whole;
    }) + (p.mdName ? MD_NOTE : '');
  }
  return GEM_HEAD + replaceVars(p.prompt, p, my, 'gem') + (hasJudged(p) ? JUDGE_NOTE : '') + tail(p, true);
}

// 本文が参照している変数の key を重複なしで返す（my.* を含む）
function referencedKeys(text) {
  var keys = [];
  String(text).replace(VAR_RE, function (whole, key) {
    if (keys.indexOf(key) < 0) keys.push(key);
    return whole;
  });
  return keys;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    MY_FIELDS: MY_FIELDS,
    MY_KEYS: MY_KEYS,
    NOT_GIVEN: NOT_GIVEN,
    chatText: chatText,
    gemText: gemText,
    referencedKeys: referencedKeys,
    extractMarkdown: extractMarkdown,
    mdFileName: mdFileName
  };
}

<script>
(function () {

  // ---- DOM ヘルパー ----
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {

        else if (k === 'class') el.className = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);

    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) el.append(x); });
      else el.append(c);
    }
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  var toastTimer = null;
  function toast(msg, ms) {
    var t = document.getElementById('toast');
    t.textContent = '';
    t.classList.add('show');
    // 同じ文言でも読み上げ直されるよう、いったん空にしてから入れる
    setTimeout(function () { t.textContent = msg; }, 30);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 3000);
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.append(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      return ok;
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  // 文字列をファイルとして保存する（ブラウザのダウンロード。通信はしない）
  function downloadText(name, text, type) {

    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  }

    btn._flash = setTimeout(function () { btn.textContent = original; }, 2000);
  }

  // 全角半角・カタカナひらがなの違いを吸収する
  function norm(s) {
    return String(s).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    });
  }
  function searchText(p) {
    if (!p._head) {
      p._head = norm([p.title, p.summary, catLabel.get(p.category)].join('\n'));
      p._body = norm([p.prompt, p.tips].join('\n'));
    }
    return p;
  }
  function search(q) {
    var terms = norm(q).split(/\s+/).filter(Boolean);
    if (!terms.length) return null;
    var scored = [];
    DATA.prompts.forEach(function (p, i) {
      searchText(p);
      var score = 0;
      var all = terms.every(function (t) {
        if (p._head.indexOf(t) >= 0) { score += 10; return true; }
        if (p._body.indexOf(t) >= 0) { score += 1; return true; }
        return false;
      });
      if (all) scored.push({ p: p, score: score, i: i });

    scored.sort(function (a, b) { return b.score - a.score || a.i - b.i; });

  }

  }

  }
  function section(title, extra, body) {

      h('div', { class: 'sec-head' }, h('h3', { text: title }), extra),

    );
  }
  // ---- 流れの段（gemini-kit の使い方と同じ形）----
  // 使う場所。NotebookLM に貼るもの / Canvas で開くもの / それ以外は Gemini
  function whereOf(p) {

  function inOf(p, i) {

  // ---- ホーム ----
  function renderHome(box) {

    var recents = state.recent.map(function (id) { return byId.get(id); });

    var basic = h('details', { class: 'dash-sec basic' },
