<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>プロンプト集 for Gemini</title>
<style>
body{margin:0;background:#F4F6F9;color:#1E2530;font:15px/1.8 Arial,"メイリオ",Meiryo,sans-serif}
main{max-width:640px;margin:48px auto;padding:28px 32px;background:#fff;border:1px solid #D5DCE5;border-radius:12px}
h1{margin:0 0 6px;font-size:22px;color:#1F3A5F}
p{margin:8px 0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.btns a{display:inline-block;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:bold}
.open{background:#1F3A5F;color:#fff}
.dl{border:1px solid #1F3A5F;color:#1F3A5F;background:#fff}
.btns a:focus-visible{outline:3px solid #B8892B;outline-offset:2px}
.note{font-size:13px;color:#5A6573}
</style>
</head>
<body>
<main>
<h1>プロンプト集 for Gemini</h1>
<p>Gemini（Web 画面・Gems・Canvas・NotebookLM）に貼るプロンプトを、用途別にまとめたものです。素材を入力欄に入れてコピーし、Gemini に貼って使います。HTML 1 枚で動き、外部へは送信しません。</p>
<div class="btns">
  <a class="open" href="prompt-kit.html">開く</a>
  <a class="dl" href="prompt-kit.html" download="prompt-kit.html">HTML をダウンロード</a>
</div>
<p class="note">ダウンロードした prompt-kit.html は、ダブルクリックでオフラインのまま開けます。開いた画面の右上の「HTML を保存」でも同じファイルを保存できます。</p>
<p class="note">お気に入り・最近使ったもの・自分の情報はブラウザの中（開いた場所ごと）に保存されます。入力欄に貼った素材は保存しません。</p>
</main>
</body>
</html>
